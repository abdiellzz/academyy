veles:[{id:"que-es-seguridad",nivel:0,titulo:"¿Qué es la seguridad informática?",subtitulo:"Nivel 0: qué proteges, de quién y por qué. Cero jerga.",minutos:8,icono:"shield",objetivos:["Explicar qué es la seguridad informática con tus palabras.","Reconocer las tres propiedades: confidencialidad, integridad y disponibilidad.","Distinguir amenaza, vulnerabilidad y riesgo."],teoria:[{t:"why",text:"Cada cuenta, cada foto y cada chat viven en computadoras que no son tuyas. Entender cómo te protegen (y cómo fallan) es la diferencia entre perderlo todo por un clic o reaccionar a tiempo."},{t:"p",text:"Seguridad informática es el conjunto de decisiones que mantienen tus datos completos, disponibles y solo para quien debe verlos. No es un antivirus: es una forma de trabajar."},{t:"table",head:["Propiedad","Qué significa","Si falla"],rows:[["Confidencialidad","Solo quien debe puede verlo","Se filtra tu contraseña o tus fotos"],["Integridad","Nadie lo cambia por el camino","Te alteran una transferencia o un archivo"],["Disponibilidad","Está ahí cuando lo necesitas","Te cifran el disco y no puedes entrar"]]},{t:"porque",text:"Las tres van juntas y a veces se pelean. Cifrar un archivo protege la confidencialidad, pero si pierdes la llave también perdiste la disponibilidad. Un respaldo te devuelve la disponibilidad, pero si no está cifrado puede romper la confidencialidad. Seguridad es elegir el equilibrio, no maximizar una sola."},{t:"h",text:"Amenaza, vulnerabilidad y riesgo"},{t:"p",text:"Amenaza es quien quiere hacerte daño: un estafador, un virus, un exnovio enojado. Vulnerabilidad es la puerta abierta: la contraseña «123456», un sistema sin actualizar, un enlace en el que confías. Riesgo es la mezcla de las dos: la probabilidad real de que pase algo."},{t:"tip",text:"No existe la seguridad perfecta. Pero cuatro cosas evitan la gran mayoría de ataques que te van a pasar: contraseñas largas y únicas, verificación en dos pasos, actualizar y tener respaldos."}],ejemplos:[{juego:"panama",titulo:"El Yappy del «primo»",texto:"Un número nuevo escribe: «primo, soy yo, se me dañó el celular, hazme un Yappy de $50 y luego te explico». Es la tríada al revés: quiere confidencialidad (que no verifiques), integridad (que la transferencia sea real) y disponibilidad (tu plata, ya, en su cuenta)."},{juego:"minecraft",titulo:"El servidor sin whitelist",texto:"Cualquiera entra y puede romper el spawn. Con whitelist solo entran los invitados: eso es control de acceso, la parte práctica de la confidencialidad."},{juego:"fortnite",titulo:"La cuenta con la skin de $100",texto:"La contraseña era la misma del correo. Cuando filtraron un foro viejo, entraron al correo, resetearon Epic y se llevaron la cuenta. Una vulnerabilidad vieja, una amenaza real, un riesgo que nadie calculó."}],practica:[{tipo:"escribir",pregunta:"¿Cómo se llama la propiedad que garantiza que la información no fue modificada (ni un peso, ni una coma)?",respuestas:["integridad"],pista:"Es una de las tres de la tríada y empieza con I.",explicacion:"Integridad. Si alguien cambia el número de cuenta de una factura, la confidencialidad puede seguir intacta pero la integridad está rota: el archivo dice algo que no dijiste.",porque:"La integridad se comprueba con hashes: una huella matemática del archivo. Si cambia un solo byte, la huella cambia por completo. Por eso las descargas serias publican el SHA-256: tú lo calculas y comparas."},{tipo:"orden",titulo:"Piensa como analista: evalúa un sitio nuevo antes de meter tus datos",pasos:["Mira el dominio exacto: letra por letra, de derecha a izquierda","Busca quién lo hizo: ¿es una empresa o un nombre inventado de ayer?","Comprueba que use HTTPS con candado y que el dominio coincida con el del candado","Usa una contraseña nueva y única, nunca la del correo","Activa la verificación en dos pasos en cuanto puedas"],porque:"Se hace en ese orden a propósito: si el dominio es falso, nada de lo demás importa. El candado solo dice que la conexión está cifrada, no que el sitio sea bueno; y una contraseña única limita el daño si igual te equivocas."}],reto:{pregunta:"¿Cuál de estas es una VULNERABILIDAD y no una amenaza?",opciones:["Un estafador que manda SMS falsos","Tener la misma contraseña «123456» en todas tus cuentas","Un virus de ransomware que circula por correo","Un grupo de hackers que ataca bancos"],respuesta:1,explicacion:"La vulnerabilidad es la puerta abierta (tu contraseña repetida). El estafador, el virus y el grupo de hackers son amenazas. El riesgo aparece cuando la amenaza encuentra la puerta abierta."}},{id:"contrasenas",nivel:1,titulo:"Contraseñas que aguantan y 2FA",subtitulo:"Nivel 1: la llave de tu vida digital y el candado extra.",minutos:10,icono:"key",objetivos:["Medir la fuerza real de una contraseña (entropía).","Explicar por qué una frase larga gana a un garabato corto.","Elegir el segundo factor que de verdad te protege."],teoria:[{t:"why",text:"La mayoría de las filtraciones que afectan a gente normal empiezan con una contraseña reutilizada o débil. Una sola filtración de una página tonta puede abrir tu correo, y con el correo, todo lo demás."},{t:"p",text:"Una contraseña no se mide en símbolos raros: se mide en entropía, o sea, cuántas combinaciones hay que probar. Cada carácter extra multiplica el trabajo del atacante; un símbolo solo suma un poquito."},{t:"table",head:["Contraseña","Tiempo estimado en caer","Por qué"],rows:[["123456","Menos de 1 segundo","Está en todas las listas de contraseñas filtradas"],["P@n4m4!","Minutos","Corta y con sustituciones predecibles: los programas ya las prueban"],["correcaminos","Horas","Es una palabra de diccionario; los ataques usan diccionarios enormes"],["cafe-caliente-arena-2026","Siglos","Cuatro palabras al azar: un espacio de búsqueda gigantesco"]]},{t:"porque",text:"La memoria humana es mala con «x7$Kq!» pero buenísima con imágenes. Por eso una frase de cuatro palabras al azar es a la vez fácil de recordar y difícil de adivinar. Y como no puedes memorizar 60 frases distintas, la solución real es un gestor de contraseñas: recuerdas una sola y él recuerda el resto."},{t:"h",text:"Segundo factor: qué es y cuál elegir"},{t:"list",items:["Algo que sabes: la contraseña.","Algo que tienes: tu celular, una llave física, un código temporal.","Algo que eres: tu huella o tu cara.","El SMS es el segundo factor más débil: se puede robar tu número con un duplicado de SIM (SIM swapping).","Una app autenticadora (TOTP) o una passkey resisten muchísimo mejor."]},{t:"tip",text:"Nunca reutilices la contraseña del correo. Si cae esa, con «olvidé mi contraseña» cae todo lo demás que tengas."}],ejemplos:[{juego:"fortnite",titulo:"El combo que te saca la cuenta",texto:"Correo con contraseña repetida + sin 2FA = cualquiera que compre una lista filtrada entra a Epic, cambia el correo y vende la cuenta con todas sus skins. Con 2FA ni con la contraseña pueden."},{juego:"minecraft",titulo:"La frase del servidor",texto:"«bloque-tierra-luna-verde» es más fuerte que «M1n3cr4ft!». Cuatro palabras al azar tienen muchísimas más combinaciones que ocho letras con números cambiados."},{juego:"panama",titulo:"El código que te piden por WhatsApp",texto:"«Te mandé un código por error, pásamelo». Ese código es tu segundo factor. Si lo das, la contraseña ya no importa. Nadie legítimo te pide un código."}],practica:[{tipo:"password",porque:"El medidor calcula la entropía real y estima cuánto tardaría un ataque de fuerza bruta. Fíjate en algo: pasar de 8 a 16 caracteres multiplica por 128 el trabajo del atacante, mientras que cambiar una «a» por un «@» casi no mueve la aguja."},{tipo:"orden",titulo:"Monta un gestor de contraseñas sin regalarle tu vida",pasos:["Instálalo desde la tienda oficial o la web del fabricante","Crea una contraseña maestra larga (una frase) que no uses en ningún otro sitio","Activa la verificación en dos pasos en la cuenta del gestor","Migra primero las cuentas críticas: correo, banco, redes principales","Cambia las contraseñas repetidas por únicas y largas","Descarga el kit de recuperación y guárdalo apagado, fuera de la nube"],porque:"El gestor concentra todas tus llaves, así que también concentra el riesgo. Contraseña maestra única + 2FA + kit de recuperación es justo lo que evita que un error te deje fuera de tus propias cuentas."},{tipo:"escribir",pregunta:"El SMS se puede interceptar duplicando tu SIM. ¿Qué segundo factor lo resiste mejor?",respuestas:["aplicacion autenticadora","app autenticadora","totp","passkey","llave de seguridad"],pista:"Genera un código nuevo cada 30 segundos en tu propio teléfono, sin usar la red de tu operador.",explicacion:"Una app autenticadora (TOTP) o una passkey. El código se genera en tu dispositivo con un secreto compartido, así que clonar tu SIM no sirve de nada.",porque:"El SMS depende de tu operador: si alguien convence a la tienda de que eres tú y saca un duplicado de tu SIM, recibe tus mensajes. Un secreto que vive en tu teléfono nunca pasa por la red del operador."}],reto:{pregunta:"¿Cuál de estas contraseñas es la más fuerte?",opciones:["P@n4m4!2026","Mi perro se llama Toby","verde-camion-luna-taza","qwertyuiop123"],respuesta:2,explicacion:"Cuatro palabras al azar (verde-camion-luna-taza) tienen muchísima más entropía que una palabra con números o sustituciones. Las frases largas ganan."}},{id:"enlaces-falsos",nivel:2,titulo:"Enlaces falsos y estafas",subtitulo:"Nivel 2: el arte de leer un dominio antes de hacer clic.",minutos:9,icono:"flag",objetivos:["Leer un dominio de derecha a izquierda y detectar el impostor.","Reconocer los disfraces clásicos: subdominios, guiones, letras cambiadas.","Verificar siempre por un canal distinto al del mensaje."],teoria:[{t:"why",text:"Casi todas las estafas que llegan por WhatsApp, correo o Instagram terminan en un enlace. Saber leer el dominio es la habilidad que más veces te va a salvar la plata."},{t:"p",text:"Un dominio se lee de derecha a izquierda, y lo que manda es lo que está justo antes del primer punto por la derecha. En banco.com.pa el dominio es com.pa; en banco-general-seguro.webredirect.org el dominio es webredirect.org, no «banco»."},{t:"table",head:["Lo que ves","Dominio real","Qué es"],rows:[["banco.com.pa/login","com.pa","Legítimo (ojo con la ortografía exacta)"],["banco.com.pa.seguro.xyz","seguro.xyz","Falso: «banco.com.pa» es solo un subdominio"],["bancop4n4ma.com","bancop4n4ma.com","Falso: número por letra (typosquatting)"],["banco-com.pa","banco-com.pa","Falso: guion en medio del nombre"]]},{t:"porque",text:"Los estafadores no hackean el banco: compran un dominio parecido por unos dólares y copian la página. Juegan con que nuestro cerebro lee la primera palabra y ya. Por eso hay que mirar el final del dominio, letra por letra, y desconfiar de los guiones y los números."},{t:"warn",text:"El candado HTTPS no significa «confiable»: hoy cualquier sitio, incluso uno falso, puede tener candado. Solo significa que la conexión va cifrada."}],ejemplos:[{juego:"panama",titulo:"«Su paquete está retenido»",texto:"SMS de una paquetería con un enlace que pide $2 para liberar el paquete. El dominio no es el de la empresa. Pagas $2 y entregas los datos de tu tarjeta."},{juego:"fortnite",titulo:"V-Bucks gratis",texto:"Sitio con el logotipo de Epic, dominio «epic-gifts.net», pide usuario y contraseña. Si los das, te quedas sin cuenta y sin V-Bucks."},{juego:"minecraft",titulo:"El plugin del servidor",texto:"«Descarga este mod para tener /fly». El enlace lleva a un .jar con un roba-contraseñas. El nombre del archivo se parece al oficial, pero el dominio no."}],practica:[{tipo:"phishing",cantidad:10,porque:"Practicar con mensajes reales entrena el reflejo: prisas, enlaces raros y datos que no deberían pedirte. La señal casi siempre está en el remitente o en el dominio, no en el texto bonito."},{tipo:"escribir",pregunta:"En el enlace https://netflix-cuentas.seguro-login.xyz, ¿cuál es el dominio real?",respuestas:["seguro-login.xyz","seguro login xyz","xyz"],pista:"Lee de derecha a izquierda hasta el primer punto.",explicacion:"El dominio es seguro-login.xyz. Todo lo de la izquierda («netflix-cuentas») es un subdominio inventado para que te confíes.",porque:"Quien controla el dominio controla todos los subdominios. Por eso un estafador puede poner «netflix» o «banco» a la izquierda sin pedir permiso a nadie: no está usando su dominio, está usando el suyo con nombre bonito."}],reto:{pregunta:"Recibes un SMS del «banco» pidiendo verificar tu cuenta con un enlace. ¿Qué haces?",opciones:["Entro rápido antes de que bloqueen la cuenta","Entro solo si el candado HTTPS aparece","No toco el enlace: abro la app o llamo al número del reverso de mi tarjeta","Reenvío el mensaje a un amigo para preguntarle"],respuesta:2,explicacion:"Verificar por otro canal es la única defensa que no depende de que tú detectes el disfraz. El banco nunca te pide datos por un enlace en un SMS."}},{id:"malware-respaldos",nivel:3,titulo:"Malware, parches y respaldos",subtitulo:"Nivel 3: lo que se rompe, cómo se arregla y cómo no perderlo.",minutos:11,icono:"monitor",objetivos:["Distinguir virus, troyano, spyware y ransomware.","Explicar por qué actualizar es la defensa número uno.","Aplicar la regla 3-2-1 de respaldos y comprobarla con un hash."],teoria:[{t:"why",text:"La mayoría de los ataques exitosos no usan un truco nuevo: usan un fallo que el fabricante ya arregló y tú no instalaste. Actualizar es aburrido y salva más datos que cualquier antivirus."},{t:"p",text:"Malware es cualquier programa hecho para dañarte. Virus: se pega a otros archivos. Troyano: se disfraza de algo útil. Spyware: espía lo que haces. Ransomware: cifra tus archivos y pide plata para devolverlos."},{t:"porque",text:"Actualizar sirve porque los parches cierran puertas concretas que ya se conocen y ya se están explotando. Un Windows sin parches es una casa con las llaves puestas: el atacante no necesita adivinar nada, sigue el mapa."},{t:"h",text:"La regla 3-2-1 de respaldos"},{t:"list",items:["3 copias de tus datos importantes.","2 medios distintos (por ejemplo, disco externo y nube).","1 copia fuera de tu casa o fuera de tu red, para que un incendio o un ransomware no se lleve todo.","Y una regla extra: un respaldo que nunca restauraste no es un respaldo, es una esperanza."]},{t:"warn",text:"El ransomware cifra también los discos externos conectados. Desconecta el respaldo después de copiar y guarda una versión que no esté montada."}],ejemplos:[{juego:"panama",titulo:"La factura que era un .exe",texto:"«Factura_0231.pdf.exe». El sistema oculta la segunda extensión: parece un PDF y es un programa. Si lo abres, se instala solo y cifra todo."},{juego:"minecraft",titulo:"El mod que pedía permisos de más",texto:"Un mod de 200 MB que pide acceso a tu carpeta de .minecraft, a tus contraseñas guardadas y a la red. Nada de eso hace falta para poner /fly."},{juego:"fortnite",titulo:"El «optimizador» de FPS",texto:"Programas que prometen subir FPS y en realidad minan criptomonedas con tu tarjeta gráfica (cryptojacking). Se nota porque la PC va lenta y el ventilador grita."}],practica:[{tipo:"codigo",codigo:`import hashlib

mensaje = b"hola mundo"
huella = hashlib.sha256(mensaje).hexdigest()

print("huella:", huella[:16])
print("integra:", huella == hashlib.sha256(b"hola mundo").hexdigest())
print("cambio:", huella == hashlib.sha256(b"hola mund0").hexdigest())`,salida:`huella: 0b894166d3336435
integra: True
cambio: False`,explicacion:"El hash es la huella del archivo: si cambia un solo carácter, la huella cambia por completo. Así compruebas que una descarga o un respaldo llegó intacto.",reto:{enunciado:'Vuelve a correrlo cambiando mensaje por b"hola mundo!"',pista:"Un carácter más, una huella totalmente distinta",debes_ver:"integra: False (porque ya no coincide con el texto original)"},porque:"Este es el mismo truco que usan las páginas de descarga y los respaldos profesionales: publican el SHA-256 y tú calculas el tuyo. Si coinciden, el archivo es exactamente el que se publicó, ni un byte cambiado."},{tipo:"orden",titulo:"Monta un respaldo 3-2-1 de verdad",pasos:["Elige qué es irremplazable: fotos, documentos, llaves, proyectos","Copia 1: en un disco externo que desconectas al terminar","Copia 2: en un servicio en la nube con 2FA activado","Copia 3: en otro medio, por ejemplo un segundo disco en casa de un familiar","Cifra las copias que salgan de tu casa","Prueba restaurar un archivo al azar cada cierto tiempo"],porque:"Cada copia cubre un desastre distinto: el disco cubre la nube caída, la nube cubre el robo del disco, la copia fuera cubre un incendio o un ransomware, y el cifrado cubre que esa copia se pierda. La prueba de restauración es la que convierte el plan en realidad."},{tipo:"escribir",pregunta:"¿Cómo se llama el malware que cifra tus archivos y pide dinero para devolverlos?",respuestas:["ransomware"],pista:"Viene de «ransom», rescate en inglés.",explicacion:"Ransomware. Y no, pagar no garantiza que te devuelvan los archivos: financias al siguiente ataque.",porque:"El ransomware sigue siendo rentable porque mucha gente no tiene respaldos y paga. Un respaldo probado y desconectado es la única respuesta que no depende de la buena fe del delincuente."}],reto:{pregunta:"Tu Windows te pide reiniciar por actualizaciones y llevas un mes posponiéndolo. ¿Qué riesgo real corres?",opciones:["Ninguno, el antivirus ya cubre todo","Quedarte con fallos que ya son públicos y que los ataques ya saben explotar","Solo que la PC vaya más lenta","Que se borren tus archivos automáticamente"],respuesta:1,explicacion:"El parche cierra una puerta que ya está documentada. Mientras no lo instalas, cualquier ataque que use ese fallo te entra sin que tengas que hacer nada malo."}},{id:"privacidad-incidentes",nivel:4,titulo:"Privacidad y qué hacer si te hackean",subtitulo:"Nivel 4: tu huella digital y el plan de los primeros 30 minutos.",minutos:10,icono:"shield",objetivos:["Reducir tu huella digital sin volverte invisible.","Revisar permisos, sesiones activas y reenvíos.","Ejecutar un plan de respuesta si te hackean."],teoria:[{t:"why",text:"Cuando te hackean, la diferencia entre un susto y un desastre son los primeros 30 minutos. Y esa reacción se puede ensayar, como un simulacro de incendio."},{t:"p",text:"Tu huella digital es todo lo que dejaste regado: cuentas viejas, apps con permisos de más, tu número en un foro de 2012. Lo que no existe no se puede filtrar, y lo que ya no usas es la puerta más fácil de todas."},{t:"list",items:["Revisa las sesiones activas de tu correo y redes: si no reconoces un dispositivo, ciérralo.","Busca reglas de reenvío en tu correo: los atacantes las usan para leerte sin entrar.","Quita permisos a apps que piden contactos, micrófono o ubicación sin necesitarlos.","Cierra las cuentas viejas que ya no usas.","Cubre la cámara solo si te hace sentir mejor: el riesgo real está en los permisos, no en la webcam."]},{t:"porque",text:"Cerrar sesiones y revisar reenvíos va primero porque es lo único que corta el acceso en el momento. Cambiar contraseñas sin cerrar sesiones es como cambiar la cerradura con el ladrón adentro: sigue adentro."},{t:"tip",text:"Escribe tu plan de incidente en una nota y guárdala fuera del teléfono: a quién llamar, qué cuentas cambiar primero, dónde están tus códigos de respaldo. El día que lo necesites, no vas a estar pensando con claridad."}],ejemplos:[{juego:"panama",titulo:"El robo de WhatsApp",texto:"Te roban el código por SMS y entran a tu WhatsApp. Desde ahí piden plata a tus contactos. La respuesta: recuperar la cuenta, avisar a todos y activar la verificación en dos pasos en la app."},{juego:"fortnite",titulo:"La sesión que nunca cerraste",texto:"Cambiaste la contraseña pero la sesión del atacante seguía viva. Meses después alguien «entró de la nada». Cerrar todas las sesiones es parte del cambio, no un extra."},{juego:"minecraft",titulo:"La pregunta de seguridad",texto:"«¿Nombre de tu primera mascota?» está en tus fotos de 2014. Eso no es una contraseña, es trivia pública. Mejor usa respuestas inventadas y guárdalas en el gestor."}],practica:[{tipo:"orden",titulo:"Plan de los primeros 30 minutos: te hackearon",pasos:["Deja de usar la cuenta desde el equipo sospechoso y desconéctalo de la red","Entra desde otro dispositivo y cambia la contraseña del correo principal","Cierra todas las sesiones abiertas y activa la verificación en dos pasos","Revisa reglas de reenvío, dispositivos conectados y métodos de pago","Avisa a tus contactos que un mensaje raro puede venir de tu cuenta","Limpia el equipo, reporta al servicio y, si hubo dinero, llama al banco"],porque:"El orden evita que repitas el error: si cambias la clave desde el equipo infectado, el malware la captura otra vez. Primero cortas el acceso (sesiones y contraseña desde fuera), después limpias."},{tipo:"escribir",pregunta:"¿Qué ajuste del correo revisas para saber si alguien sigue leyendo tus mensajes sin entrar?",respuestas:["reenvio","reglas de reenvio","las reglas de reenvio","reenvios"],pista:"Es una función que manda copia de tus correos a otra dirección.",explicacion:"Las reglas de reenvío. Un atacante puede crear una regla que copie todo a su correo sin que notes nada raro al entrar.",porque:"El reenvío sobrevive al cambio de contraseña, porque no es una sesión: es una regla guardada en la cuenta. Por eso se revisa siempre, incluso cuando «ya no hay nadie conectado»."}],reto:{pregunta:"Te enteras de que tu cuenta de correo fue filtrada hace meses. ¿Cuál es la primera acción más útil?",opciones:["Borrar el correo y crear otro igual","Cambiar la contraseña, cerrar sesiones y activar 2FA","Esperar a ver si pasa algo","Desinstalar el navegador"],respuesta:1,explicacion:"Cortar el acceso es lo urgente: contraseña nueva, sesiones cerradas y 2FA. Revisar reenvíos y cuentas conectadas viene justo después."}}],biomaDesc:"Una fortaleza de piedra en una isla: murallas, foso y antorchas que hay que encender una por una. Cada defensa cuesta, y cada puerta que falta es una entrada."},{id:"redes",nombre:"Mundo Redes",bioma:"Bioma Océano",tagline:"Cómo viajan los datos de tu PC al servidor y de vuelta.",descripcion:"Bits, IP, subredes, TCP/UDP, puertos, DNS, ping y firewalls. Desde cero, con simuladores.",color:"#5fd3ff",fondo:"#0c1f2c",icono:"globe",intro:"Aquí entenderás qué pasa exactamente cuando entras a un servidor de Minecraft o a una partida de Fortnite: quién habla con quién, por dónde viajan los datos y cómo se protegen.",niveles:[{id:"que-es-red",nivel:0,titulo:"¿Qué es una red?",subtitulo:"Nivel 0: cero conocimientos previos. Empezamos aquí.",minutos:7,icono:"globe",objetivos:["Explicar qué es una red con tus propias palabras.","Distinguir LAN, WAN e Internet.","Saber qué hacen el router, el switch y el módem."],teoria:[{t:"why",text:"Todo lo que haces en ciberseguridad pasa por una red. Un ataque, una defensa, un juego online… sin entender la red, solo ves magia. Cuando la entiendes, ves el camino exacto de cada dato."},{t:"p",text:"Una red es simplemente un grupo de dispositivos (computadoras, celulares, consolas, servidores) conectados para intercambiar información. Pueden conectarse con cable (Ethernet) o sin cable (Wi-Fi)."},{t:"h",text:"Los tres tamaños de red"},{t:"table",head:["Tipo","Qué es","Ejemplo"],rows:[["LAN","Red local, un mismo lugar","Tu casa, el laboratorio del colegio"],["WAN","Red que une lugares lejanos","Las sucursales de un banco en todo Panamá"],["Internet","La red de todas las redes","Todo el planeta conectado"]]},{t:"h",text:"Los aparatos que hacen que funcione"},{t:"steps",items:[{t:"Mira tu red",d:"En Windows abre «cmd» y escribe ipconfig. En Mac/Linux, abre la terminal y escribe ip a o ifconfig."},{t:"Busca tu IP",d:"Verás algo como 192.168.1.15: esa es la dirección de tu equipo dentro de tu LAN."},{t:"Busca la puerta de enlace",d:"La «puerta de enlace predeterminada» (por ejemplo 192.168.1.1) es tu router: la salida hacia Internet."}]},{t:"result",text:"Deberías poder identificar dos direcciones: la de tu equipo y la del router. Si ambas empiezan igual (192.168.1.x), estás en la misma red local."}],ejemplos:[{juego:"minecraft",titulo:"Tu servidor de Minecraft es una red",texto:"Cuando juegas en LAN con tu primo en la misma casa, sus computadoras forman una red local. Cuando entras a un servidor público como Hypixel, tu PC se conecta a una computadora lejana a través de Internet: una red de redes."},{juego:"panama",titulo:"El Metro de Panamá",texto:"Imagina cada estación del Metro como un dispositivo y las vías como cables. La Línea 1 sería una red (LAN). Cuando la Línea 1 se conecta con la Línea 2 en San Miguelito, formas una red más grande. Internet sería como si todos los metros del mundo estuvieran conectados entre sí."}],practica:[{tipo:"widget",w:"layers",props:{title:"Del celular a Internet",layers:[{name:"Tu dispositivo",desc:"PC, celular o consola. Envía y recibe datos.",example:"Tu PS5 pidiendo entrar a Fortnite"},{name:"Switch",desc:"Conecta dispositivos DENTRO de la red local y entrega cada dato al aparato correcto.",example:"Las 30 PCs del laboratorio del colegio"},{name:"Router",desc:"Conecta TU red con OTRAS redes. Decide por dónde enviar cada paquete.",example:"La cajita Wi-Fi de tu casa"},{name:"Módem / ONT",desc:"Traduce la señal de tu proveedor (fibra, cable) a datos digitales.",example:"El aparato que instaló tu compañía de internet"},{name:"Internet",desc:"Millones de routers de proveedores enlazados por cables submarinos y fibra.",example:"Los cables que llegan a Panamá por el mar"}]}}],reto:{pregunta:"¿Qué aparato conecta tu red de casa con Internet?",opciones:["El switch","El router","El monitor","El teclado"],respuesta:1,explicacion:"El router une redes distintas: tu LAN con la red de tu proveedor. El switch solo reparte datos dentro de la misma red."}},{id:"binario",nivel:1,titulo:"Bits, bytes y binario",subtitulo:"El idioma de las máquinas: solo encendido y apagado.",minutos:9,icono:"torch",objetivos:["Entender qué es un bit y un byte.","Convertir números entre decimal y binario.","Ver por qué las IP van de 0 a 255."],teoria:[{t:"why",text:"Las direcciones IP, las máscaras de red y los permisos de archivos se basan en binario. Si dominas esto, las subredes dejan de ser un misterio."},{t:"p",text:"Un bit es la unidad mínima de información: 0 o 1, apagado o encendido. Un byte son 8 bits juntos. Con 8 bits puedes formar 256 combinaciones distintas (de 0 a 255)."},{t:"steps",items:[{t:"Escribe 10 en binario",d:"Busca los valores que suman 10: 8 + 2. Enciende las lámparas 8 y 2 → 00001010."},{t:"Escribe 255",d:"Enciende todas: 128+64+32+16+8+4+2+1 = 255 → 11111111. Por eso ningún número de una IP pasa de 255."},{t:"Escribe 192",d:"128 + 64 = 192 → 11000000. Este número aparece en casi todas las IP de casa (192.168…)."}]},{t:"result",text:"Con el simulador, al encender 128 y 64 deberías ver 192. Si enciendes todas, 255."},{t:"tip",text:"Truco rápido: memoriza la escalera 128-64-32-16-8-4-2-1. Para convertir, ve de izquierda a derecha restando lo que quepa."}],ejemplos:[{juego:"minecraft",titulo:"Lámparas de redstone",texto:"Pon 8 lámparas de redstone en fila. Cada una puede estar apagada (0) o encendida (1). La de la derecha vale 1, la siguiente 2, luego 4, 8, 16, 32, 64 y 128. Para escribir el número 5 enciendes la de 4 y la de 1: 00000101. ¡Acabas de construir un byte!"},{juego:"fortnite",titulo:"Velocidad de internet",texto:"Cuando tu plan dice «100 Mbps» son megaBITS por segundo, no megaBYTES. Divide entre 8: descargarías ~12,5 MB por segundo. Por eso la actualización de 20 GB de Fortnite tarda más de lo que parece."}],practica:[{tipo:"widget",w:"binary",props:{}}],reto:{pregunta:"¿Cuánto vale 00010001 en decimal?",opciones:["11","17","9","34"],respuesta:1,explicacion:"Están encendidas las posiciones 16 y 1: 16 + 1 = 17."}},{id:"ip-subredes",nivel:2,titulo:"Direcciones IP y subredes",subtitulo:"La dirección de cada casa en el barrio digital.",minutos:12,icono:"flag",objetivos:["Leer una IPv4 y su máscara.","Calcular red, broadcast y hosts de una subred.","Distinguir IP pública de privada."],teoria:[{t:"why",text:"En ciberseguridad lo primero que haces es mapear la red: qué IPs existen y qué rango cubren. Sin saber subredes, no sabrías ni dónde buscar."},{t:"p",text:"Una dirección IPv4 son 4 números de 0 a 255 separados por puntos (32 bits en total), como 192.168.1.20. Identifica a un dispositivo dentro de una red, igual que una dirección postal identifica una casa."},{t:"h",text:"La máscara: dónde termina el barrio y empieza la casa"},{t:"p",text:"La máscara (o el /24 del CIDR) dice cuántos bits son de red. /24 significa que los primeros 24 bits (tres números) son el barrio y el último número es la casa. Así, en 192.168.1.0/24 caben 254 dispositivos (.1 a .254)."},{t:"steps",items:[{t:"Prueba 192.168.1.20/24",d:"Verás red 192.168.1.0, broadcast 192.168.1.255 y 254 hosts útiles."},{t:"Cambia a /26",d:"Ahora solo 6 bits para hosts: 62 dispositivos. Útil para separar, por ejemplo, las cámaras del resto."},{t:"Cambia a /30",d:"Solo 2 hosts: típico para enlazar dos routers entre sí."}]},{t:"result",text:"Cuanto más grande el número después de la barra, más pequeña la subred. /24 = 254 hosts, /26 = 62, /30 = 2."},{t:"table",head:["Rango privado","Uso típico"],rows:[["10.0.0.0/8","Empresas grandes"],["172.16.0.0/12","Empresas medianas, Docker"],["192.168.0.0/16","Casas y oficinas pequeñas"]]},{t:"p",text:"Las IP privadas solo existen dentro de tu red: miles de casas en Panamá usan 192.168.1.x a la vez sin chocar. Hacia Internet, tu router usa una sola IP pública (eso se llama NAT; lo verás en la lección de firewalls)."}],ejemplos:[{juego:"panama",titulo:"Direcciones en Panamá",texto:"Piensa en «Provincia de Panamá → Distrito de San Miguelito → Corregimiento → Casa 20». La parte de red de la IP es como provincia-distrito-corregimiento (dónde está el barrio) y la parte de host es el número de casa."},{juego:"fortnite",titulo:"Coordenadas del mapa",texto:"En Fortnite, la cuadrícula del mapa (B4, C6…) te dice la zona; luego afinas el punto exacto. La IP funciona igual: la parte de red te lleva a la zona y la parte de host al jugador exacto."}],practica:[{tipo:"widget",w:"subnet",props:{}}],reto:{pregunta:"¿Cuántos hosts útiles tiene una red /24?",opciones:["256","255","254","24"],respuesta:2,explicacion:"256 direcciones menos 2 reservadas (la de red .0 y la de broadcast .255) = 254 hosts."}},{id:"osi",nivel:3,titulo:"Capas y encapsulamiento",subtitulo:"Cofres dentro de cofres: cómo se empaqueta un dato.",minutos:11,icono:"chest",objetivos:["Nombrar las capas del modelo TCP/IP.","Entender el encapsulamiento.","Saber en qué capa ocurre cada ataque."],teoria:[{t:"why",text:"Cuando un analista dice «es un ataque de capa 7» o «capa 2», está hablando de este modelo. Te permite ubicar cualquier problema: ¿falla el cable, la IP o la aplicación?"},{t:"p",text:"Enviar datos por la red es como enviar un regalo: lo metes en una caja, esa caja en otra con la dirección, y esa en un contenedor. Cada capa añade su propia «caja» (cabecera) con la información que necesita. Eso es el encapsulamiento."},{t:"steps",items:[{t:"Avanza el simulador",d:"Pulsa «Siguiente capa» y mira cómo el mensaje se envuelve en cabeceras HTTP → TCP → IP → Ethernet."},{t:"Fíjate en el tamaño",d:"Cada capa añade bytes. Un mensaje de 20 bytes acaba ocupando ~74 en el cable."},{t:"Desencapsula",d:"En el receptor el proceso se invierte: cada capa quita su cabecera y pasa el resto hacia arriba."}]},{t:"result",text:"Al final deberías ver 4 cajas anidadas: [Ethernet [IP [TCP [HTTP: mensaje]]]]."}],ejemplos:[{juego:"minecraft",titulo:"Cofres dentro de shulkers",texto:"Tu mensaje es un diamante. Lo metes en un cofre (capa aplicación), el cofre en una caja de shulker con etiqueta del puerto (transporte), esa caja en un carrito con la dirección de destino (red) y el carrito en los rieles (enlace/físico). Al llegar, se abre todo al revés."},{juego:"panama",titulo:"El Canal de Panamá y los contenedores",texto:"Un barco que cruza el Canal lleva contenedores. Dentro de cada contenedor hay cajas, y dentro de las cajas, productos. Al barco solo le importa llegar al puerto correcto (capa de red); al contenedor, ir al almacén correcto (transporte); a la caja, el cliente final (aplicación)."}],practica:[{tipo:"widget",w:"encap",props:{}},{tipo:"widget",w:"layers",props:{title:"Modelo TCP/IP (4 capas) ↔ OSI (7 capas)",layers:[{name:"Aplicación (OSI 5-7)",desc:"Lo que ve el usuario: HTTP, DNS, SSH, el protocolo del juego.",example:"Ataques: phishing, inyección SQL, DDoS de capa 7"},{name:"Transporte (OSI 4)",desc:"TCP o UDP. Puertos, orden y fiabilidad de la entrega.",example:"Ataques: SYN flood, escaneo de puertos"},{name:"Red / Internet (OSI 3)",desc:"Direcciones IP y enrutamiento entre redes.",example:"Ataques: IP spoofing, ataques al enrutamiento"},{name:"Enlace + Físico (OSI 1-2)",desc:"Direcciones MAC, Wi-Fi, cables, señales eléctricas.",example:"Ataques: ARP spoofing, wifi falsas, cortar el cable"}]}}],reto:{pregunta:"Un escaneo de puertos ocurre principalmente en la capa…",opciones:["Física","Transporte","Aplicación","Enlace"],respuesta:1,explicacion:"Los puertos son cosa de la capa de transporte (TCP/UDP). El escáner prueba qué puertos responden."}},{id:"tcp-udp",nivel:4,titulo:"TCP, UDP y puertos",subtitulo:"Por qué Fortnite usa UDP y tu banco usa TCP.",minutos:12,icono:"ship",objetivos:["Explicar el saludo de 3 pasos de TCP.","Elegir TCP o UDP según el caso.","Reconocer los puertos más importantes."],teoria:[{t:"why",text:"Los atacantes buscan puertos abiertos como quien busca puertas sin llave. Saber qué servicio vive en cada puerto es la base del reconocimiento y de la defensa."},{t:"p",text:"La IP lleva el paquete hasta la computadora correcta, pero dentro de esa computadora hay muchos programas. El puerto indica a qué programa va: es un número de 0 a 65535."},{t:"h",text:"TCP: la llamada formal"},{t:"p",text:"TCP garantiza que todo llegue completo y en orden. Antes de hablar, hace un saludo de tres pasos (3-way handshake). Si algo se pierde, lo reenvía."},{t:"h",text:"UDP: el grito rápido"},{t:"p",text:"UDP envía sin saludar y sin confirmar. Es más rápido pero puede perder paquetes. Ideal cuando la velocidad importa más que la perfección."},{t:"warn",text:"El puerto 3389 (RDP) o 22 (SSH) expuestos a Internet con contraseñas débiles son de las entradas más usadas por atacantes. Ciérralos o protégelos con VPN y llaves."}],ejemplos:[{juego:"panama",titulo:"Las esclusas del Canal",texto:"La IP es el puerto de Balboa (la ciudad). El número de puerto es el muelle exacto: muelle 443 para la web segura, muelle 22 para el acceso remoto, muelle 25565 para Minecraft. Un barco con la ciudad correcta pero el muelle equivocado no descarga nada."},{juego:"fortnite",titulo:"Por qué los juegos usan UDP",texto:"En Fortnite tu posición se envía decenas de veces por segundo. Si un paquete se pierde, no tiene sentido reenviarlo: ya llegó uno más nuevo. Con TCP, esperar el reenvío causaría «lag». Por eso los juegos online usan UDP, y la tienda de V-Bucks (pagos) usa TCP/HTTPS."}],practica:[{tipo:"widget",w:"flow",props:{title:"Saludo TCP de 3 pasos",actors:["Tu PC","Servidor"],steps:[{from:0,to:1,label:"SYN",detail:"«Hola, ¿podemos hablar? Mi número de secuencia es 100.»"},{from:1,to:0,label:"SYN-ACK",detail:"«Sí, recibí tu 100. Mi número es 300.»"},{from:0,to:1,label:"ACK",detail:"«Recibí tu 300.» → Conexión establecida."},{from:0,to:1,label:"DATOS",detail:"Ahora sí viajan los datos (por ejemplo la petición web)."}]}},{tipo:"widget",w:"match",props:{title:"Une cada puerto con su servicio",pairs:[["22","SSH (acceso remoto)"],["53","DNS"],["80","HTTP (web sin cifrar)"],["443","HTTPS (web segura)"],["3389","Escritorio remoto Windows"],["25565","Servidor de Minecraft"]]}}],reto:{pregunta:"Para una videollamada en vivo, ¿qué protocolo de transporte encaja mejor?",opciones:["TCP, porque nunca pierde nada","UDP, porque prioriza la velocidad","Ninguno","FTP"],respuesta:1,explicacion:"En tiempo real es mejor perder un fotograma que congelar la llamada esperando reenvíos. UDP gana."}},{id:"dns",nivel:5,titulo:"DNS: la guía telefónica",subtitulo:"Cómo «minecraft.net» se convierte en una IP.",minutos:9,icono:"key",objetivos:["Explicar para qué sirve DNS.","Seguir una resolución DNS paso a paso.","Reconocer ataques DNS comunes."],teoria:[{t:"why",text:"Si alguien controla tu DNS, puede mandarte a una web falsa aunque escribas bien la dirección. Es uno de los trucos favoritos del phishing."},{t:"p",text:"Las computadoras se hablan con IPs (números), pero los humanos recordamos nombres. DNS (Domain Name System) traduce nombres como minecraft.net a direcciones IP."},{t:"steps",items:[{t:"Pruébalo en tu PC",d:"Abre la terminal y escribe: nslookup minecraft.net"},{t:"Lee la respuesta",d:"Verás el servidor DNS que respondió y una o varias IP del dominio."},{t:"Compara",d:"Haz nslookup google.com: varias IPs, porque grandes servicios reparten la carga."}]},{t:"result",text:"nslookup devuelve un bloque «Non-authoritative answer» con Name y Address(es). Esas son las IP a las que realmente te conectas."},{t:"warn",text:"DNS spoofing / envenenamiento: un atacante falsea respuestas DNS para mandarte a su servidor. Defensas: DNS sobre HTTPS (DoH), DNSSEC y fijarte siempre en el candado y el dominio exacto."}],ejemplos:[{juego:"panama",titulo:"La guía telefónica de toda la vida",texto:"Antes, si querías llamar a la pizzería, buscabas su nombre en la guía y obtenías el número. DNS es esa guía: das el nombre del sitio y te devuelve su «número» (la IP)."}],practica:[{tipo:"widget",w:"flow",props:{title:"Resolviendo www.minecraft.net",actors:["Tu PC","Resolver","Raíz","TLD .net","DNS de minecraft"],steps:[{from:0,to:1,label:"¿IP de www.minecraft.net?",detail:"Tu PC pregunta al resolver de tu proveedor (o 1.1.1.1 / 8.8.8.8). Primero revisa su caché."},{from:1,to:2,label:"¿Quién maneja .net?",detail:"El resolver pregunta a un servidor raíz. Hay 13 identidades raíz repartidas por el mundo."},{from:2,to:1,label:"Pregunta al TLD .net",detail:"La raíz no sabe la IP, pero sabe quién administra .net."},{from:1,to:3,label:"¿Quién maneja minecraft.net?",detail:"El servidor del TLD .net indica los servidores autoritativos del dominio."},{from:3,to:1,label:"Pregunta a ns1.minecraft…",detail:"Te pasa la dirección del DNS autoritativo de Minecraft."},{from:1,to:4,label:"¿IP de www?",detail:"Pregunta final al dueño del dominio."},{from:4,to:1,label:"→ 13.107.x.x",detail:"Respuesta con la IP y un TTL (cuánto tiempo guardarla en caché)."},{from:1,to:0,label:"IP lista",detail:"Tu PC ya puede conectarse por TCP al puerto 443. Todo esto suele tardar menos de 50 ms."}]}}],reto:{pregunta:"¿Qué devuelve una consulta DNS de tipo A?",opciones:["Una dirección IPv4","Una contraseña","Un puerto","Un archivo"],respuesta:0,explicacion:"El registro A asocia un nombre con una dirección IPv4. El registro AAAA hace lo mismo con IPv6."}},{id:"ping",nivel:6,titulo:"Ping, latencia y traceroute",subtitulo:"Por qué tienes 120 de ping jugando desde Panamá.",minutos:9,icono:"pickaxe",objetivos:["Medir latencia con ping.","Seguir saltos con traceroute.","Entender por qué la distancia importa."],teoria:[{t:"why",text:"Ping y traceroute son las primeras herramientas de diagnóstico de cualquier técnico. También sirven para descubrir qué hosts están vivos en una red."},{t:"p",text:"La latencia (ping) es el tiempo que tarda un paquete en ir y volver, medido en milisegundos (ms). No depende solo de tu velocidad contratada: depende sobre todo de la distancia y de cuántos routers hay por el medio."},{t:"term",title:"Así se ve en tu terminal",text:`$ ping -c 3 minecraft.net
64 bytes from 13.107.x.x: icmp_seq=1 ttl=117 time=61.8 ms
64 bytes from 13.107.x.x: icmp_seq=2 ttl=117 time=62.4 ms
64 bytes from 13.107.x.x: icmp_seq=3 ttl=117 time=60.9 ms
--- 3 packets transmitted, 3 received, 0% packet loss`},{t:"steps",items:[{t:"Haz ping",d:"Windows: ping google.com · Mac/Linux: ping -c 4 google.com"},{t:"Haz traceroute",d:"Windows: tracert google.com · Mac/Linux: traceroute google.com"},{t:"Interpreta",d:"Busca el salto donde la latencia salta de golpe: ahí está el tramo largo o el cuello de botella."}]},{t:"result",text:"Verás tiempos en ms y el porcentaje de pérdida. 0% de pérdida y tiempos estables = conexión sana."},{t:"tip",text:"El campo TTL de la respuesta delata pistas: Linux suele empezar en 64 y Windows en 128. Los analistas lo usan para adivinar el sistema operativo remoto."}],ejemplos:[{juego:"fortnite",titulo:"El ping en partida",texto:"Si juegas en servidores de NA-Este desde Panamá, tus datos viajan miles de kilómetros: ~50-80 ms. Si el juego te manda a Europa, ~150+ ms y los disparos «no registran». La luz es rápida, pero la Tierra es grande."}],practica:[{tipo:"widget",w:"flow",props:{title:"Traceroute: Ciudad de Panamá → servidor en Virginia",actors:["Tu PC","Router casa","Proveedor PA","Cable submarino","Miami","Servidor"],steps:[{from:0,to:1,label:"salto 1 · 1 ms",detail:"Tu router: lo más cercano. Si aquí ya hay mucha latencia, el problema es tu Wi-Fi."},{from:1,to:2,label:"salto 2 · 8 ms",detail:"La red de tu proveedor en Panamá."},{from:2,to:3,label:"salto 3 · 12 ms",detail:"Salida hacia los cables submarinos que conectan Panamá con el mundo."},{from:3,to:4,label:"salto 4 · 38 ms",detail:"Llegada a Miami, uno de los grandes puntos de intercambio de América."},{from:4,to:5,label:"salto 5 · 62 ms",detail:"Servidor de destino. Latencia total ida y vuelta ~62 ms."}]}}],reto:{pregunta:"Tienes 300 ms de ping en el salto 1 (tu router). ¿Dónde está el problema?",opciones:["En el servidor del juego","En tu red local o Wi-Fi","En el cable submarino","En DNS"],respuesta:1,explicacion:"El salto 1 es tu propio router. Si ahí ya hay latencia alta, el problema está en casa: Wi-Fi saturado, interferencias o el router."}},{id:"firewall",nivel:7,titulo:"Firewall, NAT y Wi-Fi seguro",subtitulo:"El guardia en la puerta del castillo.",minutos:12,icono:"sword",objetivos:["Escribir reglas de firewall básicas.","Entender NAT.","Proteger tu Wi-Fi."],teoria:[{t:"why",text:"El firewall es la primera línea de defensa de cualquier red. Configurarlo bien bloquea la mayoría de ataques automáticos antes de que toquen tus equipos."},{t:"p",text:"Un firewall revisa cada paquete y decide según reglas: permitir o bloquear. Las reglas se leen de arriba abajo y la primera que coincide gana. Al final suele haber una regla «bloquear todo lo demás»."},{t:"steps",items:[{t:"Analiza el tráfico",d:"Mira los paquetes que llegan: web, SSH, Minecraft y un escaneo sospechoso."},{t:"Escribe las reglas",d:"Permite 443 y 25565, permite 22 solo desde tu IP de confianza y bloquea todo lo demás."},{t:"Simula",d:"Ejecuta y revisa qué paquetes pasaron. El objetivo: 0 paquetes maliciosos dentro."}]},{t:"result",text:"Con una política «denegar por defecto», todo lo que no permitiste expresamente queda fuera. Ese es el principio de mínimo privilegio aplicado a la red."},{t:"h",text:"NAT: muchas casas, una sola dirección"},{t:"p",text:"Tu router traduce las IP privadas de tus dispositivos (192.168.1.x) a una única IP pública. Desde fuera, toda tu casa parece un solo dispositivo. Como efecto secundario, nadie de Internet puede iniciar conexiones hacia tus equipos sin que tú abras un puerto."},{t:"list",items:["Usa WPA3 (o WPA2-AES) en tu Wi-Fi, nunca WEP.","Cambia la contraseña del panel del router (no dejes admin/admin).","Desactiva WPS: su PIN se puede romper por fuerza bruta.","Crea una red de invitados para visitas y aparatos inteligentes.","Actualiza el firmware del router."]},{t:"warn",text:"Abrir puertos en el router (port forwarding) para tu servidor de Minecraft expone tu equipo a todo Internet. Hazlo solo en el puerto necesario y mantén el servidor actualizado."}],ejemplos:[{juego:"minecraft",titulo:"La whitelist de tu servidor",texto:"En tu servidor de Minecraft activas la whitelist: solo entran los jugadores de la lista, el resto es rechazado. Un firewall es una whitelist para paquetes: solo pasan los puertos y direcciones que tú permites."},{juego:"panama",titulo:"El edificio con un solo apartado postal",texto:"Imagina un edificio en Bella Vista donde todas las cartas llegan a un único apartado postal y el conserje las reparte por apartamento. Desde fuera solo se conoce el apartado (IP pública); el conserje (router con NAT) sabe a quién va cada carta."}],practica:[{tipo:"widget",w:"firewall",props:{}}],reto:{pregunta:"¿Qué significa «denegar por defecto» en un firewall?",opciones:["Permitir todo y bloquear lo malo conocido","Bloquear todo salvo lo permitido expresamente","Apagar el router","Bloquear solo el Wi-Fi"],respuesta:1,explicacion:"Es la política más segura: si no hay una regla que lo permita, se bloquea. Así lo desconocido no entra."}}],biomaDesc:"Un océano de islas unidas por cables: los paquetes viajan como barcos, hay tormentas de latencia y faros que dicen por dónde ir. Nada llega por arte de magia."},{id:"sistemas",nombre:"Mundo Sistemas Operativos",bioma:"Bioma Cueva",tagline:"El jefe invisible que manda en tu computadora.",descripcion:"Kernel, procesos, CPU, memoria, archivos, usuarios, permisos y la terminal de Linux. Con simuladores y un mini-CTF.",color:"#3ee07a",fondo:"#0d1f12",icono:"monitor",intro:"Aprenderás qué pasa por dentro cuando abres Minecraft: quién le da memoria, quién reparte la CPU, dónde se guardan tus mundos y quién tiene permiso para tocarlos.",niveles:[{id:"que-es-so",nivel:0,titulo:"¿Qué es un sistema operativo?",subtitulo:"Nivel 0: el gerente que nadie ve pero todo lo controla.",minutos:7,icono:"monitor",objetivos:["Explicar qué hace un sistema operativo.","Distinguir hardware, kernel y aplicaciones.","Conocer Windows, Linux, macOS y Android."],teoria:[{t:"why",text:"Los atacantes buscan escalar privilegios dentro del sistema operativo: pasar de usuario normal a administrador. Para defenderlo hay que saber cómo está organizado."},{t:"p",text:"El sistema operativo (SO) es el programa principal que administra el hardware (CPU, memoria, disco, pantalla) y lo reparte entre las aplicaciones. Sin él, cada juego tendría que saber hablar directamente con tu tarjeta gráfica y tu disco."},{t:"table",head:["Sistema","Dónde lo ves","Dato de seguridad"],rows:[["Windows","La mayoría de PCs","Objetivo nº1 del malware por popularidad"],["Linux","Servidores, Android, routers","Domina Internet: ~90% de servidores"],["macOS","Computadoras Apple","Basado en Unix, permisos al estilo Linux"],["Android / iOS","Celulares","Cada app vive aislada en su «caja» (sandbox)"]]}],ejemplos:[{juego:"panama",titulo:"La ACP y el Canal",texto:"La Autoridad del Canal de Panamá decide qué barco pasa, cuándo, por qué esclusa y cuánta agua usa. Los barcos (aplicaciones) no deciden solos: piden turno. El sistema operativo hace lo mismo con la CPU, la memoria y el disco."},{juego:"minecraft",titulo:"Minecraft corre sobre capas",texto:"Minecraft Java no habla con tu hardware: corre sobre Java (JVM), que le pide recursos al sistema operativo, que usa los drivers para mover tu GPU. Por eso el mismo .jar funciona en Windows, Mac y Linux: cada SO pone su propia «base»."}],practica:[{tipo:"widget",w:"layers",props:{title:"Las capas de una computadora",layers:[{name:"Aplicaciones",desc:"Lo que usas: Minecraft, Chrome, Discord. Piden recursos al SO.",example:"Minecraft pide 4 GB de RAM"},{name:"Llamadas al sistema",desc:"La «ventanilla» para pedir cosas al kernel: abrir archivo, crear proceso, enviar a la red.",example:"open(), read(), fork()"},{name:"Kernel (núcleo)",desc:"El corazón del SO. Maneja memoria, procesos, drivers y seguridad. Corre con privilegios máximos.",example:"Linux, el kernel de Windows NT, XNU de macOS"},{name:"Drivers",desc:"Traductores entre el kernel y cada pieza de hardware concreta.",example:"El driver de tu tarjeta gráfica NVIDIA/AMD"},{name:"Hardware",desc:"Lo físico: CPU, RAM, SSD, GPU, tarjeta de red.",example:"Tu procesador de 8 núcleos"}]}}],reto:{pregunta:"¿Qué parte del sistema operativo tiene los privilegios máximos?",opciones:["El navegador","El kernel","El fondo de pantalla","Los juegos"],respuesta:1,explicacion:"El kernel controla todo el hardware y la memoria. Por eso un fallo en el kernel es lo más grave que puede pasar en seguridad."}},{id:"procesos",nivel:1,titulo:"Procesos e hilos",subtitulo:"Cada programa abierto es un jugador en la partida.",minutos:9,icono:"sword",objetivos:["Diferenciar programa, proceso e hilo.","Leer un administrador de tareas.","Detectar procesos sospechosos."],teoria:[{t:"why",text:"Casi todo malware termina siendo un proceso corriendo en tu equipo. Saber leer la lista de procesos es la forma más directa de detectarlo."},{t:"p",text:"Un programa es un archivo quieto en el disco (minecraft.exe). Cuando lo abres, el SO crea un proceso: el programa en ejecución, con su propia memoria, un número de identificación (PID) y un dueño (usuario). Un proceso puede tener varios hilos que trabajan en paralelo."},{t:"steps",items:[{t:"Abre el administrador",d:"Windows: Ctrl+Shift+Esc · Mac: Monitor de actividad · Linux: comando top o htop."},{t:"Ordena por CPU",d:"Mira quién consume más. Un proceso desconocido al 100% de CPU sin motivo puede ser un minero de criptomonedas."},{t:"Investiga nombres raros",d:"Busca el nombre exacto del proceso en Internet y revisa la ruta del archivo. «svch0st.exe» con cero no es «svchost.exe»."}]},{t:"result",text:"En el simulador, el proceso «xmrig_helper» con usuario desconocido y CPU altísima es el sospechoso. Al terminarlo, la CPU vuelve a la normalidad."},{t:"tip",text:"Los malware imitan nombres legítimos: svchost, explorer, chrome. Mira siempre la ruta: los de Windows viven en C:\\Windows\\System32, no en Descargas o AppData\\Temp."}],ejemplos:[{juego:"fortnite",titulo:"Jugadores en la isla",texto:"El juego instalado es el programa. Cada partida activa es un proceso. Dentro de la partida, tu personaje dispara, construye y se mueve a la vez: esos son los hilos, tareas paralelas del mismo proceso."}],practica:[{tipo:"widget",w:"procs",props:{}}],reto:{pregunta:"¿Qué es un PID?",opciones:["Una contraseña","El número que identifica a cada proceso","Un tipo de virus","Un puerto de red"],respuesta:1,explicacion:"PID = Process ID. El SO numera cada proceso para gestionarlo; con él puedes terminarlo (kill PID en Linux)."}},{id:"cpu",nivel:2,titulo:"Planificación de la CPU",subtitulo:"Cómo un procesador atiende a 200 programas «a la vez».",minutos:10,icono:"xp",objetivos:["Entender el reparto de tiempo de CPU.","Comparar FCFS y Round Robin.","Calcular tiempos de espera."],teoria:[{t:"why",text:"Entender la planificación explica por qué un proceso malicioso puede ralentizar todo el sistema y cómo el SO protege a los procesos importantes."},{t:"p",text:"Un núcleo de CPU solo ejecuta una cosa a la vez. El SO cambia de proceso cientos de veces por segundo (cambio de contexto) para que parezca que todo corre simultáneamente. La parte del kernel que decide a quién le toca se llama planificador (scheduler)."},{t:"steps",items:[{t:"Ejecuta FCFS",d:"Observa el diagrama: el proceso largo bloquea a los cortos. El tiempo de espera medio sube."},{t:"Cambia a Round Robin",d:"Con un quantum (turno) de 2, todos avanzan por turnos. Los cortos terminan antes."},{t:"Juega con el quantum",d:"Quantum muy grande = se parece a FCFS. Muy pequeño = demasiados cambios de contexto (desperdicio)."}]},{t:"result",text:"Con estos procesos, Round Robin reduce la espera media de los procesos cortos aunque el largo tarde un poco más. Así se siente fluido un sistema interactivo."}],ejemplos:[{juego:"panama",titulo:"La fila del diablo rojo",texto:"FCFS (el primero que llega, el primero que se atiende) es como la fila de la parada: si sube primero alguien con 20 bultos, todos esperan. Round Robin es como si el pavo dejara subir a cada pasajero un ratito por turnos: nadie se queda esperando eternamente."},{juego:"minecraft",titulo:"Los ticks de Minecraft",texto:"Un servidor de Minecraft procesa el mundo en «ticks»: 20 por segundo. Si hay demasiadas granjas de redstone, cada tick tarda más y el servidor «laguea» (TPS bajos). Es el mismo problema: demasiado trabajo para el tiempo de CPU disponible."}],practica:[{tipo:"widget",w:"scheduler",props:{}}],reto:{pregunta:"¿Qué ventaja tiene Round Robin frente a FCFS?",opciones:["Usa menos memoria","Ningún proceso acapara la CPU indefinidamente","Es más fácil de programar","No necesita kernel"],respuesta:1,explicacion:"Cada proceso recibe turnos de tiempo fijo. Uno largo no puede bloquear a los demás."}},{id:"memoria",nivel:3,titulo:"Memoria: RAM vs disco",subtitulo:"La hotbar, el inventario y el cofre.",minutos:9,icono:"chest",objetivos:["Ordenar la jerarquía de memoria.","Explicar memoria virtual y swap.","Saber por qué la RAM se borra al apagar."],teoria:[{t:"why",text:"Muchos ataques avanzados viven solo en la RAM (malware «sin archivos») para no dejar rastro en el disco. Y los analistas forenses capturan la RAM para encontrar contraseñas y claves."},{t:"p",text:"Hay memorias rápidas y pequeñas (registros, caché) y lentas y enormes (SSD, disco duro). La RAM está en el medio: rápida, pero volátil: se borra al apagar."},{t:"result",text:"Si un registro tardara 1 segundo, leer del SSD tardaría ~1-2 días y de un disco duro mecánico ~meses. Por eso el SO intenta tener en RAM lo que más usas."},{t:"h",text:"Memoria virtual y swap"},{t:"p",text:"Cada proceso cree tener toda la memoria para él (memoria virtual). El SO traduce esas direcciones a la RAM real y aísla a cada proceso: Minecraft no puede leer la memoria de tu navegador. Si la RAM se llena, el SO pasa trozos poco usados al disco (swap / archivo de paginación), y todo se vuelve lento."},{t:"tip",text:"Ese aislamiento es una barrera de seguridad clave. Los exploits famosos (como Meltdown y Spectre) consistían justamente en romper ese aislamiento para leer memoria ajena."}],ejemplos:[{juego:"minecraft",titulo:"Hotbar, inventario y cofres",texto:"La hotbar (9 casillas) es la caché: lo que usas ya, al instante. El inventario es la RAM: más espacio, a un par de clics. Los cofres de tu base son el disco: caben miles de cosas, pero tienes que caminar hasta ellos. Y si mueres sin keepInventory… pierdes el inventario (la RAM se borra), pero los cofres siguen ahí (el disco persiste)."}],practica:[{tipo:"widget",w:"memory",props:{}}],reto:{pregunta:"Apagas la PC de golpe. ¿Qué se pierde?",opciones:["Los archivos del disco","Lo que estaba solo en la RAM","El sistema operativo","Nada"],respuesta:1,explicacion:"La RAM es volátil: sin corriente, se borra. Lo guardado en disco persiste. Por eso «guardar» significa copiar de RAM a disco."}},{id:"archivos",nivel:4,titulo:"Archivos, rutas y la terminal",subtitulo:"Tus primeros comandos en Linux.",minutos:12,icono:"pickaxe",objetivos:["Moverte por carpetas con cd, ls y pwd.","Leer y crear archivos desde la terminal.","Entender rutas absolutas y relativas."],teoria:[{t:"why",text:"El 90% de los servidores del mundo son Linux y se administran desde la terminal. En ciberseguridad, la terminal es tu herramienta principal: rápida, precisa y automatizable."},{t:"p",text:"Los archivos se organizan en carpetas (directorios) que forman un árbol. En Linux todo empieza en la raíz «/». Tu carpeta personal es /home/tu_usuario, abreviada como «~»."},{t:"table",head:["Comando","Qué hace","Ejemplo"],rows:[["pwd","Dice dónde estás","pwd → /home/steve"],["ls","Lista el contenido","ls -la (incluye ocultos)"],["cd","Cambia de carpeta","cd mundos · cd .. (subir)"],["cat","Muestra un archivo","cat notas.txt"],["mkdir","Crea carpeta","mkdir base"],["touch","Crea archivo vacío","touch diario.txt"],["echo","Escribe texto","echo hola"]]},{t:"result",text:"Al completar la misión habrás navegado por el árbol, listado archivos ocultos y leído un archivo. Son los movimientos básicos de cualquier administrador."},{t:"tip",text:"Usa la tecla Tab para autocompletar y la flecha ↑ para repetir comandos anteriores. En el simulador también funcionan."}],ejemplos:[{juego:"minecraft",titulo:"Coordenadas F3",texto:"Una ruta absoluta es como dar coordenadas exactas (X: 120, Z: -340): funciona desde cualquier lugar. Una ruta relativa es «dos bloques a la izquierda de donde estoy»: depende de tu posición. /home/steve/mundos es absoluta; mundos/survival es relativa."}],practica:[{tipo:"widget",w:"terminal",props:{mission:"basico"}}],reto:{pregunta:"Estás en /home/steve. ¿A dónde te lleva «cd ..»?",opciones:["/home","/home/steve/..","/","A ninguna parte"],respuesta:0,explicacion:"«..» significa la carpeta padre. Desde /home/steve subes a /home."}},{id:"permisos",nivel:5,titulo:"Usuarios y permisos",subtitulo:"Quién es OP en el servidor.",minutos:11,icono:"key",objetivos:["Leer permisos rwx.","Calcular permisos en octal (chmod 755).","Entender root y el mínimo privilegio."],teoria:[{t:"why",text:"Un archivo con permisos mal puestos (por ejemplo, contraseñas legibles por todos) es una de las vulnerabilidades más comunes en servidores reales."},{t:"p",text:"Cada archivo tiene un dueño, un grupo y permisos para tres tipos de personas: el dueño (u), el grupo (g) y los demás (o). Cada uno puede tener r (leer), w (escribir) y x (ejecutar)."},{t:"p",text:"En octal, r = 4, w = 2, x = 1. Se suman: rwx = 7, r-x = 5, r-- = 4. Así, chmod 755 significa dueño rwx, grupo r-x, otros r-x."},{t:"steps",items:[{t:"Script ejecutable",d:"Marca rwx para el dueño y r-x para el resto → 755. Típico de programas."},{t:"Archivo privado",d:"Solo rw para el dueño → 600. Ideal para llaves SSH (~/.ssh/id_ed25519)."},{t:"El error clásico",d:"777 = todos pueden todo. Nunca lo uses «para que funcione»: es una puerta abierta."}]},{t:"result",text:"Si marcas solo lectura y escritura para el dueño, verás 600 y -rw-------. Ese es el permiso correcto para archivos secretos."},{t:"warn",text:"Principio de mínimo privilegio: cada usuario y programa debe tener solo los permisos que necesita. No juegues ni navegues como administrador: si un malware te infecta, heredará todos tus poderes."}],ejemplos:[{juego:"minecraft",titulo:"OP y permisos del servidor",texto:"En tu servidor, el admin con OP (root) puede todo: /gamemode, /ban, /stop. Los jugadores normales solo construyen. Los moderadores (un grupo) tienen algunos poderes extra. Si le das OP a cualquiera, alguien acabará borrando tu spawn."}],practica:[{tipo:"widget",w:"chmod",props:{}}],reto:{pregunta:"¿Qué significa chmod 644 notas.txt?",opciones:["Todos pueden escribir","Dueño lee y escribe; el resto solo lee","Nadie puede leer","Es ejecutable para todos"],respuesta:1,explicacion:"6 = rw- para el dueño, 4 = r-- para el grupo, 4 = r-- para otros."}},{id:"terminal-ctf",nivel:6,titulo:"Misión: caza la bandera",subtitulo:"Mini-CTF en una terminal Linux simulada.",minutos:14,icono:"flag",objetivos:["Usar grep para buscar en archivos.","Encontrar archivos ocultos.","Leer logs como un analista."],teoria:[{t:"why",text:"Los CTF (Capture The Flag) son competencias donde se aprende ciberseguridad resolviendo retos. Encontrar una «flag» escondida en un servidor es exactamente lo que harás aquí."},{t:"p",text:"Nuevos comandos para esta misión: grep (buscar texto dentro de archivos), ls -la (ver archivos ocultos, que empiezan por punto), whoami (quién eres), history (comandos anteriores) y cat sobre logs."},{t:"term",title:"Ejemplos de grep",text:`$ grep "Failed" auth.log      # líneas que contienen Failed
$ grep -i flag notas.txt      # sin distinguir mayúsculas
$ grep -c "Failed" auth.log   # cuenta coincidencias`},{t:"result",text:"La bandera tiene el formato FV{...}. Está escondida en un archivo oculto, y la pista para encontrarla está en un log de accesos."},{t:"tip",text:"Metodología de un analista: 1) ¿quién soy y dónde estoy? (whoami, pwd) 2) ¿qué hay aquí, incluso oculto? (ls -la) 3) ¿qué dicen los logs? (grep) 4) seguir las pistas."}],ejemplos:[{juego:"fortnite",titulo:"Buscar cofres en la isla",texto:"Al caer en la isla no sabes dónde están los cofres dorados: exploras edificios, escuchas el sonido y revisas rincones. En un CTF exploras carpetas, archivos ocultos y logs hasta dar con la bandera."}],practica:[{tipo:"widget",w:"terminal",props:{mission:"ctf"}}],reto:{pregunta:"¿Cómo ves los archivos ocultos en Linux?",opciones:["ls","ls -la","cat","pwd"],respuesta:1,explicacion:"La opción -a muestra todo, incluidos los archivos que empiezan por punto, y -l da el detalle (permisos, dueño, tamaño)."}},{id:"malware-defensa",nivel:7,titulo:"Malware y cómo se defiende el SO",subtitulo:"Creepers digitales y cómo evitar que exploten.",minutos:10,icono:"heart",objetivos:["Reconocer tipos de malware.","Conocer las defensas del SO.","Armar tu checklist de seguridad."],teoria:[{t:"why",text:"Saber cómo entra el malware y qué capas lo frenan te convierte en la persona que protege a su familia, su colegio o su empresa."},{t:"table",head:["Tipo","Qué hace","Ejemplo de vida real"],rows:[["Virus","Se pega a archivos y se propaga al abrirlos","Un «crack» de un juego infectado"],["Gusano","Se propaga solo por la red","WannaCry en 2017"],["Troyano","Parece útil pero esconde algo malo","Un «hack de V-Bucks gratis»"],["Ransomware","Cifra tus archivos y pide rescate","Ataques a hospitales y empresas"],["Spyware / stealer","Roba contraseñas y sesiones","Robo de cuentas de Discord y Steam"]]},{t:"list",items:["Activa las actualizaciones automáticas.","Usa una cuenta normal para el día a día.","Descarga solo de tiendas y webs oficiales.","Activa la verificación en dos pasos en tus cuentas de juego.","Haz copias de seguridad de tus mundos y archivos importantes."]}],ejemplos:[{juego:"fortnite",titulo:"«V-Bucks gratis»",texto:"Las webs y archivos que prometen V-Bucks o skins gratis son el troyano más clásico entre gamers: descargas un «generador» y en realidad instalas un ladrón de cuentas. Regla de oro: si es gratis y demasiado bueno, el producto eres tú."},{juego:"panama",titulo:"El mensaje de «premio» por WhatsApp",texto:"«¡Felicidades, ganaste un bono del Super 99, entra aquí!» Ese enlace te lleva a instalar una app o poner tus datos. No es suerte: es phishing con malware. Verifica siempre en la web o app oficial."}],practica:[{tipo:"widget",w:"layers",props:{title:"Defensas en capas del sistema operativo",layers:[{name:"Actualizaciones",desc:"Cierran los agujeros conocidos. La mayoría de infecciones usan fallos ya parcheados.",example:"Windows Update, apt upgrade"},{name:"Antivirus / EDR",desc:"Detectan archivos y comportamientos maliciosos.",example:"Microsoft Defender"},{name:"Cuentas sin privilegios",desc:"Usar un usuario normal limita lo que el malware puede hacer.",example:"UAC en Windows, sudo en Linux"},{name:"Aislamiento (sandbox)",desc:"Cada app encerrada en su caja con permisos mínimos.",example:"Apps de Android/iOS, el navegador"},{name:"Cifrado de disco",desc:"Si te roban el equipo, no pueden leer tus datos.",example:"BitLocker, FileVault, LUKS"},{name:"Copias de seguridad",desc:"La cura contra el ransomware: restaurar sin pagar.",example:"Regla 3-2-1: 3 copias, 2 medios, 1 fuera de casa"}]}}],reto:{pregunta:"¿Cuál es la mejor defensa contra el ransomware?",opciones:["Pagar rápido","Tener copias de seguridad desconectadas","Apagar el monitor","Cambiar el fondo de pantalla"],respuesta:1,explicacion:"Con copias de seguridad fuera del alcance del malware, puedes restaurar tus archivos sin pagar."}}],biomaDesc:"Una cueva con salas y pasillos: el kernel vive en el fondo, los procesos son criaturas que van y vienen, y los permisos son puertas que solo abren algunos."},{id:"python",nombre:"Mundo Python",bioma:"Bioma Jungla",tagline:"Programa tus propias herramientas de ciberseguridad.",descripcion:"Desde print() hasta un detector de fuerza bruta y un escáner de puertos. Código real que ejecutas aquí mismo.",color:"#ffd43b",fondo:"#221d0a",icono:"snake",intro:"Python es el lenguaje favorito de la ciberseguridad: corto, legible y con librerías para todo. Cada lección tiene código que puedes editar y ejecutar en tu navegador con un intérprete de Python real.",niveles:[{id:"hola",nivel:0,titulo:"¿Qué es programar? Tu primer print",subtitulo:"Nivel 0: darle órdenes a la computadora.",minutos:8,icono:"snake",objetivos:["Entender qué es un programa.","Usar print() y comentarios.","Hacer cuentas con Python."],teoria:[{t:"why",text:"Los profesionales de seguridad automatizan: en vez de revisar 10.000 líneas de log a mano, escriben 10 líneas de Python que lo hacen en un segundo. Programar es tu superpoder."},{t:"p",text:"Programar es escribir instrucciones exactas para que la computadora las siga, una tras otra, de arriba abajo. Python lee tu código línea por línea y ejecuta cada orden."},{t:"steps",items:[{t:"Pulsa «Ejecutar»",d:"La primera vez se descarga el intérprete de Python (unos segundos). Después es instantáneo."},{t:"Cambia el mensaje",d:"Escribe tu nombre dentro de las comillas y vuelve a ejecutar."},{t:"Rompe algo a propósito",d:"Borra una comilla y ejecuta: verás un SyntaxError. Leer errores es la mitad de programar."}]},{t:"table",head:["Operador","Qué hace","Ejemplo → resultado"],rows:[["+ - * /","Suma, resta, multiplica, divide","10 / 4 → 2.5"],["//","División entera","10 // 4 → 2"],["%","Resto (módulo)","10 % 4 → 2"],["**","Potencia","2 ** 8 → 256"]]},{t:"result",text:"Si ves los números en la salida sin errores, tu primer programa funciona."}],ejemplos:[{juego:"minecraft",titulo:"Bloques de comandos",texto:'Si alguna vez usaste un bloque de comandos con /say ¡Hola!, ya programaste: diste una orden y el juego la ejecutó. En Python, el equivalente es print("¡Hola!").'}],practica:[{tipo:"codigo",codigo:`# Esto es un comentario: Python lo ignora. Sirve para explicar.
print("¡Qué xopá, FactionVault!")
print("Python sabe sumar:", 2 + 3)
print("Y multiplicar:", 7 * 6)`,salida:`¡Qué xopá, FactionVault!
Python sabe sumar: 5
Y multiplicar: 42`,explicacion:"print() muestra en pantalla lo que le pases. Puedes mezclar texto (entre comillas) y cálculos separados por comas."},{tipo:"codigo",codigo:`# 2 elevado a 8: las combinaciones de un byte
print(2 ** 8)
