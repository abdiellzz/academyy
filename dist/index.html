 es una red?",subtitulo:"Nivel 0: cero conocimientos previos. Empezamos aquí.",minutos:7,icono:"globe",objetivos:["Explicar qué es una red con tus propias palabras.","Distinguir LAN, WAN e Internet.","Saber qué hacen el router, el switch y el módem."],teoria:[{t:"why",text:"Todo lo que haces en ciberseguridad pasa por una red. Un ataque, una defensa, un juego online… sin entender la red, solo ves magia. Cuando la entiendes, ves el camino exacto de cada dato."},{t:"p",text:"Una red es simplemente un grupo de dispositivos (computadoras, celulares, consolas, servidores) conectados para intercambiar información. Pueden conectarse con cable (Ethernet) o sin cable (Wi-Fi)."},{t:"h",text:"Los tres tamaños de red"},{t:"table",head:["Tipo","Qué es","Ejemplo"],rows:[["LAN","Red local, un mismo lugar","Tu casa, el laboratorio del colegio"],["WAN","Red que une lugares lejanos","Las sucursales de un banco en todo Panamá"],["Internet","La red de todas las redes","Todo el planeta conectado"]]},{t:"h",text:"Los aparatos que hacen que funcione"},{t:"steps",items:[{t:"Mira tu red",d:"En Windows abre «cmd» y escribe ipconfig. En Mac/Linux, abre la terminal y escribe ip a o ifconfig."},{t:"Busca tu IP",d:"Verás algo como 192.168.1.15: esa es la dirección de tu equipo dentro de tu LAN."},{t:"Busca la puerta de enlace",d:"La «puerta de enlace predeterminada» (por ejemplo 192.168.1.1) es tu router: la salida hacia Internet."}]},{t:"result",text:"Deberías poder identificar dos direcciones: la de tu equipo y la del router. Si ambas empiezan igual (192.168.1.x), estás en la misma red local."}],ejemplos:[{juego:"minecraft",titulo:"Tu servidor de Minecraft es una red",texto:"Cuando juegas en LAN con tu primo en la misma casa, sus computadoras forman una red local. Cuando entras a un servidor público como Hypixel, tu PC se conecta a una computadora lejana a través de Internet: una red de redes."},{juego:"panama",titulo:"El Metro de Panamá",texto:"Imagina cada estación del Metro como un dispositivo y las vías como cables. La Línea 1 sería una red (LAN). Cuando la Línea 1 se conecta con la Línea 2 en San Miguelito, formas una red más grande. Internet sería como si todos los metros del mundo estuvieran conectados entre sí."}],practica:[{tipo:"widget",w:"layers",props:{title:"Del celular a Internet",layers:[{name:"Tu dispositivo",desc:"PC, celular o consola. Envía y recibe datos.",example:"Tu PS5 pidiendo entrar a Fortnite"},{name:"Switch",desc:"Conecta dispositivos DENTRO de la red local y entrega cada dato al aparato correcto.",example:"Las 30 PCs del laboratorio del colegio"},{name:"Router",desc:"Conecta TU red con OTRAS redes. Decide por dónde enviar cada paquete.",example:"La cajita Wi-Fi de tu casa"},{name:"Módem / ONT",desc:"Traduce la señal de tu proveedor (fibra, cable) a datos digitales.",example:"El aparato que instaló tu compañía de internet"},{name:"Internet",desc:"Millones de routers de proveedores enlazados por cables submarinos y fibra.",example:"Los cables que llegan a Panamá por el mar"}]}}],reto:{pregunta:"¿Qué aparato conecta tu red de casa con Internet?",opciones:["El switch","El router","El monitor","El teclado"],respuesta:1,explicacion:"El router une redes distintas: tu LAN con la red de tu proveedor. El switch solo reparte datos dentro de la misma red."}},{id:"binario",nivel:1,titulo:"Bits, bytes y binario",subtitulo:"El idioma de las máquinas: solo encendido y apagado.",minutos:9,icono:"torch",objetivos:["Entender qué es un bit y un byte.","Convertir números entre decimal y binario.","Ver por qué las IP van de 0 a 255."],teoria:[{t:"why",text:"Las direcciones IP, las máscaras de red y los permisos de archivos se basan en binario. Si dominas esto, las subredes dejan de ser un misterio."},{t:"p",text:"Un bit es la unidad mínima de información: 0 o 1, apagado o encendido. Un byte son 8 bits juntos. Con 8 bits puedes formar 256 combinaciones distintas (de 0 a 255)."},{t:"steps",items:[{t:"Escribe 10 en binario",d:"Busca los valores que suman 10: 8 + 2. Enciende las lámparas 8 y 2 → 00001010."},{t:"Escribe 255",d:"Enciende todas: 128+64+32+16+8+4+2+1 = 255 → 11111111. Por eso ningún número de una IP pasa de 255."},{t:"Escribe 192",d:"128 + 64 = 192 → 11000000. Este número aparece en casi todas las IP de casa (192.168…)."}]},{t:"result",text:"Con el simulador, al encender 128 y 64 deberías ver 192. Si enciendes todas, 255."},{t:"tip",text:"Truco rápido: memoriza la escalera 128-64-32-16-8-4-2-1. Para convertir, ve de izquierda a derecha restando lo que quepa."}],ejemplos:[{juego:"minecraft",titulo:"Lámparas de redstone",texto:"Pon 8 lámparas de redstone en fila. Cada una puede estar apagada (0) o encendida (1). La de la derecha vale 1, la siguiente 2, luego 4, 8, 16, 32, 64 y 128. Para escribir el número 5 enciendes la de 4 y la de 1: 00000101. ¡Acabas de construir un byte!"},{juego:"fortnite",titulo:"Velocidad de internet",texto:"Cuando tu plan dice «100 Mbps» son megaBITS por segundo, no megaBYTES. Divide entre 8: descargarías ~12,5 MB por segundo. Por eso la actualización de 20 GB de Fortnite tarda más de lo que parece."}],practica:[{tipo:"widget",w:"binary",props:{}}],reto:{pregunta:"¿Cuánto vale 00010001 en decimal?",opciones:["11","17","9","34"],respuesta:1,explicacion:"Están encendidas las posiciones 16 y 1: 16 + 1 = 17."}},{id:"ip-subredes",nivel:2,titulo:"Direcciones IP y subredes",subtitulo:"La dirección de cada casa en el barrio digital.",minutos:12,icono:"flag",objetivos:["Leer una IPv4 y su máscara.","Calcular red, broadcast y hosts de una subred.","Distinguir IP pública de privada."],teoria:[{t:"why",text:"En ciberseguridad lo primero que haces es mapear la red: qué IPs existen y qué rango cubren. Sin saber subredes, no sabrías ni dónde buscar."},{t:"p",text:"Una dirección IPv4 son 4 números de 0 a 255 separados por puntos (32 bits en total), como 192.168.1.20. Identifica a un dispositivo dentro de una red, igual que una dirección postal identifica una casa."},{t:"h",text:"La máscara: dónde termina el barrio y empieza la casa"},{t:"p",text:"La máscara (o el /24 del CIDR) dice cuántos bits son de red. /24 significa que los primeros 24 bits (tres números) son el barrio y el último número es la casa. Así, en 192.168.1.0/24 caben 254 dispositivos (.1 a .254)."},{t:"steps",items:[{t:"Prueba 192.168.1.20/24",d:"Verás red 192.168.1.0, broadcast 192.168.1.255 y 254 hosts útiles."},{t:"Cambia a /26",d:"Ahora solo 6 bits para hosts: 62 dispositivos. Útil para separar, por ejemplo, las cámaras del resto."},{t:"Cambia a /30",d:"Solo 2 hosts: típico para enlazar dos routers entre sí."}]},{t:"result",text:"Cuanto más grande el número después de la barra, más pequeña la subred. /24 = 254 hosts, /26 = 62, /30 = 2."},{t:"table",head:["Rango privado","Uso típico"],rows:[["10.0.0.0/8","Empresas grandes"],["172.16.0.0/12","Empresas medianas, Docker"],["192.168.0.0/16","Casas y oficinas pequeñas"]]},{t:"p",text:"Las IP privadas solo existen dentro de tu red: miles de casas en Panamá usan 192.168.1.x a la vez sin chocar. Hacia Internet, tu router usa una sola IP pública (eso se llama NAT; lo verás en la lección de firewalls)."}],ejemplos:[{juego:"panama",titulo:"Direcciones en Panamá",texto:"Piensa en «Provincia de Panamá → Distrito de San Miguelito → Corregimiento → Casa 20». La parte de red de la IP es como provincia-distrito-corregimiento (dónde está el barrio) y la parte de host es el número de casa."},{juego:"fortnite",titulo:"Coordenadas del mapa",texto:"En Fortnite, la cuadrícula del mapa (B4, C6…) te dice la zona; luego afinas el punto exacto. La IP funciona igual: la parte de red te lleva a la zona y la parte de host al jugador exacto."}],practica:[{tipo:"widget",w:"subnet",props:{}}],reto:{pregunta:"¿Cuántos hosts útiles tiene una red /24?",opciones:["256","255","254","24"],respuesta:2,explicacion:"256 direcciones menos 2 reservadas (la de red .0 y la de broadcast .255) = 254 hosts."}},{id:"osi",nivel:3,titulo:"Capas y encapsulamiento",subtitulo:"Cofres dentro de cofres: cómo se empaqueta un dato.",minutos:11,icono:"chest",objetivos:["Nombrar las capas del modelo TCP/IP.","Entender el encapsulamiento.","Saber en qué capa ocurre cada ataque."],teoria:[{t:"why",text:"Cuando un analista dice «es un ataque de capa 7» o «capa 2», está hablando de este modelo. Te permite ubicar cualquier problema: ¿falla el cable, la IP o la aplicación?"},{t:"p",text:"Enviar datos por la red es como enviar un regalo: lo metes en una caja, esa caja en otra con la dirección, y esa en un contenedor. Cada capa añade su propia «caja» (cabecera) con la información que necesita. Eso es el encapsulamiento."},{t:"steps",items:[{t:"Avanza el simulador",d:"Pulsa «Siguiente capa» y mira cómo el mensaje se envuelve en cabeceras HTTP → TCP → IP → Ethernet."},{t:"Fíjate en el tamaño",d:"Cada capa añade bytes. Un mensaje de 20 bytes acaba ocupando ~74 en el cable."},{t:"Desencapsula",d:"En el receptor el proceso se invierte: cada capa quita su cabecera y pasa el resto hacia arriba."}]},{t:"result",text:"Al final deberías ver 4 cajas anidadas: [Ethernet [IP [TCP [HTTP: mensaje]]]]."}],ejemplos:[{juego:"minecraft",titulo:"Cofres dentro de shulkers",texto:"Tu mensaje es un diamante. Lo metes en un cofre (capa aplicación), el cofre en una caja de shulker con etiqueta del puerto (transporte), esa caja en un carrito con la dirección de destino (red) y el carrito en los rieles (enlace/físico). Al llegar, se abre todo al revés."},{juego:"panama",titulo:"El Canal de Panamá y los contenedores",texto:"Un barco que cruza el Canal lleva contenedores. Dentro de cada contenedor hay cajas, y dentro de las cajas, productos. Al barco solo le importa llegar al puerto correcto (capa de red); al contenedor, ir al almacén correcto (transporte); a la caja, el cliente final (aplicación)."}],practica:[{tipo:"widget",w:"encap",props:{}},{tipo:"widget",w:"layers",props:{title:"Modelo TCP/IP (4 capas) ↔ OSI (7 capas)",layers:[{name:"Aplicación (OSI 5-7)",desc:"Lo que ve el usuario: HTTP, DNS, SSH, el protocolo del juego.",example:"Ataques: phishing, inyección SQL, DDoS de capa 7"},{name:"Transporte (OSI 4)",desc:"TCP o UDP. Puertos, orden y fiabilidad de la entrega.",example:"Ataques: SYN flood, escaneo de puertos"},{name:"Red / Internet (OSI 3)",desc:"Direcciones IP y enrutamiento entre redes.",example:"Ataques: IP spoofing, ataques al enrutamiento"},{name:"Enlace + Físico (OSI 1-2)",desc:"Direcciones MAC, Wi-Fi, cables, señales eléctricas.",example:"Ataques: ARP spoofing, wifi falsas, cortar el cable"}]}}],reto:{pregunta:"Un escaneo de puertos ocurre principalmente en la capa…",opciones:["Física","Transporte","Aplicación","Enlace"],respuesta:1,explicacion:"Los puertos son cosa de la capa de transporte (TCP/UDP). El escáner prueba qué puertos responden."}},{id:"tcp-udp",nivel:4,titulo:"TCP, UDP y puertos",subtitulo:"Por qué Fortnite usa UDP y tu banco usa TCP.",minutos:12,icono:"ship",objetivos:["Explicar el saludo de 3 pasos de TCP.","Elegir TCP o UDP según el caso.","Reconocer los puertos más importantes."],teoria:[{t:"why",text:"Los atacantes buscan puertos abiertos como quien busca puertas sin llave. Saber qué servicio vive en cada puerto es la base del reconocimiento y de la defensa."},{t:"p",text:"La IP lleva el paquete hasta la computadora correcta, pero dentro de esa computadora hay muchos programas. El puerto indica a qué programa va: es un número de 0 a 65535."},{t:"h",text:"TCP: la llamada formal"},{t:"p",text:"TCP garantiza que todo llegue completo y en orden. Antes de hablar, hace un saludo de tres pasos (3-way handshake). Si algo se pierde, lo reenvía."},{t:"h",text:"UDP: el grito rápido"},{t:"p",text:"UDP envía sin saludar y sin confirmar. Es más rápido pero puede perder paquetes. Ideal cuando la velocidad importa más que la perfección."},{t:"warn",text:"El puerto 3389 (RDP) o 22 (SSH) expuestos a Internet con contraseñas débiles son de las entradas más usadas por atacantes. Ciérralos o protégelos con VPN y llaves."}],ejemplos:[{juego:"panama",titulo:"Las esclusas del Canal",texto:"La IP es el puerto de Balboa (la ciudad). El número de puerto es el muelle exacto: muelle 443 para la web segura, muelle 22 para el acceso remoto, muelle 25565 para Minecraft. Un barco con la ciudad correcta pero el muelle equivocado no descarga nada."},{juego:"fortnite",titulo:"Por qué los juegos usan UDP",texto:"En Fortnite tu posición se envía decenas de veces por segundo. Si un paquete se pierde, no tiene sentido reenviarlo: ya llegó uno más nuevo. Con TCP, esperar el reenvío causaría «lag». Por eso los juegos online usan UDP, y la tienda de V-Bucks (pagos) usa TCP/HTTPS."}],practica:[{tipo:"widget",w:"flow",props:{title:"Saludo TCP de 3 pasos",actors:["Tu PC","Servidor"],steps:[{from:0,to:1,label:"SYN",detail:"«Hola, ¿podemos hablar? Mi número de secuencia es 100.»"},{from:1,to:0,label:"SYN-ACK",detail:"«Sí, recibí tu 100. Mi número es 300.»"},{from:0,to:1,label:"ACK",detail:"«Recibí tu 300.» → Conexión establecida."},{from:0,to:1,label:"DATOS",detail:"Ahora sí viajan los datos (por ejemplo la petición web)."}]}},{tipo:"widget",w:"match",props:{title:"Une cada puerto con su servicio",pairs:[["22","SSH (acceso remoto)"],["53","DNS"],["80","HTTP (web sin cifrar)"],["443","HTTPS (web segura)"],["3389","Escritorio remoto Windows"],["25565","Servidor de Minecraft"]]}}],reto:{pregunta:"Para una videollamada en vivo, ¿qué protocolo de transporte encaja mejor?",opciones:["TCP, porque nunca pierde nada","UDP, porque prioriza la velocidad","Ninguno","FTP"],respuesta:1,explicacion:"En tiempo real es mejor perder un fotograma que congelar la llamada esperando reenvíos. UDP gana."}},{id:"dns",nivel:5,titulo:"DNS: la guía telefónica",subtitulo:"Cómo «minecraft.net» se convierte en una IP.",minutos:9,icono:"key",objetivos:["Explicar para qué sirve DNS.","Seguir una resolución DNS paso a paso.","Reconocer ataques DNS comunes."],teoria:[{t:"why",text:"Si alguien controla tu DNS, puede mandarte a una web falsa aunque escribas bien la dirección. Es uno de los trucos favoritos del phishing."},{t:"p",text:"Las computadoras se hablan con IPs (números), pero los humanos recordamos nombres. DNS (Domain Name System) traduce nombres como minecraft.net a direcciones IP."},{t:"steps",items:[{t:"Pruébalo en tu PC",d:"Abre la terminal y escribe: nslookup minecraft.net"},{t:"Lee la respuesta",d:"Verás el servidor DNS que respondió y una o varias IP del dominio."},{t:"Compara",d:"Haz nslookup google.com: varias IPs, porque grandes servicios reparten la carga."}]},{t:"result",text:"nslookup devuelve un bloque «Non-authoritative answer» con Name y Address(es). Esas son las IP a las que realmente te conectas."},{t:"warn",text:"DNS spoofing / envenenamiento: un atacante falsea respuestas DNS para mandarte a su servidor. Defensas: DNS sobre HTTPS (DoH), DNSSEC y fijarte siempre en el candado y el dominio exacto."}],ejemplos:[{juego:"panama",titulo:"La guía telefónica de toda la vida",texto:"Antes, si querías llamar a la pizzería, buscabas su nombre en la guía y obtenías el número. DNS es esa guía: das el nombre del sitio y te devuelve su «número» (la IP)."}],practica:[{tipo:"widget",w:"flow",props:{title:"Resolviendo www.minecraft.net",actors:["Tu PC","Resolver","Raíz","TLD .net","DNS de minecraft"],steps:[{from:0,to:1,label:"¿IP de www.minecraft.net?",detail:"Tu PC pregunta al resolver de tu proveedor (o 1.1.1.1 / 8.8.8.8). Primero revisa su caché."},{from:1,to:2,label:"¿Quién maneja .net?",detail:"El resolver pregunta a un servidor raíz. Hay 13 identidades raíz repartidas por el mundo."},{from:2,to:1,label:"Pregunta al TLD .net",detail:"La raíz no sabe la IP, pero sabe quién administra .net."},{from:1,to:3,label:"¿Quién maneja minecraft.net?",detail:"El servidor del TLD .net indica los servidores autoritativos del dominio."},{from:3,to:1,label:"Pregunta a ns1.minecraft…",detail:"Te pasa la dirección del DNS autoritativo de Minecraft."},{from:1,to:4,label:"¿IP de www?",detail:"Pregunta final al dueño del dominio."},{from:4,to:1,label:"→ 13.107.x.x",detail:"Respuesta con la IP y un TTL (cuánto tiempo guardarla en caché)."},{from:1,to:0,label:"IP lista",detail:"Tu PC ya puede conectarse por TCP al puerto 443. Todo esto suele tardar menos de 50 ms."}]}}],reto:{pregunta:"¿Qué devuelve una consulta DNS de tipo A?",opciones:["Una dirección IPv4","Una contraseña","Un puerto","Un archivo"],respuesta:0,explicacion:"El registro A asocia un nombre con una dirección IPv4. El registro AAAA hace lo mismo con IPv6."}},{id:"ping",nivel:6,titulo:"Ping, latencia y traceroute",subtitulo:"Por qué tienes 120 de ping jugando desde Panamá.",minutos:9,icono:"pickaxe",objetivos:["Medir latencia con ping.","Seguir saltos con traceroute.","Entender por qué la distancia importa."],teoria:[{t:"why",text:"Ping y traceroute son las primeras herramientas de diagnóstico de cualquier técnico. También sirven para descubrir qué hosts están vivos en una red."},{t:"p",text:"La latencia (ping) es el tiempo que tarda un paquete en ir y volver, medido en milisegundos (ms). No depende solo de tu velocidad contratada: depende sobre todo de la distancia y de cuántos routers hay por el medio."},{t:"term",title:"Así se ve en tu terminal",text:`$ ping -c 3 minecraft.net
64 bytes from 13.107.x.x: icmp_seq=1 ttl=117 time=61.8 ms

o el router."}},{id:"firewall",nivel:7,titulo:"Firewall, NAT y Wi-Fi seguro",subtitulo:"El guardia en la puerta del castillo.",minutos:12,icono:"sword",objetivos:["Escribir reglas de firewall básicas.","Entender NAT.","Proteger tu Wi-Fi."],teoria:[{t:"why",text:"El firewall es la primera línea de defensa de cualquier red. Configurarlo bien bloquea la mayoría de ataques automáticos antes de que toquen tus equipos."},{t:"p",text:"Un firewall revisa cada paquete y decide según reglas: permitir o bloquear. Las reglas se leen de arriba abajo y la primera que coincide gana. Al final suele haber una regla «bloquear todo lo demás»."},{t:"steps",items:[{t:"Analiza el tráfico",d:"Mira los paquetes que llegan: web, SSH, Minecraft y un escaneo sospechoso."},{t:"Escribe las reglas",d:"Permite 443 y 25565, permite 22 solo desde tu IP de confianza y bloquea todo lo demás."},{t:"Simula",d:"Ejecuta y revisa qué paquetes pasaron. El objetivo: 0 paquetes maliciosos dentro."}]},{t:"result",text:"Con una política «denegar por defecto», todo lo que no permitiste expresamente queda fuera. Ese es el principio de mínimo privilegio aplicado a la red."},{t:"h",text:"NAT: muchas casas, una sola dirección"},{t:"p",text:"Tu router traduce las IP privadas de tus dispositivos (192.168.1.x) a una única IP pública. Desde fuera, toda tu casa parece un solo dispositivo. Como efecto secundario, nadie de Internet puede iniciar conexiones hacia tus equipos sin que tú abras un puerto."},{t:"list",items:["Usa WPA3 (o WPA2-AES) en tu Wi-Fi, nunca WEP.","Cambia la contraseña del panel del router (no dejes admin/admin).","Desactiva WPS: su PIN se puede romper por fuerza bruta.","Crea una red de invitados para visitas y aparatos inteligentes.","Actualiza el firmware del router."]},{t:"warn",text:"Abrir puertos en el router (port forwarding) para tu servidor de Minecraft expone tu equipo a todo Internet. Hazlo solo en el puerto necesario y mantén el servidor actualizado."}],ejemplos:[{juego:"minecraft",titulo:"La whitelist de tu servidor",texto:"En tu servidor de Minecraft activas la whitelist: solo entran los jugadores de la lista, el resto es rechazado. Un firewall es una whitelist para paquetes: solo pasan los puertos y direcciones que tú permites."},{juego:"panama",titulo:"El edificio con un solo apartado postal",texto:"Imagina un edificio en Bella Vista donde todas las cartas llegan a un único apartado postal y el conserje las reparte por apartamento. Desde fuera solo se conoce el apartado (IP pública); el conserje (router con NAT) sabe a quién va cada carta."}],practica:[{tipo:"widget",w:"firewall",props:{}}],reto:{pregunta:"¿Qué significa «denegar por defecto» en un firewall?",opciones:["Permitir todo y bloquear lo malo conocido","Bloquear todo salvo lo permitido expresamente","Apagar el router","Bloquear solo el Wi-Fi"],respuesta:1,explicacion:"Es la política más segura: si no hay una regla que lo permita, se bloquea. Así lo desconocido no entra."}}]},{id:"sistemas",nombre:"Mundo Sistemas Operativos",bioma:"Bioma Cueva",tagline:"El jefe invisible que manda en tu computadora.",descripcion:"Kernel, procesos, CPU, memoria, archivos, usuarios, permisos y la terminal de Linux. Con simuladores y un mini-CTF.",color:"#3ee07a",fondo:"#0d1f12",icono:"monitor",intro:"Aprenderás qué pasa por dentro cuando abres Minecraft: quién le da memoria, quién reparte la CPU, dónde se guardan tus mundos y quién tiene permiso para tocarlos.",niveles:[{id:"que-es-so",nivel:0,titulo:"¿Qué es un sistema operativo?",subtitulo:"Nivel 0: el gerente que nadie ve pero todo lo controla.",minutos:7,icono:"monitor",objetivos:["Explicar qué hace un sistema operativo.","Distinguir hardware, kernel y aplicaciones.","Conocer Windows, Linux, macOS y Android."],teoria:[{t:"why",text:"Los atacantes buscan escalar privilegios dentro del sistema operativo: pasar de usuario normal a administrador. Para defenderlo hay que saber cómo está organizado."},{t:"p",text:"El sistema operativo (SO) es el programa principal que administra el hardware (CPU, memoria, disco, pantalla) y lo reparte entre las aplicaciones. Sin él, cada juego tendría que saber hablar directamente con tu tarjeta gráfica y tu disco."},{t:"table",head:["Sistema","Dónde lo ves","Dato de seguridad"],rows:[["Windows","La mayoría de PCs","Objetivo nº1 del malware por popularidad"],["Linux","Servidores, Android, routers","Domina Internet: ~90% de servidores"],["macOS","Computadoras Apple","Basado en Unix, permisos al estilo Linux"],["Android / iOS","Celulares","Cada app vive aislada en su «caja» (sandbox)"]]}],ejemplos:[{juego:"panama",titulo:"La ACP y el Canal",texto:"La Autoridad del Canal de Panamá decide qué barco pasa, cuándo, por qué esclusa y cuánta agua usa. Los barcos (aplicaciones) no deciden solos: piden turno. El sistema operativo hace lo mismo con la CPU, la memoria y el disco."},{juego:"minecraft",titulo:"Minecraft corre sobre capas",texto:"Minecraft Java no habla con tu hardware: corre sobre Java (JVM), que le pide recursos al sistema operativo, que usa los drivers para mover tu GPU. Por eso el mismo .jar funciona en Windows, Mac y Linux: cada SO pone su propia «base»."}],practica:[{tipo:"widget",w:"layers",props:{title:"Las capas de una computadora",layers:[{name:"Aplicaciones",desc:"Lo que usas: Minecraft, Chrome, Discord. Piden recursos al SO.",example:"Minecraft pide 4 GB de RAM"},{name:"Llamadas al sistema",desc:"La «ventanilla» para pedir cosas al kernel: abrir archivo, crear proceso, enviar a la red.",example:"open(), read(), fork()"},{name:"Kernel (núcleo)",desc:"El corazón del SO. Maneja memoria, procesos, drivers y seguridad. Corre con privilegios máximos.",example:"Linux, el kernel de Windows NT, XNU de macOS"},{name:"Drivers",desc:"Traductores entre el kernel y cada pieza de hardware concreta.",example:"El driver de tu tarjeta gráfica NVIDIA/AMD"},{name:"Hardware",desc:"Lo físico: CPU, RAM, SSD, GPU, tarjeta de red.",example:"Tu procesador de 8 núcleos"}]}}],reto:{pregunta:"¿Qué parte del sistema operativo tiene los privilegios máximos?",opciones:["El navegador","El kernel","El fondo de pantalla","Los juegos"],respuesta:1,explicacion:"El kernel controla todo el hardware y la memoria. Por eso un fallo en el kernel es lo más grave que puede pasar en seguridad."}},{id:"procesos",nivel:1,titulo:"Procesos e hilos",subtitulo:"Cada programa abierto es un jugador en la partida.",minutos:9,icono:"sword",objetivos:["Diferenciar programa, proceso e hilo.","Leer un administrador de tareas.","Detectar procesos sospechosos."],teoria:[{t:"why",text:"Casi todo malware termina siendo un proceso corriendo en tu equipo. Saber leer la lista de procesos es la forma más directa de detectarlo."},{t:"p",text:"Un programa es un archivo quieto en el disco (minecraft.exe). Cuando lo abres, el SO crea un proceso: el programa en ejecución, con su propia memoria, un número de identificación (PID) y un dueño (usuario). Un proceso puede tener varios hilos que trabajan en paralelo."},{t:"steps",items:[{t:"Abre el administrador",d:"Windows: Ctrl+Shift+Esc · Mac: Monitor de actividad · Linux: comando top o htop."},{t:"Ordena por CPU",d:"Mira quién consume más. Un proceso desconocido al 100% de CPU sin motivo puede ser un minero de criptomonedas."},{t:"Investiga nombres raros",d:"Busca el nombre exacto del proceso en Internet y revisa la ruta del archivo. «svch0st.exe» con cero no es «svchost.exe»."}]},{t:"result",text:"En el simulador, el proceso «xmrig_helper» con usuario desconocido y CPU altísima es el sospechoso. Al terminarlo, la CPU vuelve a la normalidad."},{t:"tip",text:"Los malware imitan nombres legítimos: svchost, explorer, chrome. Mira siempre la ruta: los de Windows viven en C:\\Windows\\System32, no en Descargas o AppData\\Temp."}],ejemplos:[{juego:"fortnite",titulo:"Jugadores en la isla",texto:"El juego instalado es el programa. Cada partida activa es un proceso. Dentro de la partida, tu personaje dispara, construye y se mueve a la vez: esos son los hilos, tareas paralelas del mismo proceso."}],practica:[{tipo:"widget",w:"procs",props:{}}],reto:{pregunta:"¿Qué es un PID?",opciones:["Una contraseña","El número que identifica a cada proceso","Un tipo de virus","Un puerto de red"],respuesta:1,explicacion:"PID = Process ID. El SO numera cada proceso para gestionarlo; con él puedes terminarlo (kill PID en Linux)."}},{id:"cpu",nivel:2,titulo:"Planificación de la CPU",subtitulo:"Cómo un procesador atiende a 200 programas «a la vez».",minutos:10,icono:"xp",objetivos:["Entender el reparto de tiempo de CPU.","Comparar FCFS y Round Robin.","Calcular tiempos de espera."],teoria:[{t:"why",text:"Entender la planificación explica por qué un proceso malicioso puede ralentizar todo el sistema y cómo el SO protege a los procesos importantes."},{t:"p",text:"Un núcleo de CPU solo ejecuta una cosa a la vez. El SO cambia de proceso cientos de veces por segundo (cambio de contexto) para que parezca que todo corre simultáneamente. La parte del kernel que decide a quién le toca se llama planificador (scheduler)."},{t:"steps",items:[{t:"Ejecuta FCFS",d:"Observa el diagrama: el proceso largo bloquea a los cortos. El tiempo de espera medio sube."},{t:"Cambia a Round Robin",d:"Con un quantum (turno) de 2, todos avanzan por turnos. Los cortos terminan antes."},{t:"Juega con el quantum",d:"Quantum muy grande = se parece a FCFS. Muy pequeño = demasiados cambios de contexto (desperdicio)."}]},{t:"result",text:"Con estos procesos, Round Robin reduce la espera media de los procesos cortos aunque el largo tarde un poco más. Así se siente fluido un sistema interactivo."}],ejemplos:[{juego:"panama",titulo:"La fila del diablo rojo",texto:"FCFS (el primero que llega, el primero que se atiende) es como la fila de la parada: si sube primero alguien con 20 bultos, todos esperan. Round Robin es como si el pavo dejara subir a cada pasajero un ratito por turnos: nadie se queda esperando eternamente."},{juego:"minecraft",titulo:"Los ticks de Minecraft",texto:"Un servidor de Minecraft procesa el mundo en «ticks»: 20 por segundo. Si hay demasiadas granjas de redstone, cada tick tarda más y el servidor «laguea» (TPS bajos). Es el mismo problema: demasiado trabajo para el tiempo de CPU disponible."}],practica:[{tipo:"widget",w:"scheduler",props:{}}],reto:{pregunta:"¿Qué ventaja tiene Round Robin frente a FCFS?",opciones:["Usa menos memoria","Ningún proceso acapara la CPU indefinidamente","Es más fácil de programar","No necesita kernel"],respuesta:1,explicacion:"Cada proceso recibe turnos de tiempo fijo. Uno largo no puede bloquear a los demás."}},{id:"memoria",nivel:3,titulo:"Memoria: RAM vs disco",subtitulo:"La hotbar, el inventario y el cofre.",minutos:9,icono:"chest",objetivos:["Ordenar la jerarquía de memoria.","Explicar memoria virtual y swap.","Saber por qué la RAM se borra al apagar."],teoria:[{t:"why",text:"Muchos ataques avanzados viven solo en la RAM (malware «sin archivos») para no dejar rastro en el disco. Y los analistas forenses capturan la RAM para encontrar contraseñas y claves."},{t:"p",text:"Hay memorias rápidas y pequeñas (registros, caché) y lentas y enormes (SSD, disco duro). La RAM está en el medio: rápida, pero volátil: se borra al apagar."},{t:"result",text:"Si un registro tardara 1 segundo, leer del SSD tardaría ~1-2 días y de un disco duro mecánico ~meses. Por eso el SO intenta tener en RAM lo que más usas."},{t:"h",text:"Memoria virtual y swap"},{t:"p",text:"Cada proceso cree tener toda la memoria para él (memoria virtual). El SO traduce esas direcciones a la RAM real y aísla a cada proceso: Minecraft no puede leer la memoria de tu navegador. Si la RAM se llena, el SO pasa trozos poco usados al disco (swap / archivo de paginación), y todo se vuelve lento."},{t:"tip",text:"Ese aislamiento es una barrera de seguridad clave. Los exploits famosos (como Meltdown y Spectre) consistían justamente en romper ese aislamiento para leer memoria ajena."}],ejemplos:[{juego:"minecraft",titulo:"Hotbar, inventario y cofres",texto:"La hotbar (9 casillas) es la caché: lo que usas ya, al instante. El inventario es la RAM: más espacio, a un par de clics. Los cofres de tu base son el disco: caben miles de cosas, pero tienes que caminar hasta ellos. Y si mueres sin keepInventory… pierdes el inventario (la RAM se borra), pero los cofres siguen ahí (el disco persiste)."}],practica:[{tipo:"widget",w:"memory",props:{}}],reto:{pregunta:"Apagas la PC de golpe. ¿Qué se pierde?",opciones:["Los archivos del disco","Lo que estaba solo en la RAM","El sistema operativo","Nada"],respuesta:1,explicacion:"La RAM es volátil: sin corriente, se borra. Lo guardado en disco persiste. Por eso «guardar» significa copiar de RAM a disco."}},{id:"archivos",nivel:4,titulo:"Archivos, rutas y la terminal",subtitulo:"Tus primeros comandos en Linux.",minutos:12,icono:"pickaxe",objetivos:["Moverte por carpetas con cd, ls y pwd.","Leer y crear archivos desde la terminal.","Entender rutas absolutas y relativas."],teoria:[{t:"why",text:"El 90% de los servidores del mundo son Linux y se administran desde la terminal. En ciberseguridad, la terminal es tu herramienta principal: rápida, precisa y automatizable."},{t:"p",text:"Los archivos se organizan en carpetas (directorios) que forman un árbol. En Linux todo empieza en la raíz «/». Tu carpeta personal es /home/tu_usuario, abreviada como «~»."},{t:"table",head:["Comando","Qué hace","Ejemplo"],rows:[["pwd","Dice dónde estás","pwd → /home/steve"],["ls","Lista el contenido","ls -la (incluye ocultos)"],["cd","Cambia de carpeta","cd mundos · cd .. (subir)"],["cat","Muestra un archivo","cat notas.txt"],["mkdir","Crea carpeta","mkdir base"],["touch","Crea archivo vacío","touch diario.txt"],["echo","Escribe texto","echo hola"]]},{t:"result",text:"Al completar la misión habrás navegado por el árbol, listado archivos ocultos y leído un archivo. Son los movimientos básicos de cualquier administrador."},{t:"tip",text:"Usa la tecla Tab para autocompletar y la flecha ↑ para repetir comandos anteriores. En el simulador también funcionan."}],ejemplos:[{juego:"minecraft",titulo:"Coordenadas F3",texto:"Una ruta absoluta es como dar coordenadas exactas (X: 120, Z: -340): funciona desde cualquier lugar. Una ruta relativa es «dos bloques a la izquierda de donde estoy»: depende de tu posición. /home/steve/mundos es absoluta; mundos/survival es relativa."}],practica:[{tipo:"widget",w:"terminal",props:{mission:"basico"}}],reto:{pregunta:"Estás en /home/steve. ¿A dónde te lleva «cd ..»?",opciones:["/home","/home/steve/..","/","A ninguna parte"],respuesta:0,explicacion:"«..» significa la carpeta padre. Desde /home/steve subes a /home."}},{id:"permisos",nivel:5,titulo:"Usuarios y permisos",subtitulo:"Quién es OP en el servidor.",minutos:11,icono:"key",objetivos:["Leer permisos rwx.","Calcular permisos en octal (chmod 755).","Entender root y el mínimo privilegio."],teoria:[{t:"why",text:"Un archivo con permisos mal puestos (por ejemplo, contraseñas legibles por todos) es una de las vulnerabilidades más comunes en servidores reales."},{t:"p",text:"Cada archivo tiene un dueño, un grupo y permisos para tres tipos de personas: el dueño (u), el grupo (g) y los demás (o). Cada uno puede tener r (leer), w (escribir) y x (ejecutar)."},{t:"p",text:"En octal, r = 4, w = 2, x = 1. Se suman: rwx = 7, r-x = 5, r-- = 4. Así, chmod 755 significa dueño rwx, grupo r-x, otros r-x."},{t:"steps",items:[{t:"Script ejecutable",d:"Marca rwx para el dueño y r-x para el resto → 755. Típico de programas."},{t:"Archivo privado",d:"Solo rw para el dueño → 600. Ideal para llaves SSH (~/.ssh/id_ed25519)."},{t:"El error clásico",d:"777 = todos pueden todo. Nunca lo uses «para que funcione»: es una puerta abierta."}]},{t:"result",text:"Si marcas solo lectura y escritura para el dueño, verás 600 y -rw-------. Ese es el permiso correcto para archivos secretos."},{t:"warn",text:"Principio de mínimo privilegio: cada usuario y programa debe tener solo los permisos que necesita. No juegues ni navegues como administrador: si un malware te infecta, heredará todos tus poderes."}],ejemplos:[{juego:"minecraft",titulo:"OP y permisos del servidor",texto:"En tu servidor, el admin con OP (root) puede todo: /gamemode, /ban, /stop. Los jugadores normales solo construyen. Los moderadores (un grupo) tienen algunos poderes extra. Si le das OP a cualquiera, alguien acabará borrando tu spawn."}],practica:[{tipo:"widget",w:"chmod",props:{}}],reto:{pregunta:"¿Qué significa chmod 644 notas.txt?",opciones:["Todos pueden escribir","Dueño lee y escribe; el resto solo lee","Nadie puede leer","Es ejecutable para todos"],respuesta:1,explicacion:"6 = rw- para el dueño, 4 = r-- para el grupo, 4 = r-- para otros."}},{id:"terminal-ctf",nivel:6,titulo:"Misión: caza la bandera",subtitulo:"Mini-CTF en una terminal Linux simulada.",minutos:14,icono:"flag",objetivos:["Usar grep para buscar en archivos.","Encontrar archivos ocultos.","Leer logs como un analista."],teoria:[{t:"why",text:"Los CTF (Capture The Flag) son competencias donde se aprende ciberseguridad resolviendo retos. Encontrar una «flag» escondida en un servidor es exactamente lo que harás aquí."},{t:"p",text:"Nuevos comandos para esta misión: grep (buscar texto dentro de archivos), ls -la (ver archivos ocultos, que empiezan por punto), whoami (quién eres), history (comandos anteriores) y cat sobre logs."},{t:"term",title:"Ejemplos de grep",text:`$ grep "Failed" auth.log      # líneas que contienen Failed
$ grep -i flag notas.txt      # sin distinguir mayúsculas
