...","...WW..."],palette:{C:"#4be0e6",W:"#8b5a2b"}},key:{grid:[".YYY....","Y...Y...","Y...YYYY","Y...Y.Y.",".YYY..YY"],palette:{Y:"#ffcc33"}},search:{grid:["..SSSS..",".S....S.","S......S","S......S",".S....S.","..SSSS..",".....SS.","......Ss"],palette:{S:"#e9e4ff",s:"#8d81a8"}},xp:{grid:["..GG..",".GgGG.","GgGGGG","GGGGGG",".GGGG.","..GG.."],palette:{G:"#7cff3a",g:"#e0ffc0"}},flag:{grid:["WWWWRRRR","WBWWRRRR","WWWWRRRR","BBBBWWWW","BBBBWRWW","BBBBWWWW"],palette:{W:"#ffffff",R:"#d21034",B:"#072357"}},torch:{grid:["..YY..",".YOOY.","..OO..","..WW..","..WW..","..WW..","..WW.."],palette:{Y:"#ffe14a",O:"#ff8a1e",W:"#8b5a2b"}},shield:{grid:[".BBBBBB.","BWWWWWWB","BWSSSSWB","BWSSSSWB",".BWWWWB.",".BWWWWB.","..BWWB..","...BB..."],palette:{B:"#0b2f55",W:"#5ad2ff",S:"#d6ffff"}},home:{grid:["...RR...","..RRRR..",".RRRRRR.","RRRRRRRR",".WWWWWW.",".WWDDWW.",".WWDDWW.",".WWWWWW."],palette:{R:"#e8322b",W:"#c3b6df",D:"#3d3160"}},sword:{grid:[".......CC","......CWC",".....CWC.","....CWC..",".B.CWC...","..BWC....","..WB.....",".W..B...."],palette:{C:"#4be0e6",W:"#d6ffff",B:"#8b5a2b"}}};function re({name:o,size:i=20,className:r}){const d=sg[o];return t.jsx(Th,{grid:d.grid,palette:d.palette,height:i,className:r})}const og=[{id:"vishing",nivel:4,titulo:"La voz del otro lado",subtitulo:"Llamadas, audios y voces clonadas con IA.",minutos:9,icono:"storm",objetivos:["Distinguir vishing (voz), smishing (SMS) y phishing (correo).","Reconocer la urgencia como señal de alarma.","Saber qué hacer cuando ya diste un dato."],teoria:[{t:"why",text:"Una llamada se siente más real que un correo. Por eso funciona: la voz trae confianza prestada, y con diez segundos de audio público hoy se puede clonar."},{t:"p",text:"Vishing es ingeniería social por teléfono. El guion siempre es el mismo: alguien con autoridad (banco, soporte, aduana, tu jefe), un problema urgente y una solución que depende de que tú digas un dato o instales algo."},{t:"list",items:["«Hay un cargo sospechoso, ¿me confirma el código?» → nunca se da.","«Soy del soporte de Microsoft, su equipo tiene un virus» → no existen esas llamadas.","«Ganó un premio, solo pague el envío» → el premio es el gancho.","«Soy tu hijo, cambié de número, necesito plata ya» → pregunta algo que solo él sabría."]},{t:"p",text:"La regla que corta el 95 % de estos intentos: colgar y llamar tú al número oficial. Si es real, el banco lo entenderá. Si no lo es, acabas de esquivarlo."},{t:"warn",text:"Ninguna entidad seria te pide por teléfono un código de verificación, una contraseña o que instales un programa de acceso remoto (AnyDesk, TeamViewer)."},{t:"result",text:"Al terminar deberías poder escuchar una llamada sospechosa y decir en diez segundos por qué lo es."}],ejemplos:[{juego:"minecraft",titulo:"El aldeano que no es aldeano",texto:"En Minecraft, un jugador con skin de aldeano te ofrece diamantes si le sigues a un sitio raro. La skin no es identidad: la voz al teléfono tampoco."},{juego:"panama",titulo:"La llamada de la «aduana»",texto:"«Su paquete está retenido, pague 12 dólares aquí.» Llaman a cientos por día y siempre hay alguien esperando un paquete. La coincidencia no es casualidad: es el método."}],practica:[{tipo:"orden",titulo:"Ordena cómo reaccionar a una llamada sospechosa",pasos:["No dar ningún dato ni confirmar quién eres","Colgar sin discutir","Buscar el número oficial de la entidad","Llamar tú y preguntar si hubo un contacto","Si ya diste un dato: cambiar contraseña y avisar"]}],reto:{pregunta:"Un supuesto técnico te pide instalar AnyDesk para «revisar tu PC». ¿Cuál es el riesgo real?",opciones:["Ninguno, es una herramienta de soporte","Que esa persona tome control de tu equipo y de todo lo que hay dentro","Solo que gaste datos","Que se dañe el teclado"],respuesta:1,explicacion:"El acceso remoto legítimo lo inicias tú desde un soporte que tú contactaste. Si te lo piden por llamada entrante, es control de tu equipo entregado en bandeja."}},{id:"osint",nivel:5,titulo:"Lo que publicas habla por ti",subtitulo:"Huella digital, OSINT y doxxing.",minutos:8,icono:"search",objetivos:["Ver tu propia huella digital como la vería un extraño.","Entender cómo se combinan datos sueltos.","Reducir la información que te expone."],teoria:[{t:"why",text:"Un atacante no adivina tu contraseña a ciegas: primero te investiga. OSINT es información pública —fotos, perfiles, comentarios, repos, metadatos— y con ella se construye un perfil muy preciso."},{t:"p",text:"Cada dato suelto parece inofensivo: el colegio, tu ciudad en una foto, el nombre de tu perro, la empresa donde trabajas. Juntos responden las preguntas de seguridad y alimentan un ataque dirigido."},{t:"list",items:["Una foto con GPS en el celular lleva la ubicación dentro del archivo (EXIF).","El «cumpleaños» en un perfil público es media contraseña de mucha gente.","Un repo de GitHub con una clave pegada es una puerta abierta con el cartel «pase».","Buscar tu propio correo o usuario entre comillas muestra dónde estás registrado."]},{t:"tip",text:"Hazte el ejercicio una vez: busca tu nombre + tu ciudad, y tu usuario principal. Mira qué aparece. Eso es tu superficie pública."},{t:"warn",text:"Publicar datos de otra persona para exponerla (doxxing) tiene consecuencias legales y reales. Aquí se aprende a defenderse, no a hacerlo."},{t:"result",text:"Deberías poder listar tres cosas que publicaste y que hoy quitarías o restringirías."}],ejemplos:[{juego:"minecraft",titulo:"El mapa del servidor",texto:"Si publicas capturas de tu base con coordenadas, cualquiera sabe dónde cavar. En la vida real, las coordenadas son la hora, el colegio y la calle de tu foto."},{juego:"panama",titulo:"El «te vi en el estadio»",texto:"Subes la foto del partido en vivo. Quien la ve sabe que no estás en casa. El dato no es la dirección: es la ausencia."}],practica:[{tipo:"escribir",pregunta:"¿Qué dato de una foto puede revelar dónde la tomaste aunque no lo escribas?",respuestas:["exif","los metadatos","metadatos","exif/metadatos","gps"],pista:"Está dentro del archivo, no en la imagen.",explicacion:"Los metadatos EXIF pueden incluir coordenadas GPS, modelo de cámara y hora exacta. Muchas redes los borran al publicar; los chats y el correo a veces no."}],reto:{pregunta:"Quieres publicar una foto sin revelar tu ubicación. ¿Qué es lo más fiable?",opciones:["Poner la cuenta en privado y ya","Quitar los metadatos y revisar qué se ve en el fondo de la foto","Subirla y borrarla a los cinco minutos","Cambiar el nombre del archivo"],respuesta:1,explicacion:"Privacidad de la cuenta no borra metadatos ni el reflejo en el espejo. Quitar EXIF y mirar el fondo delata menos que confiar en un ajuste."}},{id:"insider",nivel:6,titulo:"El enemigo ya está dentro",subtitulo:"USB, colas y confianza mal puesta.",minutos:9,icono:"key",objetivos:["Conocer los ataques que no necesitan red.","Entender el «tailgating» y el USB abandonado.","Aplicar la regla de verificar sin ofender."],teoria:[{t:"why",text:"La mayoría de las brechas no empiezan con un hacker en una habitación oscura: empiezan con una persona que confía, un dispositivo encontrado o un empleado molesto."},{t:"p",text:"El ataque físico también es ingeniería social. Dejar USBs en un parqueadero (baiting), entrar detrás de alguien con credencial (tailgating), o ganarse al de la recepción durante una semana, sigue funcionando mejor que cualquier exploit."},{t:"list",items:["USB desconocido: nunca se conecta. Se entrega a quien corresponda.","Nadie entra «de cortesía»: se verifica credencial, aunque parezca grosero.","La información sensible no se comenta en la fila del almuerzo.","Un exempleado con accesos vivos es una amenaza interna: se revocan el mismo día."]},{t:"p",text:"La amenaza interna no siempre es maliciosa: a veces es alguien con prisa que manda una base de datos por WhatsApp para «avanzar»."},{t:"tip",text:"Verifica siempre por un canal distinto al que te contactaron. Si te escribieron por WhatsApp, confirma por el interno de la oficina."},{t:"result",text:"Deberías tener claro qué hacer con un USB que aparece y cómo frenar a alguien sin credencial."}],ejemplos:[{juego:"minecraft",titulo:"El cofre trampa",texto:"Un cofre regalado en medio del camino con diamantes dentro suele tener TNT debajo. El USB con etiqueta «nómina 2026» es ese cofre."},{juego:"panama",titulo:"El de la caja",texto:"Alguien con uniforme de repartidor y una caja grande espera a que salga un empleado y entra detrás. No forzó nada: usó la cortesía."}],practica:[{tipo:"orden",titulo:"Qué hacer con un USB que aparece en el estacionamiento",pasos:["No conectarlo a ningún equipo","Guardarlo en una bolsa y etiquetarlo","Avisar a seguridad o a TI","Que lo analicen en un equipo aislado si hace falta","Recordar al equipo por qué no se conecta nada ajeno"]}],reto:{pregunta:"Alguien con credencial entra detrás de ti sin pasar su tarjeta porque «se le olvidó». ¿Qué haces?",opciones:["Le dejo pasar, es una molestia innecesaria","Le pido amablemente que pase su credencial o lo acompaño a recepción","Le pregunto el nombre y ya","Le tomo una foto y lo publico"],respuesta:1,explicacion:"El tailgating vive de la pena social. Pedirlo con amabilidad, o acompañar a recepción, detiene el ataque sin acusar a nadie: puede ser un empleado nuevo de verdad."}},{id:"etica",nivel:7,titulo:"El límite legal",subtitulo:"Permiso, ética y consecuencias reales.",minutos:8,icono:"shield",objetivos:["Saber cuándo una prueba es legal y cuándo es delito.","Entender qué es un alcance (scope) por escrito.","Conocer el camino correcto para practicar."],teoria:[{t:"why",text:"Saber hacer algo no es permiso para hacerlo. La diferencia entre un profesional de seguridad y un delincuente es un documento firmado: el permiso."},{t:"p",text:"Escanear una red, probar contraseñas o leer tráfico sin autorización es un delito en Panamá y en casi todo el mundo, aunque no dañes nada y aunque «solo querías ver». La intención no cambia el hecho."},{t:"list",items:["Alcance escrito: qué sistemas, qué fechas, qué técnicas permitidas.","Nunca tocar lo que no está en la lista, ni «de pasada».","Si encuentras datos de personas, se reportan, no se copian.","Los laboratorios y las plataformas legales existen para practicar sin riesgo."]},{t:"p",text:"Este curso está hecho para que practiques en simuladores propios: la red 10.0.0.0/24 del laboratorio es ficticia y nada de lo que hagas aquí sale de tu navegador."},{t:"warn",text:"El «hackeo ético» sin contrato no existe: es intrusión con buenas intenciones, y las buenas intenciones no se defienden en un juzgado."},{t:"result",text:"Deberías poder explicar a alguien por qué el permiso por escrito es lo primero que se pide en cualquier trabajo de seguridad."}],ejemplos:[{juego:"minecraft",titulo:"Servidor ajeno",texto:"Entrar a un servidor con un bug para «avisar» sigue siendo entrar sin permiso. Lo correcto: escribir al dueño y reportar el fallo."},{juego:"panama",titulo:"El examen de la universidad",texto:"Tener la habilidad de ver el examen del profesor no te da derecho a mirarlo. La ética es lo que haces cuando nadie te ve."}],practica:[{tipo:"escribir",pregunta:"Antes de una prueba de penetración, ¿qué documento define qué puedes tocar?",respuestas:["el alcance","alcance","scope","el scope","contrato"],pista:"En inglés se llama scope.",explicacion:"El alcance fija sistemas, fechas y técnicas permitidas. Todo lo que quede fuera de él está prohibido, aunque sea fácil."}],reto:{pregunta:"Encuentras una web de tu ciudad con una falla evidente. ¿Cuál es el camino correcto?",opciones:["Aprovecharla para demostrar que existe","Contactar al dueño o a un programa de divulgación responsable y no tocar nada más","Publicarla en redes para que la arreglen rápido","Venderla a alguien que la compre"],respuesta:1,explicacion:"La divulgación responsable avisa en privado, da tiempo a arreglar y no explota el fallo. Publicar o usar la falla te convierte en el atacante."}}],ig=[{id:"firma",nivel:6,titulo:"Firmas digitales",subtitulo:"Quién lo dijo y que no cambió nada.",minutos:9,icono:"key",objetivos:["Diferenciar cifrar de firmar.","Entender hash + clave privada = firma.","Verificar una firma y saber qué garantiza."],teoria:[{t:"why",text:"Cifrar esconde el mensaje. Firmar demuestra quién lo escribió y que nadie lo cambió. Son dos problemas distintos y se resuelven con herramientas distintas."},{t:"p",text:"Una firma digital es un hash del mensaje cifrado con la clave privada del autor. Cualquiera con su clave pública recalcula el hash y comprueba dos cosas: que la firma corresponde a ese mensaje y que el mensaje no cambió ni un punto."},{t:"list",items:["Firma: autenticidad + integridad. No da confidencialidad.","Cifrado: confidencialidad. No dice quién escribió.","Si el mensaje cambia, el hash cambia y la firma deja de validar.","La clave privada firma; la pública verifica. Al revés no funciona."]},{t:"tip",text:"TLS, las actualizaciones del sistema y los commits firmados usan exactamente esta idea: hash + clave privada."},{t:"result",text:"Deberías poder explicar por qué una firma válida no significa que el mensaje sea verdad, solo que lo escribió quien dice."}],ejemplos:[{juego:"minecraft",titulo:"El sello del rey",texto:"El sello demuestra que la carta viene del rey y que nadie la abrió, pero no la hace secreta: cualquiera puede leerla."},{juego:"panama",titulo:"La firma del notario",texto:"El notario no guarda secreto de lo que firmas: certifica que fuiste tú y que el documento es ese y no otro."}],practica:[{tipo:"hash"}],reto:{pregunta:"Recibes un archivo con su firma digital y la firma es válida. ¿Qué puedes afirmar?",opciones:["Que el archivo es seguro y no tiene virus","Que lo firmó quien dice y que no se modificó desde entonces","Que el archivo viajó cifrado","Que el archivo es legal"],respuesta:1,explicacion:"La firma habla de autoría e integridad. Un instalador firmado por una empresa real puede seguir siendo un programa que no quieres en tu equipo."}},{id:"tls",nivel:7,titulo:"El túnel: TLS de verdad",subtitulo:"El candado negocia una clave en milisegundos.",minutos:10,icono:"globe",objetivos:["Entender qué pasa cuando abres una web con HTTPS.","Ver el papel de los certificados y las autoridades.","Distinguir cifrado de confianza."],teoria:[{t:"why",text:"Cuando entras a un banco, tu navegador y el servidor acuerdan una clave secreta en milisegundos sin que nadie más pueda copiarla. Eso es TLS, y es lo que hace usable la criptografía asimétrica."},{t:"steps",items:[{t:"1 · Hola",d:"El navegador dice qué versiones y cifrados soporta."},{t:"2 · Certificado",d:"El servidor responde con su certificado, firmado por una autoridad (CA)."},{t:"3 · Verificación",d:"El navegador comprueba la firma de la CA y que el dominio coincida."},{t:"4 · Acuerdo de clave",d:"Intercambio Diffie-Hellman: ambos calculan la misma clave sin enviarla."},{t:"5 · Túnel",d:"Todo el tráfico va cifrado y autenticado con esa clave de sesión."}]},{t:"p",text:"TLS mezcla las dos familias: asimétrica para identificarse y acordar la clave, simétrica para el volumen. Esa es la receta de casi todo lo seguro que usas."},{t:"warn",text:"Un certificado válido solo dice que el dominio es ese. Un sitio de phishing con certificado válido sigue siendo phishing: mira siempre el dominio, no el candado."},{t:"result",text:"Deberías poder contar el handshake de memoria y explicar por qué el candado no es un sello de confianza."}],ejemplos:[{juego:"minecraft",titulo:"La puerta blindada",texto:"TLS es la puerta blindada del servidor: te protege del que escucha en el pasillo, pero no te dice si el dueño de la casa es buena gente."},{juego:"panama",titulo:"El sobre y el sello",texto:"El sobre cerrado (cifrado) protege el contenido; el sello (certificado) dice de dónde viene. Necesitas los dos, y ninguno te dice si el remitente te quiere estafar."}],practica:[{tipo:"orden",titulo:"Ordena el handshake de TLS",pasos:["ClientHello: versiones y cifrados","ServerHello + certificado","El navegador verifica la CA y el dominio","Intercambio de claves Diffie-Hellman","Tráfico cifrado con la clave de sesión"]}],reto:{pregunta:"¿Por qué TLS usa cifrado simétrico para los datos y no solo asimétrico?",opciones:["Porque el simétrico es más rápido y el asimétrico se reserva para acordar la clave","Porque el asimétrico es ilegal en algunos países","Porque el simétrico no necesita contraseña","Porque el asimétrico no se puede romper"],respuesta:0,explicacion:"El asimétrico es caro computacionalmente; el simétrico vuela. TLS usa lo mejor de cada uno: identidad asimétrica, volumen simétrico."}}];function lg(o){o.mundos.find(i=>i.id==="social")?.niveles.push(...og),o.mundos.find(i=>i.id==="cripto")?.niveles.push(...ig)}const rg={id:"web",nombre:"Mundo Web",bioma:"Ruinas del foro",tagline:"La web por dentro: peticiones, formularios y sus grietas.",descripcion:"Todo lo que usas vive en una web: el banco, el colegio, tu juego. Aquí ves qué viaja en cada clic y por qué un formulario mal hecho regala la base de datos.",color:"#b98bff",fondo:"#1f1233",icono:"monitor",intro:"Una web son dos programas hablando: el navegador pide, el servidor responde. Casi todas las brechas famosas nacen de no desconfiar de lo que llega en esa petición.",niveles:[{id:"que-es-web",nivel:0,titulo:"Cómo viaja una página",subtitulo:"HTTP en una petición y una respuesta.",minutos:8,icono:"globe",objetivos:["Leer una petición HTTP de verdad.","Entender métodos, cabeceras y códigos de estado.","Saber dónde se puede colar algo raro."],teoria:[{t:"why",text:"Si no sabes qué viaja en un clic, no puedes defenderlo. Toda la seguridad web es leer peticiones y decidir si son legítimas."},{t:"p",text:"Tu navegador manda una petición: un método (GET para pedir, POST para enviar), una ruta, cabeceras con contexto y, a veces, un cuerpo. El servidor contesta con un código y el contenido."},{t:"table",head:["Código","Significa","Cuándo lo ves"],rows:[["200","Todo bien","La página carga"],["301 / 302","Se mudó","Redirección a otra URL"],["403","Prohibido","No tienes permiso"],["401","No identificado","Falta iniciar sesión"],["404","No existe","URL mal escrita"],["500","Error del servidor","El programa falló"]]},{t:"p",text:"Cada parte de la petición es una entrada que el servidor debe tratar como hostil: la ruta, las cabeceras, las cookies y el cuerpo. Si una de esas se cuela en una consulta o en una página, tienes una brecha."},{t:"tip",text:"En el navegador, F12 → Red (Network) muestra cada petición con sus cabeceras. Es la herramienta más útil para entender esto."},{t:"result",text:"Deberías poder explicar la diferencia entre un 401 y un 403, y por qué importa."}],ejemplos:[{juego:"minecraft",titulo:"El cartero del servidor",texto:"Tu navegador es un cartero: lleva una carta con remitente, destinatario y a veces un paquete. El servidor responde con otra carta y un sello (el código de estado)."},{juego:"panama",titulo:"El mostrador del banco",texto:"Llegas a la ventanilla, dices qué quieres (método) y muestras tu cédula (cookie). Si la cédula es falsa o el formulario está mal pedido, el cajero no debería entregar nada."}],practica:[{tipo:"orden",titulo:"Ordena cómo se carga una página con sesión",pasos:["El navegador escribe la URL y resuelve el DNS","Abre la conexión TLS con el servidor","Envía GET /cuenta con la cookie de sesión","El servidor valida la cookie y consulta la base de datos","Responde 200 con el HTML ya rellenado"]}],reto:{pregunta:"Un servidor responde 401 a una petición tuya. ¿Qué te está diciendo?",opciones:["Que la página no existe","Que no sabe quién eres: falta identificarte","Que el servidor se cayó","Que tienes permiso pero el servidor está lento"],respuesta:1,explicacion:"401 es «no autenticado» (falta identidad). 403 es «te conozco, pero no puedes pasar» (falta permiso). Confundirlos esconde errores de diseño."}},{id:"formularios",nivel:1,titulo:"Lo que el navegador cree",subtitulo:"Validar en el cliente no es validar.",minutos:9,icono:"key",objetivos:["Ver por qué el navegador no es de fiar.","Entender campos ocultos y mass assignment.","Validar siempre en el servidor."],teoria:[{t:"why",text:"Todo lo que está en el navegador lo puede cambiar el usuario. Si confías en él, cualquiera se pone el sueldo que quiera en un formulario."},{t:"p",text:"Un formulario envía pares nombre/valor. El HTML puede limitar con `maxlength`, `type=email` o JavaScript, pero eso es comodidad para el usuario, no seguridad: se saltan con F12, con curl o cambiando el HTML."},{t:"list",items:["Validación en el cliente: ayuda y experiencia. Se evade en segundos.","Validación en el servidor: la única que cuenta.","Campos ocultos (input hidden) no son secretos: se ven en el HTML.","Si el servidor acepta cualquier campo, puedes mandar `rol=admin` aunque no exista en el formulario."]},{t:"warn",text:"Nunca pongas precios, roles ni identificadores críticos en campos que el navegador controla. Se deciden en el servidor."},{t:"result",text:"Deberías poder explicar por qué «si no se puede escribir, no se puede enviar» es falso."}],ejemplos:[{juego:"minecraft",titulo:"El cartel del precio",texto:"Poner el precio en un cartel que el cliente puede editar es pedir que te paguen 1 esmeralda por un diamante. El precio lo decide la tienda, no el cartel."},{juego:"panama",titulo:"La boleta del sorteo",texto:"Si tú mismo rellenas el número premiado de la boleta, el sorteo no existe. En una web, el «número premiado» lo pone el servidor."}],practica:[{tipo:"escribir",pregunta:"¿Dónde se valida de verdad un formulario: en el navegador o en el servidor?",respuestas:["en el servidor","servidor","el servidor","backend"],pista:"Donde el usuario no puede tocar el código.",explicacion:"El navegador es del usuario: puede modificar el HTML, saltarse el JavaScript y enviar lo que quiera. El servidor es el único punto de control real."}],reto:{pregunta:"Una tienda calcula el total en JavaScript y lo manda en un campo oculto. ¿Cuál es el fallo?",opciones:["Ninguno, el campo está oculto","El total lo pone el cliente: se puede cambiar antes de enviar","Es lento calcular en el navegador","El campo oculto gasta datos"],respuesta:1,explicacion:"Oculto no es seguro: el valor viaja en la petición y se edita con F12. El servidor debe recalcular el total con los precios de su base de datos."}},{id:"xss",nivel:2,titulo:"Cuando tu web habla por otros",subtitulo:"XSS: el código que se ejecuta en el navegador ajeno.",minutos:10,icono:"storm",objetivos:["Entender qué es XSS y por qué es grave.","Distinguir reflejado, almacenado y DOM.","Evitarlo con renderizado seguro y escape según el contexto.","Entender CSP y HttpOnly como capas de defensa, no como cura."],teoria:[{t:"why",text:"XSS hace que el navegador trate datos no confiables como código del sitio. Ese código puede actuar con los permisos de la víctima y cambiar lo que ve o hace. Si la cookie es HttpOnly, el script no la lee directamente, pero todavía podría realizar acciones desde esa sesión."},{t:"p",text:"Ocurre cuando la web mete datos del usuario en el HTML sin escaparlos. Si un comentario dice `<script>…<\/script>` y el servidor lo pinta tal cual, el navegador lo ejecuta como parte de la página."},{t:"list",items:["Reflejado: el dato vuelve en la misma respuesta (un buscador, un mensaje de error).","Almacenado: el dato queda guardado y puede afectar a muchas personas hasta que se corrige o elimina.","DOM: el JavaScript de la página coloca datos en una zona que interpreta HTML (por ejemplo, innerHTML).","Primera defensa: usa APIs que tratan los datos como texto y el escape automático del framework.","Si necesitas HTML enriquecido, usa un sanitizador mantenido; valida el formato, pero no lo confundas con escape de salida.","CSP y cookies HttpOnly limitan ciertos impactos: son capas adicionales, no reemplazan la prevención."]},{t:"warn",text:"HttpOnly impide que JavaScript lea el valor de la cookie, pero no detiene el XSS ni todas las acciones hechas desde una sesión comprometida."},{t:"source",title:"OWASP · Cross Site Scripting Prevention Cheat Sheet",url:"https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.md",text:"Guía técnica para escoger una defensa según el contexto de salida y evitar APIs DOM inseguras.",revisado:"2026-11-06"},{t:"result",text:"Deberías distinguir entre mostrar un dato como texto, insertarlo como HTML y usar una defensa secundaria como CSP."}],ejemplos:[{juego:"minecraft",titulo:"El libro firmado",texto:"Si alguien puede escribir en tu libro y tú copias el texto sin mirar, acabas firmando lo que esa persona escribió. Pintar HTML ajeno es firmar su código."},{juego:"panama",titulo:"El letrero del vecino",texto:"Prestas tu pared para un anuncio y alguien escribe una dirección falsa. XSS es eso: tu web mostrando el mensaje de otro."}],practica:[{tipo:"escribir",pregunta:"¿Qué propiedad de JavaScript evita ejecutar HTML cuando quieres mostrar texto del usuario?",respuestas:["textcontent","textContent","innertext","innerText"],pista:"Hay una que inserta HTML (innerHTML) y otra que solo escribe texto.",explicacion:"textContent escribe texto plano y nunca lo interpreta. innerHTML parsea HTML: si el dato viene del usuario, es la puerta de entrada del XSS."}],reto:{pregunta:"Un buscador muestra «No hay resultados para: <b>lo que escribiste</b>» sin escaparlo. ¿Qué riesgo hay?",opciones:["Ninguno, es solo texto","XSS reflejado: puedo meter una etiqueta que ejecute código en mi propia respuesta y enviar el enlace a otros","Que la página se vea en negrita","Que el buscador sea más lento"],respuesta:1,explicacion:"El dato vuelve en la respuesta y el navegador lo interpreta. Aunque el ataque lo dispares tú, el enlace se comparte y la víctima ejecuta el código dentro del dominio real."}},{id:"sqli",nivel:3,titulo:"La consulta que miente",subtitulo:"SQLi: cuando el dato se vuelve instrucción.",minutos:10,icono:"snake",objetivos:["Ver cómo un dato se convierte en código SQL.","Entender por qué las consultas parametrizadas lo cortan.","Aplicar permisos mínimos a la base de datos."],teoria:[{t:"why",text:"Si tu web arma la consulta pegando texto, el usuario puede cerrar la comilla y escribir SQL. Eso puede devolver toda la tabla, saltarse el login o borrar datos."},{t:"p",text:"La consulta clásica es `SELECT * FROM usuarios WHERE usuario = '<dato>'`. Si el dato es `' OR 1=1 --`, la consulta se convierte en «tráeme todos los usuarios» y el resto se comenta."},{t:"list",items:["La defensa real: consultas parametrizadas (el dato nunca se concatena).","Validar formato y longitud también ayuda, pero no sustituye a parametrizar.","Los parámetros protegen valores; nombres de tablas o columnas deben salir de opciones fijas controladas por la app.","La cuenta de la base de datos recibe solo los permisos que necesita.","No muestres errores internos de SQL al usuario; registra el detalle de forma segura."]},{t:"source",title:"OWASP · SQL Injection Prevention Cheat Sheet",url:"https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.md",text:"Referencia sobre consultas parametrizadas, elección segura de partes dinámicas y principio de menor privilegio.",revisado:"2026-11-06"},{t:"term",title:"la consulta, paso a paso",text:`SELECT * FROM usuarios
WHERE usuario = '<lo que escribe el usuario>'

si el usuario escribe:  ' OR 1=1 --

la consulta queda:
SELECT * FROM usuarios WHERE usuario = '' OR 1=1 --'
                                        ^ siempre verdadero`},{t:"result",text:"Deberías poder explicar por qué `' OR 1=1 --` funciona y cómo lo detiene un parámetro."}],ejemplos:[{juego:"minecraft",titulo:"El comando del chat",texto:"Si escribes `/give @p diamante` en el chat y el servidor lo ejecuta sin distinguir jugador de comando, acabas dando objetos con una frase. SQLi es esa confusión."},{juego:"panama",titulo:"La fila del banco",texto:"«Quiero hablar con el cajero» y alguien grita «¡todos!». Si el sistema obedece la palabra «todos», no está comprobando a quién te referías."}],practica:[{tipo:"escribir",pregunta:"¿Qué técnica impide que un dato se convierta en SQL?",respuestas:["parametrizadas","consultas parametrizadas","parametrizada","prepared statements","consultas preparadas"],pista:"El dato viaja aparte de la instrucción.",explicacion:"En una consulta parametrizada el motor recibe la instrucción y los valores por separado: aunque el valor tenga comillas o guiones, se trata como texto, nunca como código."}],reto:{pregunta:"¿Por qué `' OR 1=1 --` permite entrar sin contraseña en un login mal hecho?",opciones:["Porque adivina la contraseña","Porque cierra la comilla del dato, añade una condición siempre verdadera y comenta el resto de la consulta","Porque reinicia la base de datos","Porque desactiva el firewall"],respuesta:1,explicacion:"La comilla cierra el valor, `OR 1=1` hace que la condición sea cierta para todas las filas y `--` comenta lo que quedaba (la comprobación de contraseña)."}},{id:"sesiones",nivel:4,titulo:"Quién eres en cada petición",subtitulo:"Cookies, JWT, CSRF e IDOR.",minutos:9,icono:"chest",objetivos:["Entender cómo una web recuerda que iniciaste sesión.","Configurar cookies y tokens sin regalar la sesión.","Reconocer IDOR y CSRF."],teoria:[{t:"why",text:"HTTP no recuerda nada. Ese «recuerdo» es una cookie o un token, y si se filtra, el atacante es tú para el servidor."},{t:"p",text:"Al iniciar sesión el servidor crea una sesión y te da un identificador. En cada petición lo devuelves. Si alguien lo copia, entra sin contraseña."},{t:"list",items:["Cookie de sesión: HttpOnly (que el JS no la lea), Secure (solo por HTTPS) y SameSite=Lax o Strict.","Un identificador de sesión equivale temporalmente a la credencial: evita filtrarlo y revócalo al cerrar sesión.","JWT: el contenido normalmente se puede leer; la firma permite detectar cambios, no ocultar secretos.","IDOR: cambiar /factura/1024 por /factura/1025 y ver la de otro. El servidor debe autorizar cada objeto en cada petición.","CSRF: otra web intenta enviar una petición en tu nombre. SameSite ayuda; las acciones sensibles también requieren defensas anti-CSRF."]},{t:"tip",text:"Cierra sesión en equipos ajenos y revisa los dispositivos conectados de tu correo. El cierre debe invalidar la sesión del lado del servidor."},{t:"source",title:"OWASP · Session Management Cheat Sheet",url:"https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/Session_Management_Cheat_Sheet.md",text:"Profundiza en identificadores de sesión, su ciclo de vida y la revocación al cerrar sesión.",revisado:"2026-11-06"},{t:"result",text:"Deberías explicar cómo se protege y revoca una sesión y por qué cada petición necesita autorización."}],ejemplos:[{juego:"minecraft",titulo:"La llave del cofre",texto:"Entrar con sesión iniciada es llevar la llave puesta. Si alguien la copia, no necesita saber tu contraseña: abre igual."},{juego:"panama",titulo:"El recibo con tu nombre",texto:"IDOR es pedir el recibo número 1025 y que te lo den aunque no sea tuyo. El mostrador debe comprobar el nombre, no solo el número."}],practica:[{tipo:"orden",titulo:"Ordena cómo se protege una sesión",pasos:["Cookie con HttpOnly, Secure y SameSite","Expiración corta y renovación por uso","Comprobar el dueño del recurso en cada petición (anti-IDOR)","Token anti-CSRF en formularios sensibles","Cerrar sesión de verdad en el servidor"]}],reto:{pregunta:"Cambias /factura/1024 por /factura/1025 y ve
