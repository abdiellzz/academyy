(A=0, B=1 ... Z=25; mod 26 = dar la vuelta al alfabeto)`},{t:"p",text:"El problema: solo hay 26 claves posibles. Probarlas todas (fuerza bruta) tarda microsegundos. Un AES de 256 bits tiene unas 1,15 × 10⁷⁷ claves: más que átomos en la Tierra."},{t:"steps",items:[{t:"Cifra tu nombre",d:"Usa el simulador con desplazamiento 3."},{t:"Pásale el texto a alguien",d:"Sin decirle la clave."},{t:"Que lo rompa",d:"Que pruebe desplazamientos con el deslizador hasta que salga algo legible. ¡Lo logrará rapidito!"}]},{t:"result",text:"«HOLA» con clave 3 da «KROD». Con la rueda puedes ver la tabla completa de equivalencias."}],ejemplos:[{juego:"panama",titulo:"El código del salón",texto:"Escribir «Ipmb» en vez de «Hola» (cada letra la siguiente) es un César con clave 1. La maestra lo descifraba en segundos porque solo hay 26 posibilidades."},{juego:"minecraft",titulo:"Lámparas en clave",texto:"Imagina que en tu servidor escribes en carteles con César para que los nuevos no encuentren tu base. Cualquier jugador con paciencia prueba 25 claves y lee tus carteles. Ofuscar no es proteger."}],practica:[{tipo:"cesar"},{tipo:"escribir",pregunta:"Descifra este mensaje con clave 3: «FDQDO»",respuestas:["canal"],pista:"Retrocede 3 letras: F→C, D→A…",explicacion:"F-3=C, D-3=A, Q-3=N, D-3=A, O-3=L → CANAL."}],reto:{pregunta:"¿Por qué César no sirve para proteger nada hoy?",opciones:["Porque es muy lento","Porque solo tiene 26 claves y se prueba todo al instante","Porque solo funciona en latín","Porque lo prohibieron"],respuesta:1,explicacion:"Un espacio de claves de 26 se agota por fuerza bruta en microsegundos. La seguridad moderna exige claves de 128 bits o más."}},{id:"hash",nivel:2,titulo:"Hashes: la huella digital",subtitulo:"Mismo texto, misma huella. Una letra distinta, huella irreconocible.",minutos:9,icono:"diamond",objetivos:["Explicar qué es una función hash.","Ver el efecto avalancha.","Saber por qué las contraseñas no se guardan con un hash rápido."],teoria:[{t:"why",text:"Los hashes verifican tus descargas, guardan contraseñas y encadenan los bloques de las blockchains. Son la forma más barata de decir «esto no ha cambiado»."},{t:"p",text:"Una función hash toma cualquier dato (una palabra o una película entera) y devuelve una huella de tamaño fijo. SHA-256 siempre da 64 caracteres hexadecimales."},{t:"list",items:["Determinista: mismo dato, misma huella, siempre.","Unidireccional: de la huella no se puede volver al dato.","Efecto avalancha: cambia una letra y cambia ~la mitad de la huella.","Resistente a colisiones: casi imposible encontrar dos datos con la misma huella."]},{t:"warn",text:"Un hash no es cifrado: no tiene clave ni se «descifra». Pero un atacante sí puede probar millones de palabras comunes y comparar huellas (ataque de diccionario). Para contraseñas se usan funciones LENTAS con sal: Argon2id o bcrypt."},{t:"result",text:"En el simulador, «factionvault» y «Factionvault» dan huellas totalmente distintas. Fíjate en el porcentaje de diferencia: anda por el 90% de caracteres."}],ejemplos:[{juego:"minecraft",titulo:"La semilla del mundo",texto:"La misma semilla genera siempre el mismo mundo, pero cambia un solo número y aparece otro mundo totalmente distinto. Un hash funciona igual con los datos."},{juego:"fortnite",titulo:"La actualización oficial",texto:"Cuando Epic publica un parche, tu cliente compara el hash del archivo descargado con el oficial. Si alguien metió algo raro por el camino, la huella no cuadra y el juego no lo instala."}],practica:[{tipo:"hash"}],reto:{pregunta:"Se filtra una base de datos con contraseñas en SHA-256 sin sal. ¿Cuáles caen primero?",opciones:["Las largas y aleatorias","Las comunes como «panama123»","Ninguna, SHA-256 no se puede atacar","Todas al mismo tiempo"],respuesta:1,explicacion:"El atacante calcula el hash de millones de contraseñas comunes y compara. Las populares aparecen al instante; las largas y aleatorias no están en ningún diccionario."}},{id:"passwords",nivel:3,titulo:"Contraseñas que aguantan",subtitulo:"Por qué «P@ssw0rd!» es mala y una frase larga es buena.",minutos:8,icono:"key",objetivos:["Medir la entropía de una contraseña.","Crear frases de paso fuertes.","Activar la verificación en dos pasos."],teoria:[{t:"why",text:"El eslabón más débil de casi todos los sistemas eres tú escogiendo contraseña. Cinco minutos aquí valen más que cualquier antivirus."},{t:"p",text:"La fuerza de una contraseña se mide en bits de entropía: cuántas posibilidades tendría que probar un atacante. Cada bit extra duplica el trabajo. Una tarjeta gráfica moderna prueba unos 10.000 millones de contraseñas por segundo."},{t:"table",head:["Contraseña","Problema"],rows:[["123456","La nº1 de todas las filtraciones"],["P@ssw0rd!","Los diccionarios ya incluyen esos cambios"],["Panama2026","Palabra + año: lo primero que se prueba"],["taza-montaña-río-bosque-42","Larga y aleatoria: ¡buena!"]]},{t:"steps",items:[{t:"Usa frases",d:"4 o 5 palabras al azar unidas por guiones + un número."},{t:"Una por sitio",d:"Si se filtra una, no caen las demás. Usa un gestor de contraseñas."},{t:"Activa 2FA",d:"Verificación en dos pasos con app (no SMS si puedes). Aunque roben la contraseña, no entran."}]},{t:"tip",text:"Nadie legítimo te va a pedir tu contraseña ni tu código de verificación por WhatsApp. Ni tu banco, ni Epic, ni Mojang, ni «el primo que trabaja en la compañía»."}],ejemplos:[{juego:"fortnite",titulo:"La cuenta con skins raras",texto:"Una cuenta con skins de la temporada 1 vale real, y los ladrones lo saben. Si tu contraseña es «fortnite123», un programa la saca en segundos. Frase larga + 2FA = cuenta blindada."},{juego:"panama",titulo:"«Mami, cambié de número»",texto:"La estafa clásica: un número desconocido te escribe «soy yo, cambié de número, pásame el código que te llegó». Ese código es tu verificación de WhatsApp. Lo das y pierdes la cuenta."}],practica:[{tipo:"password"}],reto:{pregunta:"¿Cuál de estas contraseñas aguanta más?",opciones:["P@ssw0rd!","qwerty12345","Faction2026","taza-montaña-río-bosque-42"],respuesta:3,explicacion:"La longitud y la aleatoriedad mandan. Los cambios tipo @ por a ya están en todos los diccionarios de ataque."}},{id:"aes",nivel:4,titulo:"AES: cifrado de verdad",subtitulo:"El candado que usa medio planeta, funcionando aquí mismo.",minutos:10,icono:"chest",objetivos:["Entender el cifrado simétrico.","Cifrar y descifrar con AES-GCM real.","Saber qué son la sal, el IV y la etiqueta."],teoria:[{t:"why",text:"AES protege tu disco, tus backups, tu Wi-Fi (WPA2/3) y casi todo el tráfico de internet. Es el estándar mundial desde 2001 y nadie ha logrado romperlo."},{t:"p",text:"AES es simétrico: la misma clave cifra y descifra. Es rapidísimo. Su modo moderno, GCM, además pone un «sello» (etiqueta) que detecta cualquier modificación."},{t:"list",items:["Clave: se deriva de tu contraseña con PBKDF2 (miles de repeticiones para hacerlo lento al atacante).","Sal: datos aleatorios para que dos contraseñas iguales no den la misma clave. No es secreta.","IV (vector inicial): número único por mensaje. Cifrar dos veces lo mismo da resultados distintos.","Etiqueta: el sello. Si cambias un solo carácter del cifrado, el descifrado falla."]},{t:"warn",text:"La regla de oro de GCM: nunca reutilizar el mismo IV con la misma clave. Y nunca inventes tu propio cifrado: usa librerías probadas."},{t:"result",text:"En el simulador, cifra un mensaje dos veces: saldrán dos textos distintos (por la sal y el IV aleatorios). Altera una letra del cifrado y descifra: verás el error de autenticación."}],ejemplos:[{juego:"panama",titulo:"El sobre sellado del notario",texto:"El notario mete tu documento en un sobre (cifrado) y le pone sello de lacre (etiqueta GCM). Si alguien abre el sobre o rompe el sello, se nota al instante."},{juego:"minecraft",titulo:"El cofre de Ender",texto:"El cofre de Ender es tuyo en cualquier parte del mundo y nadie más puede abrirlo. AES con tu clave es parecido: el mismo «cofre» de datos, solo accesible para quien tiene la clave."}],practica:[{tipo:"aes"}],reto:{pregunta:"Cambias un carácter de un mensaje cifrado con AES-GCM e intentas descifrarlo. ¿Qué pasa?",opciones:["Sale el mensaje con una letra cambiada","Falla: la etiqueta detecta la manipulación","Sale el mensaje normal","Se borra la contraseña"],respuesta:1,explicacion:"GCM autentica los datos. Cualquier cambio rompe la etiqueta y el descifrado se rechaza sin mostrar nada."}},{id:"clave-publica",nivel:5,titulo:"Clave pública y el candado HTTPS",subtitulo:"Cómo dos desconocidos crean un secreto a la vista de todos.",minutos:11,icono:"globe",objetivos:["Diferenciar clave pública y privada.","Simular un intercambio Diffie-Hellman.","Entender qué te protege el candado del navegador."],teoria:[{t:"why",text:"Sin clave pública no existirían las compras online ni la mensajería segura. Es lo que permite hablar con un servidor que nunca has visto y acabar con un secreto compartido."},{t:"p",text:"En criptografía asimétrica cada uno tiene dos claves: una pública (la reparte a todo el mundo) y una privada (nunca sale de su equipo). Lo cifrado con la pública solo se abre con la privada."},{t:"p",text:"Diffie-Hellman permite que dos personas acuerden un número secreto enviándose solo números públicos. Un espía ve todo el intercambio y aun así no puede calcular el secreto."},{t:"steps",items:[{t:"Lo público",d:"Ana y Beto acuerdan p=23 y g=5. Todo el mundo los ve."},{t:"Lo secreto",d:"Ana elige a=6, Beto elige b=15. No se lo dicen a nadie."},{t:"El intercambio",d:"Ana envía 5⁶ mod 23 = 8. Beto envía 5¹⁵ mod 23 = 19."},{t:"La magia",d:"Ana calcula 19⁶ mod 23 = 2. Beto calcula 8¹⁵ mod 23 = 2. ¡Mismo secreto sin enviarlo nunca!"}]},{t:"p",text:"HTTPS (TLS) usa esto: tu navegador y el servidor acuerdan claves con Diffie-Hellman, el servidor demuestra quién es con un certificado firmado, y luego todo viaja cifrado con AES."},{t:"warn",text:"El candado NO significa que la página sea honesta: solo que la conexión está cifrada. Una web de phishing también puede tener candado. Revisa siempre el dominio exacto."}],ejemplos:[{juego:"panama",titulo:"El buzón de Correos",texto:"Cualquiera puede echar una carta por la ranura de tu buzón (clave pública), pero solo tú tienes la llave para abrirlo (clave privada)."},{juego:"fortnite",titulo:"Entrar al lobby",texto:"Cuando inicias sesión en Epic, tu PC y sus servidores hacen un saludo TLS en milisegundos. Por eso alguien en el mismo Wi-Fi del café no puede ver tu contraseña aunque capture todo el tráfico."}],practica:[{tipo:"dh"}],reto:{pregunta:"Ves el candado 🔒 en una web que imita a tu banco. ¿Qué garantiza?",opciones:["Que es tu banco de verdad","Solo que la conexión va cifrada; el dominio puede ser falso","Que no hay virus","Que el precio es justo"],respuesta:1,explicacion:"El candado indica cifrado, no honestidad. Los estafadores consiguen certificados gratis. La defensa es revisar el dominio letra por letra."}}]},{id:"social",nombre:"Mundo Ingeniería Social",bioma:"Bioma Aldea",tagline:"Hackear personas es más fácil que hackear computadoras.",descripcion:"Phishing, estafas por WhatsApp, pretexting, contraseñas robadas y cómo no caer. El mundo más práctico de todos.",color:"#ff5a6a",fondo:"#2a0d14",icono:"heart",intro:"La mayoría de los ataques reales no empiezan con código: empiezan con un mensaje bien escrito. Aquí aprendes a reconocerlos antes de que te reconozcan a ti.",niveles:[{id:"que-es",nivel:0,titulo:"¿Qué es la ingeniería social?",subtitulo:"Nivel 0: cuando el objetivo eres tú, no tu computadora.",minutos:7,icono:"heart",objetivos:["Definir ingeniería social.","Reconocer los 4 gatillos emocionales.","Entender por qué funciona con gente lista."],teoria:[{t:"why",text:"Más del 70% de los incidentes empiezan con un engaño a una persona. Puedes tener el mejor antivirus del mundo y perderlo todo por responder un mensaje."},{t:"p",text:"Ingeniería social es manipular a una persona para que haga algo que no debería: dar una contraseña, abrir un archivo, transferir plata o dejar pasar a alguien. No ataca la tecnología, ataca la confianza."},{t:"table",head:["Gatillo","Cómo suena","Qué busca"],rows:[["Urgencia","«Tu cuenta se bloquea en 1 hora»","Que no pienses"],["Miedo","«Detectamos un cargo de $500»","Que actúes asustado"],["Codicia","«Ganaste un iPhone / V-Bucks gratis»","Que bajes la guardia"],["Autoridad o cariño","«Soy del banco» / «Mami, soy yo»","Que obedezcas sin verificar"]]},{t:"p",text:"No funciona porque la gente sea tonta: funciona porque somos humanos. El estafador prueba con miles de personas y solo necesita que una pique. Como dicen: no te eligen a ti, eligen al que se deja."},{t:"tip",text:"La regla de oro: si un mensaje te mete prisa y te pide algo (dinero, código, contraseña, clic), detente y verifica por OTRO canal: llama tú al número oficial, pregúntale en persona a tu familiar."}],ejemplos:[{juego:"panama",titulo:"«Mami, cambié de número»",texto:"Llega un mensaje de un número nuevo: «Hola mami, se me dañó el celular, este es mi número nuevo. Necesito que me hagas un Yappy urgente, luego te explico». Urgencia + cariño. La defensa: llamar al número viejo o hacer una pregunta que solo tu hijo sabría."},{juego:"fortnite",titulo:"El regalo de V-Bucks",texto:"Un desconocido en Discord: «Soy moderador de Epic, ganaste 13.500 V-Bucks, solo entra aquí con tu cuenta». Codicia + falsa autoridad. Epic jamás regala V-Bucks por Discord."}],practica:[{tipo:"widget",w:"match",props:{title:"Une cada frase con su gatillo",pairs:[["«Tu cuenta se bloquea hoy»","Urgencia"],["«Cargo sospechoso de $500»","Miedo"],["«Ganaste un premio del Super 99»","Codicia"],["«Soy el gerente, hazlo ya»","Autoridad"]]}}],reto:{pregunta:"Tu «primo» te escribe desde un número nuevo pidiendo $50 urgentes por Yappy. ¿Qué haces primero?",opciones:["Le mando la plata, es familia","Lo llamo al número de siempre o le pregunto algo que solo él sabría","Le pido el número de cuenta","Le reenvío el mensaje a todos"],respuesta:1,explicacion:"Verificar por otro canal rompe el engaño. Si es tu primo de verdad, no le molestará la llamada."}},{id:"phishing",nivel:1,titulo:"Phishing: el anzuelo",subtitulo:"Correos, SMS y mensajes que parecen reales.",minutos:10,icono:"flag",objetivos:["Leer un enlace y encontrar el dominio real.","Detectar las señales de un mensaje falso.","Saber qué hacer si ya hiciste clic."],teoria:[{t:"why",text:"El phishing es la puerta de entrada número uno de los atacantes. Aprender a leer un enlace te salva más veces que cualquier herramienta."},{t:"p",text:"Phishing viene de «fishing» (pescar): el atacante lanza un anzuelo (un mensaje falso) y espera que alguien muerda (haga clic y ponga sus datos). Si es por SMS se llama smishing; por llamada, vishing."},{t:"h",text:"Cómo leer un enlace"},{t:"p",text:"En una dirección web, lo que importa es el dominio: la parte justo antes de la primera barra «/», leyendo de derecha a izquierda desde el final (.com, .pa…)."},{t:"table",head:["Enlace","Dominio real","¿Seguro?"],rows:[["https://www.banco.com.pa/login","banco.com.pa","Sí (si es el oficial)"],["https://banco.com.pa.verificar-cuenta.net/","verificar-cuenta.net","NO"],["https://bänco.com.pa","otro dominio con «ä»","NO"],["https://epicgames.com-promo.xyz","com-promo.xyz","NO"]]},{t:"list",items:["Remitente raro o que no coincide con la empresa.","Saludo genérico: «Estimado cliente».","Urgencia o amenaza.","Faltas de ortografía o traducción extraña.","Enlaces acortados o con dominios raros.","Te piden datos que la empresa ya tiene o jamás pediría."]},{t:"steps",items:[{t:"Si ya hiciste clic pero no pusiste nada",d:"Cierra la página. Por lo general no pasa nada."},{t:"Si pusiste tu contraseña",d:"Cámbiala YA desde la app o web oficial, y en cualquier sitio donde la repitas."},{t:"Si diste datos bancarios",d:"Llama al número oficial del banco (el de atrás de tu tarjeta) y bloquea."},{t:"Activa 2FA",d:"Y avisa a tus contactos si te robaron una cuenta de mensajería."}]}],ejemplos:[{juego:"panama",titulo:"El paquete retenido",texto:"«Correos de Panamá: su paquete está retenido, pague $1.99 de aduana aquí: bit.ly/…». Casi nadie espera un paquete y aun así pica porque son solo $1.99. Lo que roban es la tarjeta completa."},{juego:"minecraft",titulo:"El servidor con regalo",texto:"«Entra a minecraft-free-skins.net e inicia sesión con tu cuenta Microsoft para reclamar tu capa exclusiva». La capa no existe; el login falso se queda con tu cuenta."}],practica:[{tipo:"phishing",cantidad:5}],reto:{pregunta:"¿Cuál es el dominio real de https://login.banco.com.pa.seguridad-web.com/acceso?",opciones:["banco.com.pa","login.banco.com.pa","seguridad-web.com","acceso"],respuesta:2,explicacion:"Se lee desde el final hacia la izquierda antes de la primera «/»: seguridad-web.com. Todo lo de la izquierda son subdominios que el atacante inventa."}},{id:"pretexting",nivel:2,titulo:"Pretexting, vishing y el falso técnico",subtitulo:"Cuando te llaman con una historia bien armada.",minutos:8,icono:"monitor",objetivos:["Reconocer un pretexto.","Aplicar el protocolo de verificación.","Proteger los códigos de un solo uso."],teoria:[{t:"why",text:"Las estafas por llamada (vishing) son de las más efectivas porque una voz segura y amable genera mucha confianza. Muchas empresas han perdido millones por una sola llamada."},{t:"p",text:"Pretexting es inventar un escenario creíble (un pretexto) para pedirte algo: «Soy del soporte técnico, detectamos un virus en tu PC, instala esta app para que te ayude». La app les da control total de tu computadora."},{t:"steps",items:[{t:"Escucha la petición",d:"¿Te piden un código, una contraseña, instalar algo o transferir?"},{t:"Cuelga con educación",d:"«Gracias, yo llamo directamente al número oficial»."},{t:"Verifica por tu cuenta",d:"Busca el número oficial tú mismo (web oficial, tarjeta, factura). Nunca uses el que te dieron."},{t:"Reporta",d:"Avisa a la empresa real y, si te afectó, a la policía."}]},{t:"warn",text:"Un código de verificación (SMS o app) es como la llave de tu casa: el banco, WhatsApp o Epic NUNCA te lo van a pedir. Quien te lo pide, te está robando."}],ejemplos:[{juego:"panama",titulo:"«Llamamos de la compañía de luz»",texto:"«Su servicio se corta hoy por falta de pago, pero si paga ahora por esta línea con su tarjeta se lo dejamos activo». Urgencia + autoridad. La compañía real no te corta por teléfono con 10 minutos de aviso."},{juego:"fortnite",titulo:"El «moderador» por voz",texto:"En un chat de voz alguien se hace pasar por staff: «Para verificar que eres el dueño, léeme el código que te acaba de llegar». Ese código era para entrar a tu cuenta desde otro equipo."}],practica:[{tipo:"orden",titulo:"Ordena el protocolo ante una llamada sospechosa",pasos:["Escuchar sin dar ningún dato","Notar la petición (código, pago, instalar app)","Colgar con educación","Buscar el número oficial por tu cuenta","Llamar tú y confirmar","Reportar el intento"]}],reto:{pregunta:"Te llaman «del banco» y te piden el código que te acaba de llegar por SMS «para cancelar un cargo». ¿Qué es?",opciones:["Un trámite normal","Una estafa: el banco nunca pide códigos","Una encuesta","Un error del sistema"],respuesta:1,explicacion:"El código sirve para autorizar algo en tu cuenta. Si lo das, el estafador completa la operación. Cuelga y llama al número oficial."}},{id:"defensa",nivel:3,titulo:"Tu escudo personal",subtitulo:"Checklist para ti y para tu familia.",minutos:8,icono:"sword",objetivos:["Armar tu checklist de higiene digital.","Configurar 2FA y recuperación.","Enseñarle a tu familia lo básico."],teoria:[{t:"why",text:"Saber esto te convierte en la persona que protege a su mamá, a su abuelo y a sus panas. La seguridad también es comunidad."},{t:"list",items:["Contraseñas únicas con gestor y frases largas.","2FA activado en correo, banco, WhatsApp, Epic, Microsoft y Discord.","PIN de verificación en dos pasos de WhatsApp (Ajustes → Cuenta).","Actualizaciones automáticas en celular y PC.","Copias de seguridad de lo importante.","Nunca compartir códigos de verificación con nadie.","Desconfiar de lo urgente, lo gratis y lo demasiado bueno."]},{t:"p",text:"El correo es la llave maestra: con él se recuperan todas tus otras cuentas. Protégelo primero, con la contraseña más fuerte y 2FA."},{t:"tip",text:"Acuerda con tu familia una «palabra clave» secreta. Si alguien pide plata urgente diciendo ser familia, pregunten la palabra. Las estafas de voz clonada con IA ya existen."},{t:"result",text:"Al final de este nivel deberías tener 2FA en al menos tu correo y tu WhatsApp. ¡Hazlo ahora, toma 3 minutos!"}],ejemplos:[{juego:"minecraft",titulo:"Iluminar la base",texto:"En Minecraft llenas tu base de antorchas para que no aparezcan monstruos. Las buenas costumbres digitales son tus antorchas: no evitan todo, pero hacen muchísimo más difícil que algo malo aparezca."},{juego:"panama",titulo:"La palabra clave de la familia",texto:"Igual que algunas familias tienen una frase para cuando alguien desconocido va a recoger a los niños al colegio, tengan una palabra clave para pedidos de plata por mensaje."}],practica:[{tipo:"orden",titulo:"Ordena por prioridad qué proteger primero",pasos:["Correo principal (llave maestra)","Banca y billeteras (Yappy, banco)","WhatsApp (PIN de dos pasos)","Cuentas de juego y redes sociales","Resto de cuentas"]}],reto:{pregunta:"¿Por qué el correo es la cuenta más importante de proteger?",opciones:["Porque tiene fotos","Porque con él se recuperan casi todas tus demás cuentas","Porque es gratis","No es importante"],respuesta:1,explicacion:"Quien controla tu correo puede pedir «olvidé mi contraseña» en todos tus servicios. Es la llave maestra."}}]}],retos:[{id:"seg-dominio",titulo:"El dominio impostor",categoria:"Seguridad",dificultad:"Fácil",puntos:100,enunciado:"Te llega este enlace: https://banco.com.pa-verificacion.seguro.xyz/login. ¿Cuál es el dominio real de esa dirección?",pista:"El dominio es lo que está justo antes del primer punto leyendo desde la derecha.",aceptadas:["seguro.xyz","seguro"],solucion:"seguro.xyz",explicacion:"Se lee de derecha a izquierda: xyz es la terminación, seguro es el nombre y todo lo anterior es un subdominio inventado para que te confíes.",tipo:"texto",mundo:"seguridad"},{id:"seg-2fa",titulo:"El código que no pediste",categoria:"Seguridad",dificultad:"Fácil",puntos:100,enunciado:"Alguien te escribe: «me llegó un código de verificación a tu número por error, ¿me lo pasas?». ¿Qué está pasando?",pista:"Nadie legítimo necesita tu código.",aceptadas:["c"],solucion:"c",explicacion:"Está intentando entrar a tu cuenta y necesita el segundo factor. Si pasas el código, le abres la puerta: cambia la contraseña y activa 2FA con una app autenticadora.",tipo:"opciones",opciones:["Es un amigo que se equivocó de número","Es spam sin importancia","Es un intento de entrar a mi cuenta y necesita mi segundo factor","Es el banco verificando mi identidad"],mundo:"seguridad"},{id:"seg-321",titulo:"La regla 3-2-1",categoria:"Seguridad",dificultad:"Media",puntos:150,enunciado:"En la regla de respaldos 3-2-1, ¿qué significa exactamente?",pista:"Copias, medios y dónde vive la última.",aceptadas:["b"],solucion:"b",explicacion:"3 copias, en 2 medios distintos, con 1 fuera de tu casa o de tu red. Y siempre probar que se pueden restaurar.",tipo:"opciones",opciones:["3 contraseñas, 2 correos y 1 teléfono","3 copias, 2 medios y 1 copia fuera de tu casa","3 antivirus, 2 firewalls y 1 VPN","3 días, 2 semanas y 1 mes de historial"],mundo:"seguridad"},{id:"seg-ransom",titulo:"El secuestro de archivos",categoria:"Seguridad",dificultad:"Fácil",puntos:100,enunciado:"Un programa cifra todas tus fotos y muestra una nota pidiendo dinero por la llave. ¿Cómo se llama ese malware?",pista:"Viene de «ransom»: rescate.",aceptadas:["ransomware"],solucion:"RANSOMWARE",explicacion:"Ransomware. La defensa real son respaldos probados y desconectados; pagar solo financia el siguiente ataque.",tipo:"texto",mundo:"seguridad"},{id:"seg-parche",titulo:"La actualización pendiente",categoria:"Seguridad",dificultad:"Media",puntos:150,enunciado:"Tu sistema lleva meses pidiendo reiniciar por actualizaciones. ¿Por qué actualizar es la defensa número uno?",pista:"Los fallos que se arreglan ya son públicos.",aceptadas:["a"],solucion:"a",explicacion:"El parche cierra fallos que ya se conocen y que los ataques ya saben usar. Sin el parche, entran sin que hagas nada malo.",tipo:"opciones",opciones:["Porque cierra fallos que ya son públicos y ya se están explotando","Porque hace que la computadora sea más rápida","Porque cambia el fondo de pantalla","Porque el antivirus deja de funcionar si no actualizas"],mundo:"seguridad"},{id:"cesar",titulo:"El mensaje del emperador",categoria:"Cifrados clásicos",dificultad:"Fácil",puntos:100,enunciado:"Interceptamos un mensaje cifrado con César y sabemos que el desplazamiento es 3. Recupera el texto original en mayúsculas.",pista:"Retrocede tres posiciones en el alfabeto. K → H, R → O…",aceptadas:["hola mundo"],solucion:"HOLA MUNDO",explicacion:"Aplicando D(y) = (y − 3) mod 26 a cada letra: K→H, R→O, O→L, D→A, P→M, X→U, Q→N, G→D, R→O. Resultado: HOLA MUNDO.",tipo:"texto",mundo:"cripto",cifrado:"KROD PXQGR"},{id:"atbash",titulo:"El espejo del alfabeto",categoria:"Cifrados clásicos",dificultad:"Fácil",puntos:100,enunciado:"Este mensaje usa Atbash: cada letra se sustituye por su opuesta (A↔Z, B↔Y, C↔X…). ¿Qué esconde?",pista:"M es la opuesta de N, L es la opuesta de O… La palabra resultante nombra los bloques del laboratorio.",aceptadas:["nodo"],solucion:"NODO",explicacion:"Atbash refleja el alfabeto: M→N, L→O, W→D, L→O. El mensaje es NODO. Fíjate en que cifrar y descifrar son la misma operación.",tipo:"texto",mundo:"cripto",cifrado:"MLWL"},{id:"morse",titulo:"Puntos y rayas",categoria:"Codificación",dificultad:"Fácil",puntos:100,enunciado:"Una señal de socorro interceptada por radio. Decodifica este mensaje en morse (las palabras se separan con /).",pista:"... es S, --- es O. La segunda palabra es el nombre de esta app sin «faction».",aceptadas:["sos vault","sosvault"],solucion:"SOS VAULT",explicacion:"... --- ... = SOS, y ...- .- ..- .-.. - = VAULT. El morse no es cifrado: es una codificación pública, cualquiera con la tabla lo lee.",tipo:"texto",mundo:"cripto",cifrado:"... --- ... / ...- .- ..- .-.. -"},{id:"vigenere",titulo:"La llave repetida",categoria:"Cifrados clásicos",dificultad:"Media",puntos:150,enunciado:"Este texto se cifró con Vigenère y la clave NODO. Descifra el mensaje secreto.",pista:"Resta cada letra de la clave (N=13, O=14, D=3, O=14, N=13) a su letra del cifrado, módulo 26.",aceptadas:["cifra"],solucion:"CIFRA",explicacion:"P−N = 15−13 = 2→C; W−O = 22−14 = 8→I; I−D = 8−3 = 5→F; F−O = 5−14 = −9→R; N−N = 0→A. El mensaje es CIFRA.",tipo:"texto",mundo:"cripto",cifrado:"PWIFN"},{id:"afin",titulo:"La doble llave",categoria:"Cifrados clásicos",dificultad:"Media",puntos:150,enunciado:"Cifrado afín con a=5 y b=8, fórmula E(x) = (5x + 8) mod 26. Recupera el mensaje original.",pista:"Descifra con D(y) = a⁻¹·(y − b) mod 26. El inverso de 5 módulo 26 es 21, porque 5×21 = 105 = 1 mod 26.",aceptadas:["hola"],solucion:"HOLA",explicacion:"Con a⁻¹=21: R(17)→21×(17−8)=189 mod 26=7→H; A(0)→21×(0−8)=−168 mod 26=14→O; L(11)→21×3=63 mod 26=11→L; I(8)→21×0=0→A. Resultado: HOLA.",tipo:"texto",mundo:"cripto",cifrado:"RALI"},{id:"rail",titulo:"La valla de rieles",categoria:"Cifrados clásicos",dificultad:"Media",puntos:150,enunciado:"Transposición por valla (rail fence) con 3 rieles. Las letras no cambiaron, solo se reordenaron. Reconstruye el mensaje.",pista:"Reparte las 12 letras en zigzag sobre 3 rieles (filas de 4, 6 y 2… no: calcula el patrón 0,1,2,1,0,1,2,1…), y lee en zigzag.",aceptadas:["criptografia"],solucion:"CRIPTOGRAFIA",explicacion:"El patrón de 3 rieles reparte las letras en filas de 3, 6 y 3: CTA | RPORFA | IGI. Leyendo en zigzag (0,1,2,1,0,1,2,1,0,1,2,1) se reconstruye CRIPTOGRAFIA.",tipo:"texto",mundo:"cripto",cifrado:"CTARPORFAIGI"},{id:"base64",titulo:"No todo lo raro es secreto",categoria:"Codificación",dificultad:"Fácil",puntos:100,enunciado:"Un compañero «cifró» su proyecto con esto. Decodifícalo y dime la palabra original.",pista:"Termina en ==: es Base64. Decodifica los bytes y léelos como texto.",aceptadas:["faction"],solucion:"FACTION",explicacion:"ZmFjdGlvbg== en Base64 decodifica a «faction». Recuerda: Base64 no tiene clave, cualquiera lo revierte. Es codificación, no cifrado.",tipo:"texto",mundo:"cripto",cifrado:"ZmFjdGlvbg=="},{id:"identifica-hash",titulo:"Firma en hexadecimal",categoria:"Integridad",dificultad:"Fácil",puntos:100,enunciado:"Encontramos esta huella en una base de datos. Su longitud es una gran pista. ¿Qué algoritmo la generó?",pista:"Cuenta los caracteres hexadecimales. Cada byte son dos caracteres. Compara con 32 (MD5), 40 (SHA-1), 64 (SHA-256) y 128 (SHA-512).",aceptadas:["sha-256","sha256","sha 256","sha-2"],solucion:"SHA-256",explicacion:"Tiene 64 caracteres hexadecimales = 256 bits = 32 bytes. Es SHA-256, concretamente el hash de la palabra «cifra».",tipo:"texto",mundo:"cripto",cifrado:"4b08d6579bf6895852080a8c8a86e820443deb5f9939e79428dbd7b869687c85"},{id:"frecuencia",titulo:"El delator silencioso",categoria:"Criptoanálisis",dificultad:"Media",puntos:150,enunciado:"Un texto largo en español, cifrado por sustitución simple, tiene como letra más repetida la «X» (casi 14% del texto). ¿Qué letra original esconde probablemente?",pista:"En español, ¿qué letra aparece cerca del 13-14% en cualquier texto largo? Piensa en la más común de todas.",aceptadas:["e","la e","letra e"],solucion:"E",explicacion:"La E ronda el 13,7% en español. En una sustitución simple las frecuencias se conservan, así que la letra más repetida del cifrado casi seguro es la E. Por eso estos cifrados caen con suficiente texto.",tipo:"texto",mundo:"cripto"},{id:"xor-reuse",titulo:"El keystream reutilizado",categoria:"Criptoanálisis",dificultad:"Media",puntos:150,enunciado:"Dos mensajes M1 y M2 se cifraron con la MISMA secuencia XOR: C1 = M1 ⊕ K y C2 = M2 ⊕ K. Un atacante calcula C1 ⊕ C2. ¿Qué obtiene?",pista:"Recuerda: K ⊕ K = 0 y X ⊕ 0 = X. Desarrolla (M1 ⊕ K) ⊕ (M2 ⊕ K).",aceptadas:["c"],solucion:"C",explicacion:"(M1⊕K)⊕(M2⊕K) = M1⊕M2⊕(K⊕K) = M1⊕M2. La clave desaparece y queda el XOR de los dos mensajes, que conociendo uno revela el otro. Por eso nunca se reutiliza un keystream ni un IV.",tipo:"opciones",mundo:"cripto",opciones:["La clave K directamente.","Ceros: la operación se cancela por completo.","El XOR de los dos mensajes (M1 ⊕ M2), sin rastro de la clave.","Un valor aleatorio sin ninguna información útil."]},{id:"diffie-hellman",titulo:"Dos claves, un secreto",categoria:"Clave pública",dificultad:"Difícil",puntos:200,enunciado:"Ana y Beto usan Diffie-Hellman con p = 23 y g = 5. Ana elige a = 6; Beto elige b = 15. Calcula el secreto compartido.",pista:"Primero calcula A = 5⁶ mod 23 y B = 5¹⁵ mod 23. Después eleva la clave pública del otro a tu secreto: S = A^b mod 23 = B^a mod 23.",aceptadas:["2","dos"],solucion:"2",explicacion:"A = 5⁶ mod 23 = 8. B = 5¹⁵ mod 23 = 19. El secreto es B⁶ mod 23 = 19⁶ mod 23 = 2, y también A¹⁵ mod 23 = 8¹⁵ mod 23 = 2. Los dos llegan al mismo número sin enviarlo nunca.",tipo:"texto",mundo:"cripto"},{id:"hmac-why",titulo:"El hash que no bastó",categoria:"Integridad",dificultad:"Media",puntos:150,enunciado:"Marta envía un mensaje con su SHA-256 para «garantizar integridad», pero el atacante controla la red y puede modificar ambos. ¿Qué debería usar en su lugar?",pista:"El problema es que el atacante puede recalcular el hash. ¿Qué mecanismo necesita un secreto que el atacante no tiene?",aceptadas:["b"],solucion:"B",explicacion:"Un HMAC añade una clave secreta al hash: sin la clave, el atacante no puede generar un MAC válido para su mensaje modificado. La firma digital también valdría si hay infraestructura de clave pública.",tipo:"opciones",mundo:"cripto",opciones:["SHA-512 en vez de SHA-256, porque es más largo.","Un HMAC con una clave compartida (o una firma digital).","Cifrar el hash con César para ocultarlo.","Enviar el hash por el mismo canal dos veces."]},{id:"password-best",titulo:"La contraseña que aguanta",categoria:"Seguridad práctica",dificultad:"Media",puntos:150,enunciado:"Un atacante con GPUs prueba 10.000 millones de contraseñas por segundo. ¿Cuál de estas aguanta más?",pista:"La entropía manda: longitud × variedad. Los trucos tipo «@ por a» los conocen todos los diccionarios con reglas.",aceptadas:["d"],solucion:"D",explicacion:"«taza-montaña-río-bosque-42» combina 5 elementos (~70 bits). «P@ssw0rd!» cae por diccionario con reglas, «qwerty12345» es top de filtraciones y «Faction2026» es predecible (palabra + año).",tipo:"opciones",mundo:"social",opciones:["P@ssw0rd!","qwerty12345","Faction2026","taza-montaña-río-bosque-42"]},{id:"mitm",titulo:"El error de siempre",categoria:"Seguridad práctica",dificultad:"Media",puntos:150,enunciado:"Un compañero propone guardar una contraseña con Base64 para que «no se pueda leer». ¿Cuál es la respuesta correcta?",pista:"La pregunta no es si parece ilegible, sino si hace falta una clave para revertirlo.",aceptadas:["b"],solucion:"B",explicacion:"Base64 es una codificación reversible sin clave. Cualquiera puede decodificarla. Para contraseñas se usa Argon2id (o bcrypt/scrypt) con sal, y para cifrar de verdad AES-GCM o ChaCha20-Poly1305.",tipo:"opciones",mundo:"social",opciones:["Es seguro porque el texto parece ilegible.","Base64 no cifra: es reversible sin clave. No protege la contraseña.","Es más fuerte que SHA-256 porque usa 64 símbolos.","Solo es inseguro si la contraseña tiene menos de 8 caracteres."]},{id:"subred",titulo:"¿Cuántos caben?",categoria:"Redes",dificultad:"Fácil",puntos:100,enunciado:"La red de las cámaras del colegio es 192.168.10.0/26. ¿Cuántos dispositivos (hosts útiles) caben?",pista:"Con /26 quedan 32 − 26 = 6 bits para hosts. 2⁶ = 64, menos 2 reservadas (red y broadcast).",aceptadas:["62"],solucion:"62",explicacion:"2⁶ = 64 direcciones − la de red − la de broadcast = 62 hosts útiles.",tipo:"texto",mundo:"redes"},{id:"puerto-mc",titulo:"El muelle del creeper",categoria:"Redes",dificultad:"Fácil",puntos:100,enunciado:"Tu amigo abrió un puerto en el router para su servidor de Minecraft Java. ¿Qué número de puerto es el predeterminado?",pista:"Es un número de 5 cifras que empieza por 255.",aceptadas:["25565"],solucion:"25565",explicacion:"Minecraft Java Edition usa por defecto el puerto TCP 25565.",tipo:"texto",mundo:"redes"},{id:"chmod-secreto",titulo:"La llave bajo el tapete",categoria:"Sistemas",dificultad:"Media",puntos:150,enunciado:"¿Qué permiso octal debe tener tu llave privada SSH para que SOLO tu usuario pueda leerla y escribirla?",pista:"Dueño rw- (4+2), grupo ---, otros ---.",aceptadas:["600","chmod 600"],solucion:"600",explicacion:"6 = rw- para el dueño, 0 para grupo y otros. SSH rechaza llaves con permisos más abiertos.",tipo:"texto",mundo:"sistemas"},{id:"py-out",titulo:"Predice la salida",categoria:"Python",dificultad:"Fácil",puntos:100,enunciado:"¿Qué imprime este código?  for i in range(3): print(i * 2)  (escribe los números separados por espacio)",pista:"range(3) da 0, 1, 2. Multiplica cada uno por 2.",aceptadas:["0 2 4","024","0,2,4","0, 2, 4"],solucion:"0 2 4",explicacion:"i toma 0, 1 y 2; al multiplicar por 2 salen 0, 2 y 4.",tipo:"texto",mundo:"python"},{id:"dominio",titulo:"El dominio impostor",categoria:"Ingeniería social",dificultad:"Media",puntos:150,enunciado:"Te llega este enlace: https://yappy.com.pa.premio-seguro.net/reclamar — ¿cuál es el dominio REAL?",pista:"Busca la parte justo antes de la primera barra y léela desde el final.",aceptadas:["premio-seguro.net"],solucion:"premio-seguro.net",explicacion:"Todo lo de la izquierda (yappy.com.pa.) son subdominios que el atacante inventa. El dominio registrado es premio-seguro.net.",tipo:"texto",mundo:"social"},{id:"codigo-wa",titulo:"El código de seis cifras",categoria:"Ingeniería social",dificultad:"Fácil",puntos:100,enunciado:"Un «amigo» te dice que te llegó por error un código de WhatsApp suyo y te pide que se lo reenvíes. ¿Qué haces?",pista:"¿Para qué sirve ese código realmente?",aceptadas:["b"],solucion:"B",explicacion:"Ese código registra TU número en SU celular. Si lo das, te roban la cuenta y estafan a tus contactos.",tipo:"opciones",mundo:"social",opciones:["Se lo reenvío, es mi amigo","No lo envío: ese código es para robar mi cuenta. Activo el PIN de dos pasos","Se lo envío pero borro el chat","Lo publico en mi estado"]}],glosario:[{termino:"Malware",categoria:"Ataques",definicion:"Cualquier programa hecho para dañarte, espiarte o sacarte plata.",detalle:"Virus, troyanos, spyware y ransomware son familias de malware. La defensa real: descargar de sitios oficiales, actualizar y no abrir adjuntos raros."},{termino:"Ransomware",categoria:"Ataques",definicion:"Malware que cifra tus archivos y pide un rescate por la llave.",detalle:"Pagar no garantiza nada. La única respuesta sólida es un respaldo probado y desconectado (regla 3-2-1)."},{termino:"Parche de seguridad",categoria:"Fundamentos",definicion:"Actualización que cierra un fallo que ya se conoce.",detalle:"Es la defensa número uno: la mayoría de ataques usan fallos que el fabricante ya arregló y el usuario no instaló."},{termino:"TOTP",categoria:"Fundamentos",definicion:"Código de 6 dígitos que cambia cada 30 segundos, generado en tu app.",detalle:"Se calcula con un secreto compartido y la hora. A diferencia del SMS, no depende de tu operador, así que resiste el SIM swapping."},{termino:"Passkey",categoria:"Fundamentos",definicion:"Llave que vive en tu dispositivo y sustituye a la contraseña.",detalle:"Usa criptografía de clave pública: el sitio nunca guarda un secreto que puedan robar. Es lo más resistente al phishing porque va atada al dominio."},{termino:"SIM swapping",categoria:"Ataques",definicion:"Robar tu número de teléfono pidiendo un duplicado de SIM a tu operador.",detalle:"Con tu número, el atacante recibe tus SMS, incluidos los códigos de 2FA. Por eso conviene usar app autenticadora o passkey."},{termino:"Regla 3-2-1",categoria:"Fundamentos",definicion:"3 copias de tus datos, en 2 medios distintos, con 1 fuera de tu casa.",detalle:"Cubre desastres distintos: disco dañado, nube caída, robo, incendio o ransomware. Y hay que probar que se restaure."},{termino:"Huella digital",categoria:"Fundamentos",definicion:"Todo el rastro que dejas: cuentas viejas, apps con permisos, datos regados.",detalle:"Lo que no existe no se filtra. Cerrar cuentas que ya no usas y quitar permisos innecesarios reduce tu superficie de ataque."},{termino:"2FA",categoria:"Fundamentos",definicion:"Verificación en dos pasos: contraseña + algo que tienes.",detalle:"Aunque roben tu contraseña, sin tu celular o llave no entran. Prefiere app autenticadora a SMS."},{termino:"AEAD",categoria:"Simétrica",definicion:"Cifrado autenticado con datos asociados.",detalle:"Proporciona confidencialidad e integridad en una sola operación. Ejemplos: AES-GCM y ChaCha20-Poly1305. Evita combinar cifrado y MAC a mano."},{termino:"AES",categoria:"Simétrica",definicion:"Estándar de cifrado de bloque adoptado en 2001.",detalle:"Advanced Encryption Standard. Bloque de 128 bits con claves de 128, 192 o 256 bits. En producción se usa con modos AEAD como GCM."},{termino:"Afín",categoria:"Clásicos",definicion:"Cifrado clásico E(x) = (a·x + b) mod 26.",detalle:"Solo funciona si «a» es coprimo con 26. Con 312 claves posibles cae ante fuerza bruta y frecuencias, pero enseña aritmética modular jugando."},{termino:"Análisis de frecuencias",categoria:"Ataques",definicion:"Estudio de la repetición de símbolos para romper cifrados.",detalle:"En español la E ronda el 13,7%. Los cifrados de sustitución preservan el patrón de frecuencias, por lo que se rompen con suficiente texto."},{termino:"Argon2id",categoria:"Integridad",definicion:"Función de derivación de claves lenta y resistente a GPU.",detalle:"Ganadora del Password Hashing Competition. Recomendada para almacenar contraseñas: configura memoria, iteraciones y paralelismo, y usa una sal única."},{termino:"Ataque de diccionario",categoria:"Ataques",definicion:"Probar contraseñas reales filtradas y sus variantes.",detalle:"Usa listas como rockyou.txt con reglas (mayúsculas, 123, !). Rompe la mayoría de contraseñas humanas. Se defiende con longitud y gestores."},{termino:"Atbash",categoria:"Clásicos",definicion:"Sustitución espejo: A↔Z, B↔Y…",detalle:"De origen hebreo antiguo. Cifrar y descifrar son la misma operación. Cero seguridad hoy, pero perfecto para entender qué es una sustitución."},{termino:"Bit",categoria:"Redes",definicion:"La unidad mínima de información: 0 o 1.",detalle:"8 bits forman un byte. Las velocidades de internet se miden en bits por segundo (Mbps), los archivos en bytes (MB)."},{termino:"Bucle for",categoria:"Python",definicion:"Repite un bloque de código para cada elemento de una lista.",detalle:"La base de la automatización: revisar mil puertos o mil líneas de log con tres líneas de código."},{termino:"Certificado digital",categoria:"Protocolos",definicion:"Documento firmado que vincula una clave pública con una identidad.",detalle:"Una CA lo emite. El navegador valida la cadena de confianza, la fecha y el dominio antes de aceptar la conexión TLS."},{termino:"chmod",categoria:"Sistemas",definicion:"Comando para cambiar permisos de archivos en Linux.",detalle:"chmod 600 = solo el dueño lee y escribe. chmod 777 = todos pueden todo (nunca lo uses)."},{termino:"Clave pública",categoria:"Asimétrica",definicion:"Parte de un par que se puede distribuir libremente.",detalle:"Se usa para cifrar hacia el destinatario o verificar sus firmas. La clave privada correspondiente nunca se comparte."},{termino:"Colisión",categoria:"Integridad",definicion:"Dos entradas distintas con el mismo hash.",detalle:"Toda función hash las tiene (más entradas que salidas). Lo importante es que sean imposibles de encontrar: MD5 y SHA-1 ya cayeron aquí."},{termino:"Confidencialidad",categoria:"Fundamentos",definicion:"Impedir que quien no está autorizado lea la información.",detalle:"Se consigue con cifrado simétrico o asimétrico, junto con una gestión correcta de claves."},{termino:"CTF",categoria:"Sistemas",definicion:"Capture The Flag: competencia de retos de ciberseguridad.",detalle:"El objetivo es encontrar «banderas» (textos secretos como FV{...}) resolviendo problemas."},{termino:"Curva elíptica",categoria:"Asimétrica",definicion:"Grupo matemático con claves más cortas y misma seguridad.",detalle:"X25519 y Ed25519 son primitivas modernas de Diffie-Hellman y firmas. Una clave de 256 bits de curva equivale aproximadamente a una RSA de 3072 bits."},{termino:"César",categoria:"Clásicos",definicion:"Desplazamiento fijo del alfabeto.",detalle:"E(x) = (x + k) mod 26. Solo 26 claves: se rompe por fuerza bruta en microsegundos. El «hola mundo» de la criptografía."},{termino:"Diceware",categoria:"Fundamentos",definicion:"Método de contraseñas con palabras aleatorias lanzando dados.",detalle:"4-6 palabras de una lista de 7776 dan 50-77 bits de entropía real y son memorizables. La receta recomendada en esta academia."},{termino:"Diffie-Hellman",categoria:"Asimétrica",definicion:"Protocolo para acordar un secreto sobre un canal público.",detalle:"Cada parte elige un secreto y calcula una clave pública. El secreto compartido se obtiene elevando la clave pública ajena al secreto propio. No autentica por sí solo."},{termino:"Dirección IP",categoria:"Redes",definicion:"Número que identifica a un dispositivo en una red.",detalle:"IPv4 son 4 números de 0 a 255 (192.168.1.20). Las privadas solo existen dentro de tu red; la pública es la que ve internet."},{termino:"DNS",categoria:"Redes",definicion:"Sistema que traduce nombres de dominio a direcciones IP.",detalle:"Es la «guía telefónica» de internet. Si lo falsean, te mandan a sitios falsos."},{termino:"Efecto avalancha",categoria:"Integridad",definicion:"Un cambio mínimo altera gran parte de la salida.",detalle:"En un buen cifrado o hash, cambiar un bit de entrada cambia aproximadamente la mitad de los bits de salida, sin relación predecible."},{termino:"Entropía",categoria:"Fundamentos",definicion:"Medida de la incertidumbre de una clave o contraseña.",detalle:"Se mide en bits: longitud × log₂(alfabeto). 128 bits de entropía real hacen inviable una búsqueda exhaustiva."},{termino:"Firewall",categoria:"Redes",definicion:"Filtro que permite o bloquea tráfico según reglas.",detalle:"La política más segura es «denegar por defecto»: solo pasa lo que permites expresamente."},{termino:"Firma digital",categoria:"Asimétrica",definicion:"Prueba verificable de autenticidad e integridad.",detalle:"El emisor firma un hash con su clave privada; cualquiera verifica con su clave pública. Aporta autenticación y no repudio."},{termino:"Forward secrecy",categoria:"Protocolos",definicion:"Las sesiones pasadas siguen seguras si cae la clave privada.",detalle:"Se logra con claves de sesión efímeras que se destruyen al terminar. TLS 1.3 la ofrece por defecto con Diffie-Hellman efímero."},{termino:"Función",categoria:"Python",definicion:"Bloque de código con nombre que puedes reutilizar.",detalle:"Se crea con def, recibe parámetros y devuelve resultados con return."},{termino:"Función hash",categoria:"Integridad",definicion:"Convierte datos de longitud variable en una huella fija.",detalle:"Debe ser determinista, unidireccional y resistente a colisiones. No cifra: cualquiera puede calcular el hash de una entrada."},{termino:"GCM",categoria:"Simétrica",definicion:"Modo Galois/Counter para AES.",detalle:"Convierte AES en AEAD: cifra y autentica a la vez con una etiqueta de 128 bits. Rápido y paralelizable. Su regla de oro: nunca repetir (clave, IV)."},{termino:"HMAC",categoria:"Integridad",definicion:"Código de autenticación con una clave secreta.",detalle:"Verifica integridad y autenticidad entre dos partes que comparten la clave. Distinto de una firma digital: no hay no repudio."},{termino:"Ingeniería social",categoria:"Ataques",definicion:"Manipular personas para que den acceso o información.",detalle:"Usa urgencia, miedo, codicia y autoridad. Se defiende verificando por otro canal."},{termino:"IV",categoria:"Simétrica",definicion:"Valor inicial aleatorio para un modo de cifrado.",detalle:"Evita que mensajes repetidos produzcan el mismo cifrado. En GCM debe ser único por operación; en CBC debe ser impredecible. No es secreto."},{termino:"KDF",categoria:"Integridad",definicion:"Función de derivación de claves.",detalle:"Convierte una contraseña en una clave criptográfica con sal, iteraciones y memoria (Argon2id, PBKDF2, scrypt). Lenta a propósito."},{termino:"Kerckhoffs",categoria:"Fundamentos",definicion:"La seguridad debe depender solo del secreto de la clave.",detalle:"Principio del siglo XIX: un sistema cuyo secreto es el algoritmo no es seguro. Todo puede ser público menos la clave."},{termino:"Kernel",categoria:"Sistemas",definicion:"Núcleo del sistema operativo con privilegios máximos.",detalle:"Maneja memoria, procesos, drivers y seguridad. Un fallo en el kernel es lo más grave posible."},{termino:"MITM",categoria:"Ataques",definicion:"Ataque de intermediario entre dos partes.",detalle:"El atacante se sitúa entre ambas, aparentando ser la otra. TLS lo evita autenticando el servidor con certificados y firmas en el handshake."},{termino:"Modelo de amenaza",categoria:"Fundamentos",definicion:"Suposiciones explícitas sobre qué puede hacer un atacante.",detalle:"Define si el adversario solo observa, puede modificar mensajes o accede al dispositivo. Sin modelo de amenaza, «es seguro» no significa nada."},{termino:"Morse",categoria:"Clásicos",definicion:"Codificación de letras en puntos y rayas.",detalle:"De los 1840s, para telégrafo. Es codificación pública, no cifrado: cualquiera con la tabla lo lee. Sigue vivo en radioafición y aviación."},{termino:"Máscara de subred",categoria:"Redes",definicion:"Indica qué parte de la IP es la red y qué parte es el equipo.",detalle:"/24 = 255.255.255.0: los tres primeros números son la red y caben 254 equipos."},{termino:"NAT",categoria:"Redes",definicion:"Traducción de muchas IPs privadas a una pública.",detalle:"Tu router la usa para que toda tu casa salga a internet con una sola dirección."},{termino:"Nonce",categoria:"Simétrica",definicion:"Número usado una sola vez.",detalle:"En protocolos y cifrados autenticados debe ser único. Repetirlo con la misma clave puede ser catastrófico."},{termino:"OTP",categoria:"Simétrica",definicion:"Libreta de un solo uso: el cifrado perfecto.",detalle:"One-Time Pad: XOR con una clave aleatoria tan larga como el mensaje, usada una vez. Irrompible en teoría, impracticable por la distribución de claves."},{termino:"PBKDF2",categoria:"Integridad",definicion:"Derivación de claves por iteraciones de HMAC.",detalle:"Aplica HMAC miles de veces con sal. Mejor que un hash directo, pero Argon2id es superior hoy por usar memoria además de CPU."},{termino:"Phishing",categoria:"Ataques",definicion:"Engaño con mensajes falsos para robar datos o instalar malware.",detalle:"Por SMS se llama smishing; por llamada, vishing. Se detecta leyendo el dominio real del enlace."},{termino:"Proceso",categoria:"Sistemas",definicion:"Un programa en ejecución, con su memoria y su PID.",detalle:"Casi todo malware termina siendo un proceso; por eso se revisa el administrador de tareas."},{termino:"Puerto",categoria:"Redes",definicion:"Número (0-65535) que indica a qué programa va un dato dentro de un equipo.",detalle:"443 = HTTPS, 22 = SSH, 53 = DNS, 25565 = Minecraft."},{termino:"Rail fence",categoria:"Clásicos",definicion:"Transposición en zigzag sobre rieles.",detalle:"Reordena letras sin cambiarlas. Las frecuencias se conservan, así que el ataque es probar pocos rieles y buscar idioma legible."},{termino:"Rainbow table",categoria:"Ataques",definicion:"Tabla precalculada de hash → contraseña.",detalle:"Permite revertir hashes rápidos al instante. La defensa es la sal única por usuario: obliga a recalcular la tabla para cada sal."},{termino:"Root",categoria:"Sistemas",definicion:"El superusuario de Linux: puede hacer absolutamente todo.",detalle:"Por seguridad se trabaja con un usuario normal y se usa sudo solo cuando hace falta."},{termino:"Router",categoria:"Redes",definicion:"Aparato que conecta redes distintas y decide por dónde va cada paquete.",detalle:"El de tu casa une tu red local con la de tu proveedor de internet y hace NAT."},{termino:"RSA",categoria:"Asimétrica",definicion:"Sistema de clave pública basado en factorizar primos.",detalle:"De 1977. Con 2048+ bits sigue válido para firmas; para intercambio se prefieren curvas elípticas (X25519)."},{termino:"Sal",categoria:"Integridad",definicion:"Datos aleatorios añadidos antes de un hash.",detalle:"Evita que contraseñas iguales generen hashes iguales y bloquea las tablas precalculadas. No es secreta, pero no debe repetirse."},{termino:"Self-XSS",categoria:"Ataques",definicion:"Engaño para que pegues código malicioso en la consola de tu navegador.",detalle:"«Pega esto en F12 y gana premios». Ese código roba tu sesión. Nunca pegues código que no entiendes."},{termino:"SHA-256",categoria:"Integridad",definicion:"Función hash de 256 bits de la familia SHA-2.",detalle:"Produce 64 caracteres hexadecimales. Se usa en firmas, certificados, integridad de archivos y Bitcoin. No debe usarse solo para contraseñas."},{termino:"TCP",categoria:"Redes",definicion:"Protocolo de transporte fiable: confirma y reordena todo.",detalle:"Empieza con el saludo de 3 pasos SYN, SYN-ACK, ACK. Lo usan la web, el correo y los pagos."},{termino:"Timing attack",categoria:"Ataques",definicion:"Ataque que mide tiempos de respuesta.",detalle:"Diferencias de nanosegundos pueden filtrar claves o bytes correctos. Se defiende con código en tiempo constante y sin ramas secretas."},{termino:"TLS",categoria:"Protocolos",definicion:"Capa de transporte segura que protege conexiones.",detalle:"TLS 1.3 combina autenticación por certificados, acuerdo de claves efímero y cifrado AEAD. Es el candado de HTTPS."},{termino:"UDP",categoria:"Redes",definicion:"Protocolo de transporte rápido sin confirmaciones.",detalle:"Ideal para juegos y llamadas en tiempo real, donde es mejor perder un paquete que esperar."},{termino:"Variable",categoria:"Python",definicion:"Nombre que guarda un valor para usarlo después.",detalle:"puerto = 22. Python deduce el tipo según el valor."},{termino:"Vector de ataque",categoria:"Ataques",definicion:"Camino concreto que usa un atacante.",detalle:"Técnico, humano (phishing) o de implementación (IV repetido). La criptografía no arregla una mala arquitectura."},{termino:"Vigenère",categoria:"Clásicos",definicion:"Cifrado polialfabético con clave repetida.",detalle:"Una César distinta por posición. Resistió 300 años hasta Kasiski y Friedman. Se rompe estimando la longitud de clave y atacando cada César."},{termino:"XOR",categoria:"Simétrica",definicion:"Operación bit a bit exclusiva.",detalle:"Reversible: (a ⊕ k) ⊕ k = a. Base de cifrados de flujo; nunca debe reutilizarse el keystream."},{termino:"Zero-knowledge",categoria:"Fundamentos",definicion:"Prueba sin revelar el secreto que la sustenta.",detalle:"Permite demostrar un hecho sin mostrar los datos que lo hacen cierto. Se usa en autenticación avanzada y privacidad."}],tutoriales:[{id:"primer-hash",titulo:"Tu primer hash en 5 minutos",descripcion:"Calcula un SHA-256, entiende por qué cambia todo con una letra y verifica la integridad de un archivo.",nivel:"Básico",minutos:5,icono:"fingerprint",pasos:[{titulo:"Qué vas a conseguir",texto:"Al terminar sabrás calcular una huella SHA-256, explicar el efecto avalancha y verificar que un archivo no fue modificado. Sin instalar nada."},{titulo:"Calcula tu primera huella",texto:"Ve a Herramientas → Hashes. Escribe tu nombre y observa la huella SHA-256. Cambia una sola letra: la huella cambia por completo. Eso es el efecto avalancha.",accion:{label:"Abrir herramientas",vista:"cripto"}},{titulo:"Compara dos mensajes",texto:"Usa el comparador con «hola» y «Hola». Fíjate en el porcentaje de diferencia: cerca del 50% de los caracteres cambian aunque solo varíe una mayúscula."},{titulo:"Verifica algo real",texto:"Descarga cualquier programa que publique su SHA-256 oficial, calcula el hash de tu archivo y compáralos. Si coinciden, nadie lo manipuló por el camino."},{titulo:"Cierra el círculo",texto:"Lee la lección de hashes para entender preimagen, colisiones y por qué un hash solo no autentica. Después intenta el reto «Firma en hexadecimal».",accion:{label:"Ir al reto",vista:"retos"}}]},{id:"cesar-a-mano",titulo:"Cifra y rompe César a mano",descripcion:"El flujo completo de atacante y defensor: cifra un mensaje, intercámbialo y rómpelo por fuerza bruta.",nivel:"Básico",minutos:7,icono:"rotate",pasos:[{titulo:"Cifra tu mensaje",texto:"Abre el laboratorio y carga la receta «César + Base64». Escribe un mensaje secreto y pon desplazamiento 7. Copia el resultado: es tu mensaje interceptado.",accion:{label:"Abrir laboratorio",vista:"cripto"}},{titulo:"Ponte en la piel del espía",texto:"Borra la entrada mentalmente: solo tienes el cifrado. Como hay 26 claves, prueba desplazamientos del 0 al 25 hasta que aparezca español legible. Eso es fuerza bruta."},{titulo:"El atajo inteligente",texto:"Con textos largos no hacen falta 26 pruebas: busca la letra más repetida del cifrado y supón que es la E. Una sola resta te da la clave."},{titulo:"La moraleja",texto:"26 claves no son nada. Compara con AES-256: 2²⁵⁶ claves, más átomos que en el universo observable. La lección de César te lo cuenta con números.",accion:{label:"Ver lección",vista:"cripto"}}]},{id:"nodos-pro",titulo:"Encadena nodos como un pro",descripcion:"Del flujo lineal a pensar en pipelines: orden correcto, puntos de inspección y recetas reutilizables.",nivel:"Intermedio",minutos:8,icono:"network",pasos:[{titulo:"El orden importa",texto:"Cargar «César → Hash» y luego «Hash → César» con la misma entrada. Los resultados son totalmente distintos: cada paso transforma lo que recibe, no hay conmutatividad."},{titulo:"Inspecciona cada paso",texto:"Haz clic en cada nodo del lienzo: el inspector muestra qué entra, qué sale y por qué. Acostúmbrate a verificar intermedios, no solo el final.",accion:{label:"Abrir laboratorio",vista:"cripto"}},{titulo:"Piensa en bytes",texto:"Fíjate en el contador de bytes de la salida. Base64 crece ~33%, el hex duplica, el hash fija el tamaño. El tamaño delata el algoritmo: un atacante también lo mira."},{titulo:"Guarda tu receta",texto:"Exporta tu flujo en JSON y vuelve a importarlo. Así se comparten pipelines en equipos reales: configuración versionada, no capturas de pantalla."}]},{id:"hmac-verify",titulo:"Verifica integridad con HMAC",descripcion:"Por qué un hash solo no basta en una red hostil, y cómo una clave compartida lo arregla.",nivel:"Intermedio",minutos:8,icono:"medal",pasos:[{titulo:"El problema",texto:"Si envías mensaje + SHA-256 por una red que controla el atacante, él modifica ambos y nadie lo nota. El hash verifica integridad solo contra errores, no contra adversarios."},{titulo:"La solución con clave",texto:"Abre la lección de firmas y usa la demo: firma un mensaje con HMAC y una clave. Cambia una letra del mensaje y verifica: la firma ya no cuadra.",accion:{label:"Ver demo de firmas",vista:"cripto"}},{titulo:"Por qué el atacante no puede",texto:"Sin la clave secreta no puede generar un MAC válido para su mensaje falso. La seguridad no está en el algoritmo (público) sino en la clave (secreta). Kerckhoffs, de nuevo."},{titulo:"Cuándo subir de nivel",texto:"HMAC sirve entre dos partes que comparten secreto. Si necesitas que cualquiera verifique (software, webs), pasa a firmas digitales con clave privada. El reto «El hash que no bastó» te lo pone a prueba.",accion:{label:"Intentar el reto",vista:"retos"}}]},{id:"dh-secreto",titulo:"Crea un secreto Diffie-Hellman",descripcion:"Acuerda un número secreto con alguien a la vista de todos, paso a paso y con números pequeños.",nivel:"Avanzado",minutos:10,icono:"key",pasos:[{titulo:"Acuerda lo público",texto:"Ana y Beto publican p=23 y g=5. Todo el mundo los ve, incluido el espía. No pasa nada: lo público no es lo secreto."},{titulo:"Elige tu secreto",texto:"Ana elige a=6 (nadie lo sabe), Beto elige b=15 (nadie lo sabe). En la demo de la lección puedes mover estos valores y ver qué cambia.",accion:{label:"Abrir simulador DH",vista:"cripto"}},{titulo:"Intercambia claves públicas",texto:"Ana envía A = 5⁶ mod 23 = 8. Beto envía B = 5¹⁵ mod 23 = 19. El espía los intercepta. Sigue sin poder hacer nada útil con ellos."},{titulo:"Calcula el secreto",texto:"Ana hace B^a mod 23 = 2. Beto hace A^b mod 23 = 2. Mismo número, cero transmisión del secreto. Ese 2 (en la vida real, 256 bits) cifra la conversación."},{titulo:"El matiz que falta",texto:"DH no autentica: un intermediario podría hacer dos intercambios. Por eso TLS añade certificados y firmas. Lee la lección de TLS para ver el handshake completo."}]},{id:"aes-real",titulo:"Cifra de verdad con AES-GCM",descripcion:"Un cifrado auténtico con contraseña, sal aleatoria e IV único. Entiende cada pieza del formato final.",nivel:"Intermedio",minutos:9,icono:"zap",pasos:[{titulo:"Cifra tu primer mensaje",texto:"Ve a la lección de AES-GCM y usa la demo: escribe un mensaje y una contraseña. Obtendrás algo como FV1.salt.iv.datos. Cifra dos veces lo mismo: sale distinto. Bien.",accion:{label:"Abrir demo AES",vista:"cripto"}},{titulo:"Lee el formato",texto:"FV1 = versión. salt = sal aleatoria para derivar la clave (PBKDF2, 120.000 iteraciones). iv = vector único por mensaje. datos = cifrado + etiqueta de autenticación."},{titulo:"Rompe algo a propósito",texto:"Cambia un carácter del bloque de datos e intenta descifrar: falla. Esa es la etiqueta GCM protegiéndote. Sin autenticación, habrías obtenido basura silenciosa."},{titulo:"Contraseña equivocada",texto:"Prueba descifrar con otra contraseña: también falla, sin revelar nada. Un buen sistema no distingue «clave mal» de «datos corruptos»."},{titulo:"Llévalo al mundo real",texto:"Este esquema (PBKDF2 + AES-GCM + sal/IV aleatorios) es el patrón correcto para cifrar archivos o backups. En producción usa además Argon2id y librerías auditadas."}]},{id:"primer-servidor",titulo:"Protege tu servidor de Minecraft",descripcion:"Whitelist, puertos y contraseñas: lo mínimo antes de invitar a tus panas.",nivel:"Básico",minutos:8,icono:"grass",pasos:[{titulo:"Activa la whitelist",texto:"En server.properties pon white-list=true y agrega a tus amigos con /whitelist add nombre. Así solo entra quien tú quieras.",accion:{label:"Ver mundo Redes",vista:"redes"}},{titulo:"Abre solo el puerto necesario",texto:"En el router redirige únicamente el 25565 TCP a la IP de tu PC. Nada de abrir rangos enteros ni activar la «DMZ».",accion:{label:"Practicar con el firewall",vista:"redes"}},{titulo:"Mantén online-mode=true",texto:"Así el servidor verifica que cada jugador tenga una cuenta legítima. Con false, cualquiera entra con cualquier nombre (incluido el tuyo de admin)."},{titulo:"No des OP a la ligera",texto:"Los permisos de operador son como root: solo para ti y alguien de máxima confianza.",accion:{label:"Ver lección de permisos",vista:"sistemas"}},{titulo:"Haz backups",texto:"Copia la carpeta del mundo cada semana a otro disco o a la nube. Si alguien lo destruye o un plugin falla, restauras en minutos."}]},{id:"cuenta-blindada",titulo:"Blinda tu WhatsApp en 3 minutos",descripcion:"PIN de dos pasos, privacidad y cómo reaccionar si te roban la cuenta.",nivel:"Básico",minutos:5,icono:"heart",pasos:[{titulo:"Activa la verificación en dos pasos",texto:"Ajustes → Cuenta → Verificación en dos pasos → Activar. Crea un PIN de 6 dígitos que no sea tu cumpleaños y agrega un correo de recuperación."},{titulo:"Revisa los dispositivos vinculados",texto:"Ajustes → Dispositivos vinculados. S
